<style>
  .sqa-opt { display: flex; align-items: center; gap: 14px; min-height: 48px; padding: 6px 20px; text-decoration: none; color: #202124; }
  .sqa-opt:hover { background: #F1F3F4; }
  .sqa-sec { padding: 12px 20px 4px; font-size: 12px; line-height: 16px; font-weight: 500; color: #5F6368; }
</style>
<div style="position: relative; min-height: 720px; background: #F8F9FA; color: #202124; font-family: 'Google Sans Flex', 'Google Sans', Roboto, system-ui, sans-serif; font-size: 14px; line-height: 20px; overflow: hidden">

  <header style="position: relative; z-index: 3; box-sizing: border-box; min-height: 64px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding: 8px 16px 8px 20px; background: #FFFFFF; border-bottom: 1px solid #DADCE0">
    <span style="display: flex; align-items: center; gap: 10px; min-width: 208px">
      <svg width="32" height="32" viewBox="30 30 545 545" aria-hidden="true"><g fill="none" stroke-width="72" stroke-linecap="round"><path d="M165.2 100.8A188 188 0 0 1 358.8 100.8" stroke="#FBBC04"></path><path d="M423.2 165.2A188 188 0 0 1 423.2 358.8" stroke="#4285F4"></path><path d="M358.8 423.2A188 188 0 0 1 165.2 423.2" stroke="#EA4335"></path><path d="M100.8 358.8A188 188 0 0 1 100.8 165.2" stroke="#34A853"></path><path d="M432 432L528 528" stroke="#202124"></path></g><circle cx="262" cy="262" r="34" fill="#4285F4"></circle></svg>
      <span style="font-size: 22px; line-height: 28px; font-weight: 700; letter-spacing: -0.2px; color: #202124">Squint</span>
    </span>

    <div style="position: relative; flex: 1 1 360px; max-width: 720px">
      <div style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 8px 0 16px; border-radius: 24px 24px 0 0; background: #FFFFFF; box-shadow: 0 1px 2px rgba(60,64,67,.3), 0 2px 6px 2px rgba(60,64,67,.15)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true" class="sq-sparkle"><path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7-4.7-1.8 4.7-1.8z"></path><path d="M18.5 15.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"></path></svg>
        <label for="q1" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Ask about your users</label>
        <input id="q1" type="text" autocomplete="off" value="{{q}}" onInput="{{onInput}}" onKeydown="{{onKey}}" style="flex: 1; min-width: 0; height: 40px; border: 0; background: transparent; font-family: inherit; font-size: 16px; color: #202124; outline: none">
        <button type="button" onClick="{{go}}" style="height: 36px; padding: 0 16px; border: 0; border-radius: 18px; background: #1A73E8; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; cursor: pointer">Ask</button>
      </div>

      <div role="listbox" aria-label="Ask or open a past question" style="position: absolute; left: 0; right: 0; top: 48px; background: #FFFFFF; border-radius: 0 0 24px 24px; box-shadow: 0 4px 6px 2px rgba(60,64,67,.15), 0 2px 2px rgba(60,64,67,.3); padding: 0 0 12px; border-top: 1px solid #E8EAED">
        <template data-sc="if" value="{{hasQ}}" hint-placeholder-val="{{ true }}">
        <a class="sqa-opt" href="ChatNow.dc.html" onClick="{{goLink}}" role="option" aria-selected="true" style="background: #F1F3F4">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true" class="sq-sparkle"><path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7-4.7-1.8 4.7-1.8z"></path><path d="M18.5 15.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"></path></svg>
          <span style="flex: 1; min-width: 0; overflow-wrap: anywhere"><span style="font-weight: 500">Ask Squint:</span> “{{q}}”</span>
          <kbd>Enter</kbd>
        </a>
        </template>
        <div class="sqa-sec">With this page's context</div>
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 4px 20px 8px 54px">
          <template data-sc="if" value="{{hasFrom}}" hint-placeholder-val="{{ true }}"><span class="mini" style="background: #E8F0FE; color: #174EA6">{{from}}</span></template>
          <span class="mini" style="background: #F1F3F4; color: #3C4043">{{scopeChip}}</span>
        </div>
        <template data-sc="if" value="{{hasHist}}" hint-placeholder-val="{{ true }}">
        <div class="sqa-sec">From your history</div>
        <template data-sc="for" list="{{hist}}" as="h" hint-placeholder-count="2">
        <a class="sqa-opt" href="ChatNow.dc.html" onClick="{{h.open}}" role="option" aria-selected="false">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5F6368" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>
          <span style="flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px">{{h.title}} <span class="mini" style="background: #F1F3F4; color: #3C4043">{{h.scope}}</span><template data-sc="if" value="{{h.hasProblem}}" hint-placeholder-val="{{ false }}"><span class="mini" style="background: #FCE8E6; color: #C5221F">{{h.problem}}</span></template></span>
          <span class="cap">{{h.when}}</span>
        </a>
        </template>
        </template>
        <div class="sqa-sec">Suggested</div>
        <template data-sc="for" list="{{suggest}}" as="x" hint-placeholder-count="2">
        <a class="sqa-opt" href="ChatNow.dc.html" onClick="{{x.go}}" role="option" aria-selected="false">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true" class="sq-sparkle"><path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7-4.7-1.8 4.7-1.8z"></path><path d="M18.5 15.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"></path></svg>
          <span style="flex: 1">{{x.q}}</span>
        </a>
        </template>
        <div class="cap" style="display: flex; gap: 16px; padding: 10px 20px 0; border-top: 1px solid #F1F3F4; margin-top: 8px">
          <span><kbd>↑</kbd> <kbd>↓</kbd> to move</span><span><kbd>Enter</kbd> to ask or open</span><span><kbd>Esc</kbd> to close</span>
        </div>
      </div>
    </div>

    <div style="margin-left: auto; display: flex; align-items: center; gap: 8px">
      <span style="display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px 0 12px; border-radius: 18px; border: 1px solid #DADCE0; color: #3C4043; font-size: 14px; font-weight: 500"><span style="width: 8px; height: 8px; border-radius: 4px; background: #1E8E3E"></span>Data reliable <span style="font-weight: 400; color: #5F6368">· 1 note</span></span>
      <span style="width: 32px; height: 32px; border-radius: 16px; background: #1E8E3E; color: #FFFFFF; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center">J</span>
    </div>
  </header>

  <div aria-hidden="true" style="position: absolute; inset: 64px 0 0 0; z-index: 1; display: flex; gap: 32px; padding: 28px 32px 0 24px; box-sizing: border-box">
    <div style="flex: 0 0 220px; display: flex; flex-direction: column; gap: 12px">
      <div class="sk" style="height: 36px; width: 180px; background: #D2E3FC"></div>
      <div class="sk" style="height: 28px; width: 140px"></div>
      <div class="sk" style="height: 28px; width: 150px"></div>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 20px">
      <div style="display: flex; flex-direction: column; gap: 6px"><span class="cap">Explore</span><span style="font-size: 28px; line-height: 36px; color: #5F6368">Journeys</span></div>
      <div style="background: #FFFFFF; border: 1px solid #DADCE0; border-radius: 12px; height: 360px; padding: 28px 32px; box-sizing: border-box; display: flex; gap: 32px">
        <div style="width: 180px; height: 300px; border: 2px solid #DADCE0; border-radius: 22px"></div>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 16px">
          <span style="font-size: 14px; color: #1967D2; font-weight: 500">Biggest leak in this journey</span>
          <span style="font-size: 26px; line-height: 34px; color: #5F6368">{{headline}}</span>
          <div class="sk" style="height: 10px; width: 60%"></div>
          <div style="display: flex; gap: 10px"><div class="sk" style="height: 72px; flex: 1"></div><div class="sk" style="height: 72px; flex: 1"></div><div class="sk" style="height: 72px; flex: 1"></div></div>
        </div>
      </div>
    </div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 64px 0 0 0; z-index: 2; background: rgba(32,33,36,.32)"></div>
</div>
