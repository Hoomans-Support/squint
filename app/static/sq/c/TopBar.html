<header style="box-sizing: border-box; min-height: 64px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding: 8px 16px 8px 20px; background: #F8F9FA; border-bottom: 0; font-family: 'Google Sans Flex', 'Google Sans', Roboto, system-ui, sans-serif; color: #202124">
  <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #5F6368; min-width: 208px">
    <svg width="32" height="32" viewBox="30 30 545 545" aria-hidden="true"><g fill="none" stroke-width="72" stroke-linecap="round"><path d="M165.2 100.8A188 188 0 0 1 358.8 100.8" stroke="#FBBC04"></path><path d="M423.2 165.2A188 188 0 0 1 423.2 358.8" stroke="#4285F4"></path><path d="M358.8 423.2A188 188 0 0 1 165.2 423.2" stroke="#EA4335"></path><path d="M100.8 358.8A188 188 0 0 1 100.8 165.2" stroke="#34A853"></path><path d="M432 432L528 528" stroke="#202124"></path></g><circle cx="262" cy="262" r="34" fill="#4285F4"></circle></svg>
    <span style="font-size: 22px; line-height: 28px; font-weight: 700; letter-spacing: -0.2px; color: #202124">Squint</span>
  </a>

  <div data-menu="workspace" class="sq-workspace-menu">
    <button type="button" data-fk="menu-workspace" aria-expanded="{{workspaceOpen}}" aria-label="Workspace: {{workspaceName}}" onclick="{{toggleWorkspace}}" class="sq-workspace-trigger">
      <span class="sq-workspace-trigger-name">{{workspaceName}}</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m7 10 5 5 5-5"></path></svg>
    </button>
    <template data-sc="if" value="{{workspaceOpen}}" hint-placeholder-val="{{ false }}"><div class="sq-workspace-popover" role="dialog" aria-label="Workspaces">
      <div class="sq-workspace-title">Your workspaces</div>
      <template data-sc="for" list="{{workspaces}}" as="ws" hint-placeholder-count="2">
        <button type="button" class="sq-workspace-option" aria-current="{{ws.current}}" onclick="{{ws.select}}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
          <span>{{ws.name}}</span>
          <template data-sc="if" value="{{ws.current}}" hint-placeholder-val="{{ false }}"><svg class="sq-workspace-check" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m5 12 4 4L19 6"></path></svg></template>
        </button>
      </template>
      <div class="sq-workspace-note"><b>Private by default</b><br>Workspace names stay in this browser. The demo data is synthetic and shared across workspaces; separate project data is not connected.</div>
      <button type="button" class="sq-workspace-create" onclick="{{createWorkspace}}" aria-label="{{createLabel}}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        <span>{{createLabel}}</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
      </button>
    </div></template>
  </div>

  <div style="margin-left: auto; display: flex; align-items: center; gap: 4px">
    <button type="button" onclick="{{goAsk}}" aria-label="Chat now" title="Chat now" style="width: 40px; height: 40px; border-radius: 20px; border: 0; background: transparent; color: #1A73E8; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
      <svg class="sq-sparkle" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7-4.7-1.8 4.7-1.8z"></path><path d="M18.5 15.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"></path></svg>
    </button>
    <div data-menu="help" style="position: relative"><button type="button" data-fk="menu-help" aria-expanded="{{helpOpen}}" onclick="{{toggleHelp}}" aria-label="Help" style="width: 40px; height: 40px; border-radius: 20px; border: 0; background: transparent; color: #5F6368; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 9.5a2.5 2.5 0 1 1 3.6 2.2c-.7.4-1.1 1-1.1 1.8v.5"></path><circle cx="12" cy="17" r=".6" fill="currentColor"></circle></svg>
    </button><template data-sc="if" value="{{helpOpen}}" hint-placeholder-val="{{ false }}"><div role="note" style="position: absolute; top: 44px; right: 0; z-index: 20; width: 390px; max-width: min(390px, calc(100vw - 24px)); box-sizing: border-box; padding: 16px 18px; background: #FFFFFF; border-radius: 12px; border: 1px solid #DADCE0; box-shadow: 0 1px 2px rgba(60,64,67,.3), 0 2px 6px 2px rgba(60,64,67,.15); font-size: 12px; line-height: 18px; color: #3C4043; display: flex; flex-direction: column; gap: 9px">
      <p style="margin: 0"><b>How Squint works:</b> It analyzes app events. Watchdog flags unusual drop-offs; Gemini explains findings from the available evidence but does not confirm root causes. AI can be wrong, so check the evidence before acting.</p>
      <p style="margin: 0"><b>This sample:</b> {{datasetLine}}. It is synthetic, not real people. The demo is not connected to your systems or payment ledger. The pipeline reads synthetic wallet events from BigQuery; the site displays read-only source metadata and does not query BigQuery.</p>
      <p style="margin: 0"><b>Reading the numbers:</b> Calculated values come from event data and rules. AI is model-written explanation; Mock data is illustrative, not measured. Metrics can use different windows and coverage.</p>
      <p style="margin: 0"><b>Confidence and value:</b> Small session counts mean less confidence; segment risks require at least 50 sessions and a rate at least 1.5× the overall rate. {{valueAssumption}} USD conversion uses a fixed PHP 56 per dollar rate, not a live rate.</p>
      <p style="margin: 0"><b>Audience and replay limits:</b> Audience exports contain counts, not person IDs, and audience groups can overlap. Some repeat and return measures are saturated by the synthetic generator; 30-day return history is incomplete. Purchase counts omit refunds and off-app payments. Session views are wireframes rebuilt from synthetic events, not recordings.</p>
    </div></template></div>
    <div data-menu="settings" style="position: relative"><button type="button" data-fk="menu-settings" aria-expanded="{{settingsOpen}}" onclick="{{toggleSettings}}" aria-label="Settings: currency, theme, alerts" style="width: 40px; height: 40px; border-radius: 20px; border: 0; background: transparent; color: #5F6368; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"></path><circle cx="15" cy="7" r="2"></circle><circle cx="9" cy="17" r="2"></circle></svg>
    </button><template data-sc="if" value="{{settingsOpen}}" hint-placeholder-val="{{ false }}"><div role="note" class="sq-settings-popover" style="position: absolute; top: 48px; right: 0; z-index: 20; width: 292px; box-sizing: border-box; padding: 18px; background: #FFFFFF; border-radius: 14px; border: 1px solid #DADCE0; box-shadow: 0 8px 24px rgba(60,64,67,.18), 0 2px 6px rgba(60,64,67,.1); font-size: 13px; color: #3C4043; display: flex; flex-direction: column; gap: 16px">
      <div class="sq-settings-heading"><strong>Settings</strong><span>Display and alert preferences</span></div>
      <div class="sq-settings-row sq-settings-section">
        <div class="sq-settings-label">Theme</div>
        <label class="sq-settings-toggle" title="Switch between light and dark theme">
          <input type="checkbox" role="switch" checked="{{themeDark}}" onchange="{{toggleTheme}}" aria-label="Dark theme">
          <span class="sq-settings-toggle-track" aria-hidden="true" style="background: {{themeTrackBg}}"></span>
          <span class="sq-settings-toggle-knob" aria-hidden="true" style="left: {{themeKnobLeft}}; color: #1A73E8">
            <template data-sc="if" value="{{themeDark}}" hint-placeholder-val="{{ false }}"><svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"></path></svg></template>
            <template data-sc="if" value="{{themeLight}}" hint-placeholder-val="{{ false }}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"></circle><path d="M12 2.5v2.5M12 19v2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M2.5 12H5M19 12h2.5M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"></path></svg></template>
          </span>
        </label>
      </div>
      <div class="sq-settings-row sq-settings-section"><div><div class="sq-settings-label">Currency</div><div class="sq-settings-help">Show values in USD only</div></div>
        <label style="position: relative; display: inline-flex; width: 36px; height: 20px; cursor: pointer">
          <input type="checkbox" checked="{{usdOnly}}" onchange="{{toggleCurrency}}" aria-label="USD only" style="position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer">
          <span aria-hidden="true" style="position: absolute; inset: 0; border-radius: 10px; background: {{usdOnlyTrackBg}}; transition: background .15s"></span>
          <span aria-hidden="true" style="position: absolute; top: 2px; left: {{usdOnlyKnobLeft}}; width: 16px; height: 16px; border-radius: 8px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(60,64,67,.4); transition: left .15s"></span>
        </label>
      </div>
      <div class="sq-settings-row sq-settings-section">
        <div class="sq-settings-label">Overview alerts</div>
        <div class="sq-settings-alert-control">
          <template data-sc="if" value="{{alertsAll}}" hint-placeholder-val="{{ false }}"><span class="sq-settings-alert-count" aria-label="{{critCount}} critical alerts">{{critCount}}</span></template>
          <label class="sq-settings-toggle" title="Show all alerts or only critical alerts">
            <input type="checkbox" role="switch" checked="{{alertsCrit}}" onchange="{{toggleAlerts}}" aria-label="Critical alerts only">
            <span class="sq-settings-toggle-track" aria-hidden="true" style="background: {{alertsTrackBg}}"></span>
            <span class="sq-settings-toggle-knob" aria-hidden="true" style="left: {{alertsKnobLeft}}; color: #1A73E8">
              <template data-sc="if" value="{{alertsAll}}" hint-placeholder-val="{{ false }}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z"></path><circle cx="12" cy="12" r="2.5"></circle></svg></template>
              <template data-sc="if" value="{{alertsCrit}}" hint-placeholder-val="{{ false }}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"></path><path d="M10.6 5.7A10.6 10.6 0 0 1 12 5.5c6.5 0 10 6.5 10 6.5a16.3 16.3 0 0 1-3.1 3.9M6.6 6.6C3.7 8.5 2 12 2 12s3.5 6.5 10 6.5a9.6 9.6 0 0 0 3.4-.6"></path><path d="M9.9 9.9a2.5 2.5 0 0 0 3.5 3.5"></path></svg></template>
            </span>
          </label>
        </div>
      </div>
    </div></template></div>
    <button type="button" aria-label="Account: Jane" style="width: 40px; height: 40px; border-radius: 20px; border: 0; background: transparent; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
      <span style="width: 32px; height: 32px; border-radius: 16px; background: #1E8E3E; color: #FFFFFF; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center">J</span>
    </button>
  </div>
</header>
