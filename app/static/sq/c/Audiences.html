<div style="min-height: 100vh; background: #F8F9FA; color: #202124; font-family: 'Google Sans Flex', 'Google Sans', Roboto, system-ui, sans-serif; font-size: 14px; line-height: 20px">
  <dc-import name="TopBar" hint-size="100%,64px"></dc-import>
  <div style="display: flex; flex-wrap: wrap; align-items: flex-start">
    <div style="flex: 1 1 256px; max-width: 100%"><dc-import name="NavRail" active="audiences" hint-size="256px,640px"></dc-import></div>
    <main style="flex: 999 1 560px; min-width: 0; padding: 28px 32px 64px; box-sizing: border-box">
      <div style="max-width: 1120px; display: flex; flex-direction: column; gap: 24px">
        <div><div class="cap" style="margin-bottom: 4px">Explore</div><h1 style="margin: 0; font-size: 28px; line-height: 36px; font-weight: 400">Audiences</h1><p style="margin: 4px 0 0; color: #5F6368"><span style="font-weight: 500; color: #202124">Who should we target, win back or protect?</span> Screen fixes live in <a href="Journeys.dc.html" style="text-decoration: none; font-weight: 500">Journeys</a>.</p></div>
        <dc-import name="ScopeBar" hint-size="100%,40px"></dc-import>
        <dc-import name="PersonaCompare" page="audiences" hint-size="100%,auto"></dc-import>
        <template data-sc="if" value="{{notComparisonMode}}" hint-placeholder-val="{{ true }}">

        <section class="card" aria-labelledby="top" style="padding: 28px 32px; display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start">
          <figure style="margin: 0; display: flex; flex-direction: column; gap: 14px; flex: 0 1 340px">
            <div style="display: flex; align-items: center; gap: 10px"><span class="num" style="font-size: 40px; line-height: 48px; color: #1A73E8">{{topPeople}}</span><span class="cap" style="font-size: 13px">people stalled at {{topScreen}}<br>in the synthetic sample</span></div>
            <div class="sq-wipe" style="display: flex; height: 20px; border-radius: 6px; overflow: hidden; gap: 2px" role="img" aria-label="Win-back outcomes from the synthetic sample"><template data-sc="for" list="{{topStates}}" as="s"><div style="width: {{s.width}}; background: {{s.color}}"></div></template></div>
            <div style="display: grid; grid-template-columns: auto 1fr auto; gap: 6px 10px; align-items: center; font-size: 13px"><template data-sc="for" list="{{topStates}}" as="s"><span class="dot" style="background: {{s.color}}"></span><span>{{s.label}}</span><span class="num">{{s.people}}</span></template></div>
            <figcaption><span class="chip" style="background: #E8F0FE; color: #174EA6">Calculated</span></figcaption>
          </figure>
          <div style="flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
            <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px"><h2 id="top" style="margin: 0; font-size: 14px; line-height: 20px; font-weight: 500; color: #1967D2">Top audience to act on</h2><span class="chip" style="background: #E8F0FE; color: #174EA6">Win back</span><span class="chip" style="background: #F1F3F4; color: #3C4043">{{rank}}</span></div>
            <p style="margin: 0; font-size: 28px; line-height: 36px">{{topTitle}}</p><p style="margin: 0; color: #5F6368">{{topAdvice}}</p>
            <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px"><button type="button" class="btn btn-filled" data-fk="audience-copy" onclick="{{copy}}">Copy audience summary</button><a class="btn btn-outlined" href="Journeys.dc.html">Check the fix in Journeys</a><span class="cap">{{copyMessage}}</span></div>
          </div>
        </section>

        <section aria-labelledby="more" style="display: flex; flex-direction: column; gap: 12px">
          <div class="sq-hover-info" style="display: flex; align-items: center; gap: 6px; position: relative">
            <h2 id="more" class="h2" style="margin: 0">Other audiences</h2>
            <button type="button" aria-label="What these cards mean" style="width: 20px; height: 20px; border-radius: 10px; border: 1px solid #DADCE0; background: #FFFFFF; color: #5F6368; font-size: 11px; line-height: 1; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0">i</button>
            <div role="note" style="position: absolute; top: 26px; left: 0; z-index: 10; width: 320px; max-width: min(320px, calc(100vw - 48px)); box-sizing: border-box; padding: 12px 16px; background: #FFFFFF; border-radius: 8px; border: 1px solid #DADCE0; box-shadow: 0 1px 2px rgba(60,64,67,.3), 0 2px 6px 2px rgba(60,64,67,.15); font-size: 13px; line-height: 20px; color: #3C4043">
              <div style="display: flex; flex-direction: column; gap: 6px">
                <p style="margin: 0"><span class="chip" style="background: #E8F0FE; color: #174EA6">Win back</span> people who stalled or stopped buying, worth re-engaging.</p>
                <p style="margin: 0"><span class="chip" style="background: #E8F0FE; color: #174EA6">Target</span> a group worth a promo or offer.</p>
                <p style="margin: 0"><span class="chip" style="background: #E6F4EA; color: #137333">Keep</span> good behavior worth protecting from a known bug.</p>
                <p style="margin: 0"><span class="chip" style="background: #F1F3F4; color: #3C4043">Protect</span> a risk pattern worth a safeguard.</p>
              </div>
            </div>
          </div>
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; align-items: start">
            <template data-sc="for" list="{{cardGroups}}" as="group">
              <section aria-label="{{group.verb}} audiences" style="display: flex; flex-direction: column; gap: 10px">
                <h3 style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 500">{{group.verb}}</h3>
                <div style="display: flex; flex-direction: column; gap: 12px">
                  <template data-sc="for" list="{{group.cards}}" as="c"><article class="card" style="padding: 20px; display: flex; flex-direction: column; gap: 10px"><div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap"><span class="tag {{c.tagClass}}">{{c.tag}}</span></div><div class="track" role="img" aria-label="{{c.share}} of active people"><span style="display: block; width: {{c.fill}}; height: 100%; background: {{c.fg}}"></span></div><span>{{c.title}}</span><span class="cap num">{{c.people}} people · {{c.share}} of active people</span><span class="cap">{{c.basis}}</span><span class="cap">{{c.action}}</span></article></template>
                </div>
              </section>
            </template>
          </div></section>

        <section id="signals" aria-labelledby="unlock" style="display: flex; flex-direction: column; gap: 12px"><div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px"><div style="display: flex; align-items: center; gap: 8px"><h2 id="unlock" class="h2">People signals</h2><details class="ds-context"><summary aria-label="About people signals and audience groups">i</summary><div role="note">User groups describe who people are, while audiences group people by behavior. {{ungrouped.share}} of {{total}} active people are not yet grouped.</div></details></div></div>
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 12px">
            <article class="card" style="padding: 20px; display: flex; flex-direction: column; gap: 14px"><div style="display: flex; align-items: center; justify-content: space-between; gap: 8px"><h3 style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 500">Return visits</h3><span class="chip" style="background: #E6F4EA; color: #137333">Calculated</span></div><span class="src">App tracker · people who returned after an unfinished journey</span>
              <div role="img" aria-label="Return visit rates in the synthetic sample" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: 140px; gap: 10px; align-items: end; height: 140px"><template data-sc="for" list="{{returns}}" as="r"><div style="display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; height: 100%; min-width: 0"><span class="num" style="font-weight: 500; font-size: 13px">{{r.rate}}</span><span class="sq-grow-y" style="height: {{r.height}}; background: {{r.color}}; border-radius: 4px 4px 0 0"></span><span class="cap">{{r.label}}</span></div></template></div>
              <div style="display: flex; flex-direction: column; gap: 6px; padding-top: 12px"><span class="lbl">Back within 1 day, by user group</span><template data-sc="for" list="{{groupRows}}" as="r"><div style="display: grid; grid-template-columns: minmax(90px, 120px) 1fr auto; gap: 10px; align-items: center; font-size: 13px"><span>{{r.name}}</span><span class="track"><span style="display: block; width: {{r.width}}; height: 100%; background: #8AB4F8"></span></span><span class="num">{{r.value}}</span></div></template><span class="cap">{{returnNote}}</span></div>
            </article>
            <article class="card" style="padding: 20px; display: flex; flex-direction: column; gap: 14px"><div style="display: flex; align-items: center; justify-content: space-between; gap: 8px"><h3 style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 500">Repeat purchases</h3><span class="chip" style="background: #FEF7E0; color: #B06000">Partial</span></div><span class="src">App tracker · completed-transaction events</span><div style="display: flex; flex-direction: column; gap: 8px"><span class="lbl">Last 14 days · {{repeatBuyers}} buyers</span><template data-sc="for" list="{{repeat}}" as="b"><div style="display: grid; grid-template-columns: minmax(72px, 100px) 1fr auto; gap: 10px; align-items: center; font-size: 13px"><span>{{b.label}}</span><span class="track"><span style="display: block; width: {{b.width}}; height: 100%; background: #8AB4F8"></span></span><span class="num">{{b.share}}</span></div></template></div><p class="cap" style="margin: 0">{{repeatHelp}}</p><a href="DataSources.dc.html" style="font-weight: 500; text-decoration: none; font-size: 13px">What more data could add · Data sources →</a></article>
            <article class="card" style="padding: 20px; display: flex; flex-direction: column; gap: 12px; border-style: dashed"><div style="display: flex; align-items: center; justify-content: space-between; gap: 8px"><h3 style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 500">Lifetime value</h3><span class="chip" style="background: #F1F3F4; color: #3C4043">Needs backend</span></div><span class="src">Backend database · payments or ledger</span><a href="DataSources.dc.html" style="font-weight: 500; text-decoration: none; font-size: 13px; margin-top: auto">What more data could add · Data sources →</a></article>
          </div>
        </section>

        <section class="card" aria-labelledby="mix" style="padding: 24px; display: flex; flex-direction: column; gap: 16px"><div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px"><h2 id="mix" class="h2" style="font-size: 16px">{{total}} active people, by behavior</h2><span class="cap">Context · calculated, synthetic sample</span></div><div class="sq-wipe" style="display: flex; height: 16px; border-radius: 8px; overflow: hidden; gap: 2px" role="img" aria-label="Active people grouped by behavior"><template data-sc="for" list="{{segments}}" as="s"><div title="{{s.label}} {{s.share}}" style="width: {{s.width}}; background: {{s.color}}"></div></template></div><div style="display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 13px"><template data-sc="for" list="{{segments}}" as="s"><span style="display: inline-flex; align-items: center; gap: 6px"><span class="dot" style="background: {{s.color}}"></span>{{s.label}} <span class="num" style="font-weight: 500">{{s.share}}</span></span></template></div></section>
                </template>
      </div>
    </main>
  </div>
</div>
