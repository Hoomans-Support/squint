<div role="group" aria-label="Scope of this view" style="box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-height: 40px; font-family: 'Google Sans Flex', 'Google Sans', Roboto, system-ui, sans-serif; font-size: 14px; line-height: 20px; color: #3C4043">
  <div data-menu="range" style="position: relative">
    <button type="button" data-fk="menu-range" aria-haspopup="menu" aria-expanded="{{rangeStr}}" onclick="{{toggleRange}}" style="{{rangeChip}}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6368" stroke-width="1.75" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg>
      {{rangeLabel}}
      <span style="font-weight: 400; color: #5F6368">{{rangeDates}}</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6368" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M7 10l5 5 5-5"></path></svg>
    </button>
    <template data-sc="if" value="{{openRange}}" hint-placeholder-val="{{ false }}">
      <div role="menu" aria-label="Date range" style="position: absolute; top: 44px; left: 0; z-index: 10; width: 280px; max-width: calc(100vw - 32px); box-sizing: border-box; background: #FFFFFF; border-radius: 8px; border: 1px solid #DADCE0; box-shadow: 0 1px 2px rgba(60,64,67,.3), 0 2px 6px 2px rgba(60,64,67,.15); padding: 8px 0">
        <template data-sc="for" list="{{ranges}}" as="r" hint-placeholder-count="3">
          <button type="button" class="scope-range-option" role="menuitemradio" aria-checked="{{r.selected}}" data-fk="{{r.fk}}" onclick="{{r.pick}}" style="display: flex; align-items: center; gap: 12px; width: 100%; height: 40px; padding: 0 16px; border: 0; background: transparent; font-family: inherit; font-size: 14px; text-align: left; cursor: pointer; color: #202124">
            <span style="flex: 1; font-weight: 500">{{r.label}}</span>
            <span style="color: #5F6368">{{r.dates}}</span>
          </button>
        </template>
      </div>
    </template>
  </div>

  <template data-sc="if" value="{{showUserGroups}}" hint-placeholder-val="{{ true }}">
  <div data-menu="user" style="position: relative">
    <button type="button" data-fk="menu-user" aria-haspopup="menu" aria-expanded="{{userStr}}" onclick="{{toggleUser}}" style="{{userChip}}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3"></circle><path d="M3.5 19.5a5.5 5.5 0 0 1 11 0"></path><circle cx="17" cy="9" r="2.5"></circle><path d="M16 14.2a4.5 4.5 0 0 1 4.5 5.3"></path></svg>
      {{userLabel}}
      <span style="font-weight: 400; color: #5F6368">{{userCount}}</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M7 10l5 5 5-5"></path></svg>
    </button>
    <template data-sc="if" value="{{openUser}}" hint-placeholder-val="{{ false }}">
      <div role="group" aria-label="User groups" style="position: absolute; top: 44px; left: 0; z-index: 10; width: 300px; max-width: calc(100vw - 32px); box-sizing: border-box; background: #FFFFFF; border-radius: 8px; border: 1px solid #DADCE0; box-shadow: 0 1px 2px rgba(60,64,67,.3), 0 2px 6px 2px rgba(60,64,67,.15); padding: 8px 0">
        <div style="padding: 8px 16px 4px; font-size: 12px; font-weight: 500; color: #5F6368">User groups · users in sample</div>
        <template data-sc="for" list="{{groups}}" as="g" hint-placeholder-count="6">
          <label style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 16px; cursor: pointer">
            <input type="checkbox" data-fk="{{g.fk}}" checked="{{g.checked}}" onchange="{{g.pick}}" style="width: 18px; height: 18px; accent-color: #1A73E8; margin: 0">
            <template data-sc="if" value="{{g.isAll}}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{g.color}}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><circle cx="9" cy="8" r="3"></circle><path d="M3.5 19v-1.2A4.8 4.8 0 0 1 8.3 13h1.4a4.8 4.8 0 0 1 4.8 4.8V19z"></path><path d="M16 13.2a4.8 4.8 0 0 1 4.5 4.6V19h-3.1"></path><path d="M15.7 5.2a3 3 0 0 1 0 5.7"></path></svg></template>
            <template data-sc="if" value="{{g.isUnregistered}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{g.color}}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><circle cx="12" cy="9" r="3"></circle><path d="M6.5 19a5.5 5.5 0 0 1 11 0"></path><circle cx="12" cy="12" r="9.2" stroke-dasharray="2.2 3"></circle></svg></template>
            <template data-sc="if" value="{{g.isLargeBusiness}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{g.color}}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><rect x="4" y="8" width="16" height="11" rx="2"></rect><path d="M9 8V6a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"></path><path d="M4 13h16"></path></svg></template>
            <template data-sc="if" value="{{g.isRetail}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{g.color}}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M4 9l1-4h14l1 4"></path><path d="M4 9a2 2 0 0 0 4 0 2 2 0 0 0 4 0 2 2 0 0 0 4 0 2 2 0 0 0 4 0"></path><path d="M5 9v10h14V9"></path><path d="M10 19v-5a2 2 0 0 1 4 0v5"></path></svg></template>
            <template data-sc="if" value="{{g.isTrader}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{g.color}}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M7 7h11l-3-3"></path><path d="M17 17H6l3 3"></path></svg></template>
            <template data-sc="if" value="{{g.isIndividual}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{g.color}}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><circle cx="12" cy="8" r="3.5"></circle><path d="M5.5 19.5a6.5 6.5 0 0 1 13 0"></path></svg></template>
            <span style="flex: 1; color: #202124">{{g.label}}</span>
            <span style="color: #5F6368; font-variant-numeric: tabular-nums">{{g.users}}</span>
          </label>
        </template>
        <div style="padding: 8px 16px 4px; font-size: 12px; color: #5F6368">Select named groups together. All users and Unregistered are exclusive.</div>
      </div>
    </template>
  </div>
  </template>

  <div data-menu="platform" style="position: relative">
    <button type="button" data-fk="menu-platform" aria-haspopup="menu" aria-expanded="{{platformStr}}" onclick="{{togglePlatform}}" style="{{platformChip}}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6368" stroke-width="1.75" aria-hidden="true"><rect x="7" y="3" width="10" height="18" rx="2"></rect><path d="M11 18h2"></path></svg>
      {{platLabel}}
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6368" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M7 10l5 5 5-5"></path></svg>
    </button>
    <template data-sc="if" value="{{openPlatform}}" hint-placeholder-val="{{ false }}">
      <div role="menu" aria-label="Platform" style="position: absolute; top: 44px; left: 0; z-index: 10; width: 200px; max-width: calc(100vw - 32px); box-sizing: border-box; background: #FFFFFF; border-radius: 8px; border: 1px solid #DADCE0; box-shadow: 0 1px 2px rgba(60,64,67,.3), 0 2px 6px 2px rgba(60,64,67,.15); padding: 4px 0">
        <template data-sc="for" list="{{platforms}}" as="pl" hint-placeholder-count="2">
          <button type="button" class="scope-platform-option" role="menuitemradio" aria-checked="{{pl.selected}}" disabled="{{pl.disabled}}" data-fk="{{pl.fk}}" onclick="{{pl.pick}}" style="{{pl.style}}">
            <span style="flex: 1; font-weight: 500">{{pl.label}}</span>
            <template data-sc="if" value="{{pl.selected}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></template>
            <span style="font-size: 12px; color: #5F6368">{{pl.reason}}</span>
          </button>
        </template>
      </div>
    </template>
  </div>
</div>
