<div style="{{outerStyle}}">
<div style="{{innerStyle}}">

<template data-sc="if" value="{{none}}" hint-placeholder-val="{{ false }}">
  <div style="padding: 48px 28px; display: flex; flex-direction: column; gap: 12px; align-items: flex-start">
    <h1 style="margin: 0; font-size: 24px; line-height: 32px; font-weight: 400">No open problems to show</h1>
    <p style="margin: 0; color: #5F6368">Nothing is flagged in this scope, so there is no finding to open.</p>
    <button type="button" class="btn btn-outlined" onClick="{{goBack}}">Back</button>
  </div>
</template>

<template data-sc="if" value="{{has}}" hint-placeholder-val="{{ true }}">
<article aria-labelledby="pd-title">
  <div style="padding: 16px 20px 20px 28px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
      <span class="chip" style="background: {{r.sevBg}}; color: {{r.sevFg}}"><span class="dot" style="background: {{r.causeColor}}"></span>{{r.sev}} · {{r.cause}}</span>
      <span class="cap" style="margin-left: 4px">{{m.pidLabel}}</span>
      <template data-sc="if" value="{{hasNav}}" hint-placeholder-val="{{ true }}">
        <span style="display: inline-flex; gap: 2px">
          <button type="button" data-fk="pd-prev" aria-label="Previous problem" onClick="{{prev}}" style="width: 32px; height: 32px; border-radius: 16px; border: 0; background: transparent; cursor: pointer; color: #5F6368; padding: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
          <button type="button" data-fk="pd-next" aria-label="Next problem" onClick="{{next}}" style="width: 32px; height: 32px; border-radius: 16px; border: 0; background: transparent; cursor: pointer; color: #5F6368; padding: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
        </span>
      </template>
      <button type="button" data-fk="pd-close" aria-label="Close and go back" onClick="{{close}}" style="margin-left: auto; width: 40px; height: 40px; border-radius: 20px; display: inline-flex; align-items: center; justify-content: center; color: #5F6368; border: 0; background: transparent; cursor: pointer; padding: 0">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </div>
    <h1 id="pd-title" data-fk="pd-title" tabindex="-1" style="margin: 0; font-size: 24px; line-height: 32px; font-weight: 400; outline: none">{{r.action}} <span style="font-weight: 500">{{r.item}}</span> for {{r.who}}</h1>
    <template data-sc="if" value="{{hasSub}}" hint-placeholder-val="{{ true }}"><p style="margin: -4px 0 0; color: #5F6368">{{m.sub}}</p></template>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; padding: 16px; background: #F8F9FA; border-radius: 12px">
      <div><div class="lbl">At risk</div><div class="num pd-count" style="font-size: 20px; line-height: 28px">{{m.valueText}}<span style="font-size: 13px; color: #5F6368">{{m.valueUnit}}</span></div></div>
      <div><div class="lbl">Sessions <span class="tag" style="margin-left: 4px">Calculated</span></div><div class="num pd-count" style="font-size: 20px; line-height: 28px">{{r.sessions}}</div><div class="cap">Seen at this step</div></div>
      <div><div class="lbl">Confidence</div><div style="display: flex; align-items: center; gap: 8px; font-size: 20px; line-height: 28px">{{r.confLabel}}
        <span aria-hidden="true" style="display: inline-flex; gap: 2px; align-items: flex-end"><span style="width: 4px; height: 8px; background: {{conf0}}; border-radius: 1px"></span><span style="width: 4px; height: 12px; background: {{conf1}}; border-radius: 1px"></span><span style="width: 4px; height: 16px; background: {{conf2}}; border-radius: 1px"></span></span>
      </div><div class="cap">Detected {{r.ageLong}}</div></div>
    </div>
    <template data-sc="if" value="{{ticketClosed}}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; flex-direction: column; gap: 14px">
      <div>
        <div style="display: flex; align-items: center; gap: 8px"><span class="lbl">Likely reason</span><span class="{{reasonCls}}">{{reasonTag}}</span></div>
        <p style="margin: 4px 0 0; font-size: 15px; line-height: 22px; color: #3C4043">{{reason}}</p>
      </div>
      <template data-sc="if" value="{{hasRuledOut}}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-radius: 8px; background: #F8F9FA">
          <span class="lbl">{{ruledOutLabel}}</span>
          <template data-sc="for" list="{{ruledOut}}" as="c" hint-placeholder-count="2"><span style="color: #3C4043"><span style="font-weight: 500">{{c.title}}:</span> {{c.why}}</span></template>
        </div>
      </template>
      <template data-sc="if" value="{{hasCaveat}}" hint-placeholder-val="{{ false }}"><p class="cap" style="margin: 0">Caveat: {{caveat}}</p></template>
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
        <span style="display: flex; flex-wrap: wrap; gap: 8px">
          <button type="button" data-fk="pd-ticket" class="btn btn-filled" onClick="{{toggleTicket}}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"></rect><path d="M9 6v12" stroke-dasharray="2 2"></path></svg>
            Draft ticket
          </button>
          <template data-sc="if" value="{{hasWatch}}" hint-placeholder-val="{{ true }}"><button type="button" data-fk="pd-watch" class="btn btn-outlined" onClick="{{watch}}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"></path></svg>
            Watch sessions
          </button></template>
        </span>
        <span style="display: inline-flex; align-items: center; gap: 6px; margin-left: auto">
          <span class="lbl">Owner</span>
          <select data-fk="pd-owner" aria-label="Owner" onChange="{{setOwner}}" style="height: 32px; padding: 0 8px; border-radius: 6px; border: 1px solid #DADCE0; font-family: inherit; font-size: 13px; color: #3C4043; background: #FFFFFF">
            <template data-sc="for" list="{{ownerOptions}}" as="o" hint-placeholder-count="4"><option value="{{o.value}}" selected="{{o.selected}}">{{o.label}}</option></template>
          </select>
        </span>
      </div>
    </div>
    </template>
    <template data-sc="if" value="{{ticketOpen}}" hint-placeholder-val="{{ false }}">
      <div role="region" aria-label="Ticket draft" style="border: 1px solid #DADCE0; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap">
          <span class="lbl">New ticket · {{team}}</span>
          <span class="chip" style="background: {{r.sevBg}}; color: {{r.sevFg}}">{{ticketPriority}}</span>
        </div>
        <h2 style="margin: 0; font-size: 18px; line-height: 26px; font-weight: 500">{{r.action}} {{r.item}} for {{r.who}}</h2>
        <div>
          <div style="display: flex; align-items: center; gap: 8px"><span class="lbl">Likely cause</span><span class="{{reasonCls}}">{{reasonTag}}</span></div>
          <p style="margin: 4px 0 0; font-size: 14px; line-height: 20px; color: #3C4043">{{r.why}}</p>
        </div>
        <template data-sc="if" value="{{hasEvidenceLines}}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; flex-direction: column; gap: 4px">
            <div style="display: flex; align-items: center; gap: 8px"><span class="lbl">Evidence</span><span class="tag">Calculated</span></div>
            <template data-sc="for" list="{{evidenceLines}}" as="e" hint-placeholder-count="2"><p style="margin: 0; font-size: 13px; color: #3C4043">{{e.text}}</p></template>
          </div>
        </template>
        <template data-sc="if" value="{{hasSessions}}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; flex-direction: column; gap: 6px">
            <span class="lbl">Sessions attached · {{sessions.length}}</span>
            <template data-sc="for" list="{{sessions}}" as="s" hint-placeholder-count="3">
              <button type="button" onClick="{{s.open}}" style="display: flex; align-items: center; gap: 8px; text-align: left; padding: 8px 10px; border-radius: 8px; border: 1px solid #E8EAED; background: #FFFFFF; cursor: pointer; font-family: inherit; font-size: 13px; color: #3C4043">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="flex: none; color: #1A73E8"><path d="M8 5.5v13l10.5-6.5z"></path></svg>
                {{s.label}}
              </button>
            </template>
          </div>
        </template>
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-top: 4px; border-top: 1px solid #F1F3F4">
          <button type="button" data-fk="pd-copy" class="btn btn-tonal" onClick="{{copy}}">Copy</button>
          <button type="button" data-fk="pd-dl" class="btn btn-outlined" onClick="{{download}}">Download .md</button>
          <button type="button" data-fk="pd-tkclose" class="btn btn-filled" style="background: #1E8E3E" onClick="{{toggleTicket}}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 13l4 4L19 7"></path></svg>
            Ticket created
          </button>
          <span class="cap" role="status" aria-live="polite">{{copied}}</span>
        </div>
      </div>
    </template>
  </div>
</article>
</template>

</div>
</div>
