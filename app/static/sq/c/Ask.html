<div style="min-height: 100vh; background: #F8F9FA; color: #202124; font-family: 'Google Sans Flex', 'Google Sans', Roboto, system-ui, sans-serif; font-size: 14px; line-height: 20px">
  <style>
    @keyframes sq-spin { to { transform: rotate(360deg); } }
    .sq-spin { animation: sq-spin .8s linear infinite; }
    @media (prefers-reduced-motion: reduce) { .sq-spin { animation: none; } }
    .sq-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    .sq-txt { border: 0; background: transparent; padding: 0; font-family: inherit; font-size: 13px; font-weight: 500; color: #1A73E8; cursor: pointer; }
    .sqa-track { height: 10px; border-radius: 5px; background: #F1F3F4; overflow: hidden; }
    .sqa-opt { display: flex; align-items: center; gap: 14px; min-height: 40px; padding: 6px 16px; width: 100%; box-sizing: border-box; border: 0; background: transparent; text-decoration: none; color: #202124; }
    .sqa-opt:hover { background: #F1F3F4; }
    .sqa-suggestion-row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 48px; padding: 10px 8px; box-sizing: border-box; border: 0; border-bottom: 1px solid #E8EAED; background: transparent; color: #202124; font: inherit; text-align: left; cursor: pointer; }
    .sqa-suggestion-row:hover { background: #F1F3F4; }
    .sqa-suggestion-row:focus-visible { outline: 2px solid #1A73E8; outline-offset: -2px; }
  </style>
  <dc-import name="TopBar" hint-size="100%,64px"></dc-import>
  <div style="display: flex; flex-wrap: wrap; align-items: stretch; min-height: calc(100vh - 64px)">

    <div style="flex: 0 1 auto; max-width: 100%; min-width: 0"><dc-import name="NavRail" active="ask" hint-size="256px,640px"></dc-import></div>

    <aside id="ask-history" aria-label="Question history" style="flex: 1 1 300px; max-width: 320px; box-sizing: border-box; padding: 16px 12px 24px; background: #FFFFFF; border-right: 1px solid #E8EAED; border-left: 1px solid #E8EAED; display: flex; flex-direction: column; gap: 8px; {{historyDisplay}}">
      <button type="button" class="btn btn-tonal" style="align-self: flex-start; padding: 0 20px 0 16px" onClick="{{newQuestion}}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        New question
      </button>
      <label style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border-radius: 20px; background: #F1F3F4; margin-top: 4px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6368" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4 4"></path></svg>
        <span class="sq-sr">Search your questions</span>
        <input id="ask-search" type="text" value="{{search}}" onInput="{{onSearch}}" placeholder="Search your questions" style="flex: 1; min-width: 0; border: 0; background: transparent; font-family: inherit; font-size: 14px; outline: none">
      </label>
      <div class="cap" style="display: flex; align-items: center; gap: 6px; padding: 4px 12px 0">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
        Private to you · kept for this visit
      </div>

      <template data-sc="if" value="{{noHistory}}" hint-placeholder-val="{{ false }}">
        <p class="cap" style="margin: 8px 12px 0">{{emptyHistory}}</p>
      </template>

      <template data-sc="for" list="{{groups}}" as="g" hint-placeholder-count="4">
        <div class="grp">{{g.label}}</div>
        <template data-sc="for" list="{{g.items}}" as="h" hint-placeholder-count="2">
          <button type="button" class="hist" style="{{h.sel}}" aria-current="{{h.cur}}" onClick="{{h.open}}">
            <span style="display: flex; align-items: flex-start; gap: 8px">
              <span style="flex: 1; min-width: 0; {{h.titleStyle}}">{{h.title}}</span>
              <span title="Up to date" style="width: 8px; height: 8px; border-radius: 4px; margin-top: 6px; flex: none; background: #DADCE0"></span>
            </span>
            <span style="display: flex; flex-wrap: wrap; gap: 4px">
              <span class="mini" style="background: #F1F3F4; color: #3C4043">{{h.scope}}</span>
              <template data-sc="if" value="{{h.hasProblem}}" hint-placeholder-val="{{ false }}"><span class="mini" style="background: #FCE8E6; color: #C5221F">{{h.problem}}</span></template>
            </span>
          </button>
        </template>
      </template>
      <template data-sc="if" value="{{hasHistory}}" hint-placeholder-val="{{ true }}">
        <div class="cap" style="display: flex; flex-wrap: wrap; gap: 12px; padding: 16px 12px 0; border-top: 1px solid #F1F3F4; margin-top: 8px">
          <span style="display: inline-flex; align-items: center; gap: 6px"><span class="dot" style="background: #DADCE0"></span>Up to date: this is the newest data in the sample</span>
        </div>
      </template>
    </aside>

    <main style="flex: 999 1 560px; min-width: 0; padding: 28px 32px 48px; box-sizing: border-box">
      <div style="max-width: 840px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px">

        <!-- landing: no question yet -->
        <template data-sc="if" value="{{landing}}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px">
            <h1 style="margin: 0; font-size: 28px; line-height: 36px; font-weight: 400; flex: 1 1 300px">Chat now</h1>
            <span style="position: relative">
              <button type="button" class="ibtn" aria-label="History options" aria-expanded="{{historyMenuStr}}" onClick="{{toggleHistoryMenu}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="12" cy="19" r="1.8"></circle></svg></button>
              <template data-sc="if" value="{{historyMenu}}" hint-placeholder-val="{{ false }}">
                <div role="menu" style="position: absolute; right: 0; top: 44px; z-index: 5; min-width: 180px; padding: 8px 0; background: #FFFFFF; border-radius: 12px; box-shadow: 0 4px 6px 2px rgba(60,64,67,.15), 0 2px 2px rgba(60,64,67,.3); display: flex; flex-direction: column">
                  <button type="button" role="menuitem" class="sqa-opt" style="text-align: left; font-family: inherit; font-size: 14px; cursor: pointer" aria-expanded="{{historyExpanded}}" aria-controls="ask-history" onClick="{{toggleHistory}}">{{historyToggleLabel}}</button>
                  <template data-sc="if" value="{{hasAnyHistory}}" hint-placeholder-val="{{ false }}"><button type="button" role="menuitem" class="sqa-opt" style="text-align: left; font-family: inherit; font-size: 14px; cursor: pointer; color: #C5221F" onClick="{{clearHistory}}">Clear history</button></template>
                </div>
              </template>
            </span>
          </div>
          <section class="card" aria-labelledby="ask-land" style="padding: 28px 32px; display: flex; flex-direction: column; gap: 18px">
            <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; position: relative">
              <svg class="sq-sparkle" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7-4.7-1.8 4.7-1.8z"></path><path d="M18.5 15.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"></path></svg>
              <h2 id="ask-land" class="lbl" style="margin: 0; color: #1967D2; font-size: 14px; line-height: 20px; font-weight: 500">Ask about your users</h2>
              <span class="tag">Calculated</span>
              <button type="button" aria-label="What the tags on each answer mean" aria-expanded="{{infoTagsStr}}" onclick="{{toggleInfoTags}}" style="width: 20px; height: 20px; border-radius: 10px; border: 1px solid #DADCE0; background: #FFFFFF; color: #5F6368; font-size: 11px; line-height: 1; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0">i</button>
              <template data-sc="if" value="{{infoTagsOpen}}" hint-placeholder-val="{{ false }}">
                <div role="note" style="position: absolute; top: 26px; left: 0; z-index: 10; width: 300px; max-width: min(300px, calc(100vw - 48px)); box-sizing: border-box; padding: 12px 16px; background: #FFFFFF; border-radius: 8px; border: 1px solid #DADCE0; box-shadow: 0 1px 2px rgba(60,64,67,.3), 0 2px 6px 2px rgba(60,64,67,.15); font-size: 13px; line-height: 20px; color: #3C4043; display: flex; flex-direction: column; gap: 6px">
                  <p style="margin: 0">Every answer is tagged <b>Calculated</b> (from code and the numbers in this sample), <b>AI</b> (Gemini's own explanation, grounded in those numbers — answered live or from a saved answer to the same question) or <b>Mock data</b> (a stand-in, not measured).</p>
                  <p style="margin: 0">AI can be wrong — open the evidence before you act on it.</p>
                </div>
              </template>
            </div>
            <p style="margin: 0; font-size: 24px; line-height: 32px; font-weight: 400">What do you want to know?</p>
            <p style="margin: 0; color: #3C4043">Ask in plain words. Squint answers only from the numbers in this sample dataset, and tells you when it can't.</p>
            <form onSubmit="{{onSubmit}}" style="display: flex; flex-direction: column; gap: 8px; padding: 12px 12px 12px 20px; background: #FFFFFF; border: 1px solid #DADCE0; border-radius: 24px; margin: 0">
              <div style="display: flex; align-items: center; gap: 12px">
                <label for="ask-follow" class="sq-sr">Ask a question</label>
                <input id="ask-follow" type="text" autocomplete="off" value="{{draft}}" onInput="{{onDraft}}" placeholder="{{placeholder}}" style="flex: 1; min-width: 0; height: 40px; border: 0; background: transparent; font-family: inherit; font-size: 16px; outline: none">
                <button type="submit" aria-label="Send question" style="width: 40px; height: 40px; border-radius: 20px; border: 0; background: #1A73E8; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"></path></svg></button>
              </div>
              <span class="cap" style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px">Asking about <span class="mini" style="background: #F1F3F4; color: #3C4043">{{scopeChip}}</span> · saved with each answer</span>
            </form>
            <div style="display: flex; flex-direction: column; gap: 10px">
              <span class="lbl">Try one of these</span>
              <div style="display: flex; flex-wrap: wrap; gap: 8px">
                <template data-sc="for" list="{{suggest}}" as="s" hint-placeholder-count="3">
                  <button type="button" class="sug" onClick="{{s.ask}}"><svg class="sq-sparkle" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7-4.7-1.8 4.7-1.8z"></path><path d="M18.5 15.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"></path></svg>{{s.q}}</button>
                </template>
              </div>
              <template data-sc="if" value="{{hasMore}}" hint-placeholder-val="{{ false }}">
                <details>
                  <summary class="lbl" style="cursor: pointer; display: list-item">More questions</summary>
                  <div style="display: flex; flex-direction: column; margin-top: 8px; border-top: 1px solid #E8EAED">
                    <template data-sc="for" list="{{suggestMore}}" as="s" hint-placeholder-count="5">
                      <button type="button" class="sqa-suggestion-row" onClick="{{s.ask}}"><svg class="sq-sparkle" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7-4.7-1.8 4.7-1.8z"></path><path d="M18.5 15.5l.8 2 2 .8-2 .8-.8-2-2-.8 2-.8z"></path></svg><span>{{s.q}}</span></button>
                    </template>
                  </div>
                </details>
              </template>
            </div>
          </section>
          <p class="cap" style="margin: -8px 0 0 20px">Answers only use numbers from your data. AI can be wrong; open the evidence before you act.</p>
        </template>

        <!-- conversation -->
        <template data-sc="if" value="{{hasThread}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px">
            <h1 style="margin: 0; font-size: 22px; line-height: 30px; font-weight: 400; flex: 1 1 300px">{{title}}</h1>
            <span style="position: relative">
              <button type="button" class="ibtn" aria-label="History options" aria-expanded="{{historyMenuStr}}" onClick="{{toggleHistoryMenu}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="12" cy="19" r="1.8"></circle></svg></button>
              <template data-sc="if" value="{{historyMenu}}" hint-placeholder-val="{{ false }}">
                <div role="menu" style="position: absolute; right: 0; top: 44px; z-index: 5; min-width: 180px; padding: 8px 0; background: #FFFFFF; border-radius: 12px; box-shadow: 0 4px 6px 2px rgba(60,64,67,.15), 0 2px 2px rgba(60,64,67,.3); display: flex; flex-direction: column">
                  <button type="button" role="menuitem" class="sqa-opt" style="text-align: left; font-family: inherit; font-size: 14px; cursor: pointer" aria-expanded="{{historyExpanded}}" aria-controls="ask-history" onClick="{{toggleHistory}}">{{historyToggleLabel}}</button>
                  <template data-sc="if" value="{{hasAnyHistory}}" hint-placeholder-val="{{ false }}"><button type="button" role="menuitem" class="sqa-opt" style="text-align: left; font-family: inherit; font-size: 14px; cursor: pointer; color: #C5221F" onClick="{{clearHistory}}">Clear history</button></template>
                </div>
              </template>
            </span>
            <span class="chip" style="background: #F1F3F4; color: #3C4043"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>Private</span>
            <template data-sc="if" value="{{canExport}}" hint-placeholder-val="{{ false }}">
              <a class="btn btn-outlined" href="AskFlow5.dc.html" style="height: 36px; padding: 0 16px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="12" rx="2"></rect><path d="M8 21h8M12 17v4"></path></svg>Export slides</a>
              <button type="button" class="btn btn-outlined" style="height: 36px; padding: 0 16px" onClick="{{share}}">{{shareLabel}}</button>
            </template>
            <span style="position: relative">
              <button type="button" class="ibtn" aria-label="More: pin, delete" aria-expanded="{{menuStr}}" onClick="{{toggleMenu}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="12" cy="19" r="1.8"></circle></svg></button>
              <template data-sc="if" value="{{menu}}" hint-placeholder-val="{{ false }}">
                <div role="menu" style="position: absolute; right: 0; top: 44px; z-index: 5; min-width: 200px; padding: 8px 0; background: #FFFFFF; border-radius: 12px; box-shadow: 0 4px 6px 2px rgba(60,64,67,.15), 0 2px 2px rgba(60,64,67,.3); display: flex; flex-direction: column">
                  <button type="button" role="menuitem" class="sqa-opt" style="text-align: left; font-family: inherit; font-size: 14px; cursor: pointer" onClick="{{pin}}">{{pinLabel}}</button>
                  <button type="button" role="menuitem" class="sqa-opt" style="text-align: left; font-family: inherit; font-size: 14px; cursor: pointer; color: #C5221F" onClick="{{remove}}">Delete this conversation</button>
                </div>
              </template>
            </span>
          </div>

          <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 12px 16px; border-radius: 12px; background: #FFFFFF; border: 1px solid #DADCE0; color: #3C4043">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true" style="color: #5F6368"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>
            <span style="flex: 1 1 320px">{{banner}}</span>
          </div>

          <template data-sc="for" list="{{turns}}" as="t" hint-placeholder-count="2">
            <template data-sc="if" value="{{t.showFrom}}" hint-placeholder-val="{{ false }}">
              <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 6px">
                <span class="cap">Asked from</span>
                <a href="{{t.fromHref}}" class="mini" style="background: #E8F0FE; color: #174EA6; text-decoration: none">{{t.from}}</a>
                <span class="mini" style="background: #F1F3F4; color: #3C4043">{{t.scope}}</span>
              </div>
            </template>
            <template data-sc="if" value="{{t.followCap}}" hint-placeholder-val="{{ false }}">
              <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 6px"><span class="cap">Follow-up · same conversation</span></div>
            </template>
            <div style="display: flex; justify-content: flex-end">
              <p style="margin: 0; max-width: 560px; padding: 12px 18px; border-radius: 20px 20px 4px 20px; background: #E8F0FE; color: #174EA6; font-size: 16px; line-height: 24px; overflow-wrap: anywhere">{{t.q}}</p>
            </div>

            <template data-sc="if" value="{{t.showLoading}}" hint-placeholder-val="{{ false }}">
              <section class="card" aria-busy="true" aria-label="Answer in progress" style="padding: 24px; display: flex; flex-direction: column; gap: 18px">
                <div style="display: flex; align-items: center; gap: 10px">
                  <svg class="sq-sparkle" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7-4.7-1.8 4.7-1.8z"></path><path d="M18.5 15.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"></path></svg>
                  <span style="font-weight: 500">Working on it</span>
                  <button type="button" class="btn btn-outlined" style="margin-left: auto; height: 32px; padding: 0 14px" onClick="{{t.stop}}">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"></rect></svg>Stop
                  </button>
                </div>
                <ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px" aria-live="polite">
                  <template data-sc="for" list="{{t.steps}}" as="s" hint-placeholder-count="4">
                    <template data-sc="if" value="{{s.done}}" hint-placeholder-val="{{ false }}">
                      <li style="display: flex; align-items: center; gap: 10px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1E8E3E" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg><span>{{s.text}}</span></li>
                    </template>
                    <template data-sc="if" value="{{s.now}}" hint-placeholder-val="{{ false }}">
                      <li style="display: flex; align-items: center; gap: 10px; font-weight: 500"><span style="width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center"><span class="sq-spin" style="width: 14px; height: 14px; border-radius: 7px; border: 2px solid #D2E3FC; border-top-color: #1A73E8; box-sizing: border-box"></span></span><span>{{s.text}}…</span></li>
                    </template>
                    <template data-sc="if" value="{{s.todo}}" hint-placeholder-val="{{ false }}">
                      <li style="display: flex; align-items: center; gap: 10px; color: #9AA0A6"><span style="width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center"><span style="width: 8px; height: 8px; border-radius: 4px; background: #DADCE0"></span></span><span>{{s.text}}</span></li>
                    </template>
                  </template>
                </ol>
              </section>
            </template>

            <template data-sc="if" value="{{t.showCollapsed}}" hint-placeholder-val="{{ false }}">
              <section class="card" aria-label="Earlier answer, collapsed" style="padding: 14px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; background: #FCFCFD">
                <svg class="sq-sparkle" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7-4.7-1.8 4.7-1.8z"></path><path d="M18.5 15.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"></path></svg>
                <span style="flex: 1 1 300px; min-width: 0">{{t.a.headText}}</span>
                <template data-sc="if" value="{{t.a.hasProblem}}" hint-placeholder-val="{{ false }}"><span class="mini" style="background: #FCE8E6; color: #C5221F">{{t.a.problem}}</span></template>
                <button type="button" class="sq-txt" onClick="{{t.toggle}}">Show answer</button>
              </section>
            </template>

            <template data-sc="if" value="{{t.showRefusal}}" hint-placeholder-val="{{ false }}">
              <section class="card" aria-labelledby="{{t.hid}}" style="padding: 24px; display: flex; flex-direction: column; gap: 16px">
                <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5F6368" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 8v5M12 16.2v.1"></path></svg>
                  <span class="tag">No answer</span>
                  <span class="cap" style="margin-left: auto">Nothing in the data matches this question</span>
                </div>
                <h2 id="{{t.hid}}" tabindex="-1" style="margin: 0; font-size: 22px; line-height: 30px; font-weight: 400">{{refusalHead}}</h2>
                <p style="margin: 0; color: #3C4043">{{refusalText}}</p>
                <div style="display: flex; flex-wrap: wrap; gap: 8px">
                  <template data-sc="for" list="{{t.tryList}}" as="s" hint-placeholder-count="3">
                    <button type="button" class="sug" onClick="{{s.ask}}"><svg class="sq-sparkle" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7-4.7-1.8 4.7-1.8z"></path><path d="M18.5 15.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"></path></svg>{{s.q}}</button>
                  </template>
                </div>
              </section>
            </template>

            <template data-sc="if" value="{{t.showAnswer}}" hint-placeholder-val="{{ false }}">
              <section class="card" aria-labelledby="{{t.hid}}" style="padding: 24px; display: flex; flex-direction: column; gap: 18px">
                <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
                  <svg class="sq-sparkle" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7-4.7-1.8 4.7-1.8z"></path><path d="M18.5 15.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"></path></svg>
                  <template data-sc="if" value="{{t.a.hasAI}}" hint-placeholder-val="{{ false }}"><span class="tag tag-ai">AI</span></template>
                  <span class="tag">Calculated</span>
                  <template data-sc="if" value="{{t.a.hasProblem}}" hint-placeholder-val="{{ false }}"><span class="mini" style="background: #FCE8E6; color: #C5221F">{{t.a.problem}}</span></template>
                  <template data-sc="if" value="{{t.a.isIns}}" hint-placeholder-val="{{ false }}"><span class="mini" style="background: {{t.a.sevBg}}; color: {{t.a.sevFg}}">{{t.a.sevLabel}}</span></template>
                  <template data-sc="if" value="{{t.a.hasMoney}}" hint-placeholder-val="{{ false }}">
                    <span class="num" title="Estimate: assumed value per completed task, not measured" style="margin-left: auto; font-size: 20px; line-height: 28px; font-weight: 500">{{t.a.money}}<span style="font-size: 13px; font-weight: 400; color: #5F6368"> /wk at risk</span></span>
                  </template>
                  <template data-sc="if" value="{{t.a.noMoney}}" hint-placeholder-val="{{ false }}"><span class="cap" style="margin-left: auto">{{t.a.scope}} · {{t.a.when}}</span></template>
                </div>

                <h2 id="{{t.hid}}" tabindex="-1" style="margin: 0; font-size: 24px; line-height: 32px; font-weight: 400">
                  <template data-sc="if" value="{{t.a.isIns}}" hint-placeholder-val="{{ true }}">{{t.a.head.a}} <span style="font-weight: 500">{{t.a.head.b}}</span>{{t.a.head.c}}<template data-sc="if" value="{{t.a.hasCtx}}" hint-placeholder-val="{{ false }}"> <span style="font-size: 16px; color: #5F6368">· {{t.a.head.ctx}}</span></template></template>
                  <template data-sc="if" value="{{t.a.isPlain}}" hint-placeholder-val="{{ false }}">{{t.a.head.c}}</template>
                </h2>
                <template data-sc="if" value="{{t.a.hasPara}}" hint-placeholder-val="{{ true }}"><p style="margin: 0; color: #3C4043">{{t.a.para}}</p></template>

                <template data-sc="if" value="{{t.a.hasEv}}" hint-placeholder-val="{{ true }}">
                  <div style="display: flex; flex-wrap: wrap; gap: 20px 40px; padding: 20px 24px; background: #F8F9FA; border-radius: 12px">
                    <template data-sc="if" value="{{t.a.hasWhy}}" hint-placeholder-val="{{ true }}">
                      <div style="flex: 1 1 280px; display: flex; flex-direction: column; gap: 6px">
                        <div style="display: flex; align-items: center; gap: 8px"><span class="lbl">Why</span><span class="tag {{t.a.whyClass}}">{{t.a.whyTag}}</span></div>
                        <p style="margin: 0; font-size: 18px; line-height: 26px">{{t.a.why}}</p>
                        <template data-sc="if" value="{{t.a.hasWhySub}}" hint-placeholder-val="{{ false }}"><p style="margin: 0; font-size: 13px; color: #5F6368">{{t.a.whySub}}</p></template>
                      </div>
                    </template>
                    <div style="flex: 1 1 280px; display: flex; flex-direction: column; gap: 6px">
                      <div style="display: flex; align-items: center; gap: 8px"><span class="lbl">Evidence</span><span class="tag">Calculated</span></div>
                      <template data-sc="if" value="{{t.a.hasBig}}" hint-placeholder-val="{{ true }}">
                        <div style="display: flex; align-items: center; gap: 16px">
                          <span class="num" style="font-size: 32px; line-height: 40px">{{t.a.big}}</span>
                          <div style="position: relative; flex: 1; height: 10px; border-radius: 5px; background: #E8EAED">
                            <div style="width: {{t.a.barW}}; height: 100%; border-radius: 5px; background: {{t.a.focus}}"></div>
                            <template data-sc="if" value="{{t.a.hasTick}}" hint-placeholder-val="{{ true }}"><span style="position: absolute; left: {{t.a.tickL}}; top: -4px; width: 2px; height: 18px; border-radius: 1px; background: #3C4043"></span></template>
                          </div>
                        </div>
                      </template>
                      <p style="margin: 0; font-size: 13px; color: #5F6368">{{t.a.evText}}</p>
                    </div>
                  </div>
                </template>

                <template data-sc="if" value="{{t.a.hasDrivers}}" hint-placeholder-val="{{ true }}">
                  <div style="display: flex; flex-direction: column; gap: 12px">
                    <div style="display: flex; align-items: center; gap: 8px">
                      <span class="lbl">{{t.a.chartTitle}}</span><span class="tag">Calculated</span>
                      <span class="cap" style="margin-left: auto; display: inline-flex; flex-wrap: wrap; gap: 4px 16px"><span style="display: inline-flex; align-items: center; gap: 6px"><span class="dot" style="background: {{t.a.focus}}"></span>{{t.a.legendA}}</span><span style="display: inline-flex; align-items: center; gap: 6px"><span class="dot" style="background: #9AA0A6"></span>{{t.a.legendB}}</span></span>
                    </div>
                    <template data-sc="for" list="{{t.a.drivers}}" as="d" hint-placeholder-count="3">
                      <div style="display: grid; grid-template-columns: 140px 1fr 150px; gap: 16px; align-items: center">
                        <span style="color: #3C4043">{{d.label}}</span>
                        <div style="display: flex; flex-direction: column; gap: 4px">
                          <div class="sqa-track"><div style="width: {{d.a}}; height: 100%; background: {{t.a.focus}}"></div></div>
                          <div class="sqa-track"><div style="width: {{d.b}}; height: 100%; background: #9AA0A6"></div></div>
                        </div>
                        <span class="num" style="text-align: right"><span style="font-weight: 500">{{d.ratio}}</span> <span class="cap">{{d.vals}}</span></span>
                      </div>
                    </template>
                  </div>
                </template>

                <template data-sc="if" value="{{t.a.hasBars}}" hint-placeholder-val="{{ false }}">
                  <div style="display: flex; flex-direction: column; gap: 10px">
                    <div style="display: flex; align-items: center; gap: 8px"><span class="lbl">{{t.a.chartTitle}}</span><span class="tag">Calculated</span></div>
                    <template data-sc="for" list="{{t.a.bars}}" as="b" hint-placeholder-count="3">
                      <div title="{{b.note}}" style="display: grid; grid-template-columns: minmax(96px, 220px) 1fr 48px minmax(0, 96px); gap: 12px; align-items: center">
                        <span style="{{b.ls}}">{{b.name}}</span>
                        <div class="sqa-track"><div style="width: {{b.w}}; height: 100%; background: {{b.c}}"></div></div>
                        <span class="num" style="text-align: right; {{b.ls}}">{{b.v}}</span>
                        <span class="cap num" style="text-align: right">{{b.n}}</span>
                      </div>
                    </template>
                    <template data-sc="if" value="{{t.a.hasChartNote}}" hint-placeholder-val="{{ false }}"><span class="cap">{{t.a.chartNote}}</span></template>
                  </div>
                </template>

                <template data-sc="if" value="{{t.a.hasHyp}}" hint-placeholder-val="{{ false }}">
                  <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px 16px; border-radius: 10px; background: #F8F9FA">
                    <span class="lbl">Hypothesis to verify</span><span class="tag tag-ai">AI</span>
                    <span style="flex: 1 1 100%; color: #3C4043">{{t.a.hypothesis}}</span>
                  </div>
                </template>

                <template data-sc="if" value="{{t.a.hasStats}}" hint-placeholder-val="{{ false }}">
                  <div style="display: flex; flex-direction: column; gap: 10px">
                    <div style="display: flex; align-items: center; gap: 8px"><span class="lbl">{{t.a.chartTitle}}</span><span class="tag">Calculated</span></div>
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); border: 1px solid #E8EAED; border-radius: 8px">
                      <template data-sc="for" list="{{t.a.stats}}" as="s" hint-placeholder-count="3">
                        <div style="padding: 14px 18px; border-right: 1px solid #E8EAED; border-bottom: 1px solid #E8EAED"><div class="lbl">{{s.label}}</div><div class="num" style="font-size: 24px; line-height: 32px; color: {{s.c}}">{{s.v}}</div><div style="font-size: 12px; color: #5F6368">{{s.note}}</div></div>
                      </template>
                    </div>
                  </div>
                </template>

                <template data-sc="if" value="{{t.a.hasRefs}}" hint-placeholder-val="{{ false }}">
                  <span class="cap">Source: {{t.a.refText}}</span>
                </template>

                <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding-top: 16px; border-top: 1px solid #F1F3F4">
                  <template data-sc="if" value="{{t.a.hasSessions}}" hint-placeholder-val="{{ false }}">
                    <span class="meta" title="Sessions behind this answer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3"></circle><path d="M3.5 19.5a5.5 5.5 0 0 1 11 0"></path><circle cx="17" cy="9" r="2.5"></circle><path d="M16 14.2a4.5 4.5 0 0 1 4.5 5.3"></path></svg><span class="num">{{t.a.sessions}}</span><span class="sr">sessions</span></span>
                  </template>
                  <template data-sc="if" value="{{t.a.hasConf}}" hint-placeholder-val="{{ false }}">
                    <span class="meta" title="{{t.a.confLabel}}"><span style="display: inline-flex; gap: 2px; align-items: flex-end" aria-hidden="true"><template data-sc="for" list="{{t.a.confBars}}" as="c" hint-placeholder-count="3"><span style="width: 4px; height: {{c.h}}px; border-radius: 1px; background: {{c.c}}"></span></template></span><span class="sr">{{t.a.confLabel}}</span></span>
                  </template>
                  <template data-sc="if" value="{{t.a.hasMoney}}" hint-placeholder-val="{{ false }}"><span class="cap">{{t.a.scope}} · {{t.a.when}}</span></template>
                  <div style="margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
                    <a class="btn btn-tonal" href="{{t.a.linkHref}}">{{t.a.linkLabel}}</a>
                    <button type="button" class="btn btn-outlined" onClick="{{t.pin}}">{{pinLabel}}</button>
                    <button type="button" class="btn btn-outlined" onClick="{{t.copy}}">{{t.copyLabel}}</button>
                  </div>
                </div>
                <template data-sc="if" value="{{t.a.hasTrust}}" hint-placeholder-val="{{ true }}">
                  <a href="DataSources.dc.html" class="cap" style="display: inline-flex; align-items: center; gap: 6px; text-decoration: none; margin-top: -6px"><span class="dot" style="background: {{t.a.trustColor}}"></span>{{t.a.trust}}</a>
                </template>
              </section>
            </template>
          </template>

          <template data-sc="if" value="{{showSug}}" hint-placeholder-val="{{ false }}">
            <div style="display: flex; flex-wrap: wrap; gap: 8px">
              <template data-sc="for" list="{{suggest}}" as="s" hint-placeholder-count="3">
                <button type="button" class="sug" onClick="{{s.ask}}"><svg class="sq-sparkle" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7-4.7-1.8 4.7-1.8z"></path><path d="M18.5 15.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"></path></svg>{{s.q}}</button>
              </template>
            </div>
          </template>

          <form onSubmit="{{onSubmit}}" style="display: flex; flex-direction: column; gap: 8px; padding: 12px 12px 12px 20px; background: #FFFFFF; border: 1px solid #DADCE0; border-radius: 24px; margin: 0">
            <div style="display: flex; align-items: center; gap: 12px">
              <label for="ask-follow" class="sq-sr">Ask a follow-up</label>
              <input id="ask-follow" type="text" autocomplete="off" value="{{draft}}" onInput="{{onDraft}}" placeholder="{{composerHint}}" style="flex: 1; min-width: 0; height: 40px; border: 0; background: transparent; font-family: inherit; font-size: 16px; outline: none">
              <button type="submit" aria-label="Send question" style="width: 40px; height: 40px; border-radius: 20px; border: 0; background: {{sendBg}}; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"></path></svg></button>
            </div>
            <span class="cap" style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px">Asking about <span class="mini" style="background: #F1F3F4; color: #3C4043">{{scopeChip}}</span> · saved with each answer</span>
          </form>
          <p class="cap" style="margin: -8px 0 0 20px">Answers only use numbers from your data. AI can be wrong; open the evidence before you act.</p>
        </template>
      </div>
    </main>
  </div>
</div>
