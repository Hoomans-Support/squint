<div style="display: flex; min-height: 640px; font-family: 'Google Sans Flex', 'Google Sans', Roboto, system-ui, sans-serif; font-size: 14px; line-height: 20px; color: #3C4043">
  <!-- slim icon-only dock: always visible, even while the labeled panel is collapsed -->
  <div style="width: 56px; flex: none; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 0 16px; border-right: 1px solid #E8EAED">
    <a href="Main.dc.html" style="{{dot.overview}} position: relative" aria-current="{{cur.overview}}" title="Overview" aria-label="Overview">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"></rect><rect x="13" y="4" width="7" height="7" rx="1.5"></rect><rect x="4" y="13" width="7" height="7" rx="1.5"></rect><rect x="13" y="13" width="7" height="7" rx="1.5"></rect></svg>
      <template data-sc="if" value="{{hasBadge}}" hint-placeholder-val="{{ true }}"><span style="position: absolute; top: 2px; right: 2px; min-width: 8px; height: 8px; border-radius: 4px; background: #D93025" aria-hidden="true"></span></template>
    </a>
    <a href="Journeys.dc.html" style="{{dot.journeys}}" aria-current="{{cur.journeys}}" title="Journeys" aria-label="Journeys">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="5" cy="12" r="2"></circle><circle cx="19" cy="6" r="2"></circle><circle cx="19" cy="18" r="2"></circle><path d="M7 12h4l6-5.5M11 12l6 5.5"></path></svg>
    </a>
    <a href="Audiences.dc.html" style="{{dot.audiences}}" aria-current="{{cur.audiences}}" title="Audiences" aria-label="Audiences">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3"></circle><path d="M3.5 19.5a5.5 5.5 0 0 1 11 0"></path><circle cx="17" cy="9" r="2.5"></circle><path d="M16 14.2a4.5 4.5 0 0 1 4.5 5.3"></path></svg>
    </a>
    <div style="height: 1px; width: 28px; background: #E8EAED; margin: 4px 0"></div>
    <a href="Ask.dc.html" style="{{dot.ask}}" aria-current="{{cur.ask}}" title="Chat now" aria-label="Chat now">
      <svg class="sq-sparkle" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7-4.7-1.8 4.7-1.8z"></path><path d="M18.5 15.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"></path></svg>
    </a>
    <a href="Brief.dc.html" style="{{dot.brief}}" aria-current="{{cur.brief}}" title="Recommendations" aria-label="Recommendations">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"></path><path d="M14 3v5h5M9 13h7M9 17h5"></path></svg>
    </a>
    <div style="height: 1px; width: 28px; background: #E8EAED; margin: 4px 0"></div>
    <a href="DataSources.dc.html" style="{{dot.data}}" aria-current="{{cur.data}}" title="Data sources" aria-label="Data sources">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><ellipse cx="12" cy="6" rx="7" ry="3"></ellipse><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"></path></svg>
    </a>
    <div style="flex: 1"></div>
    <button type="button" data-fk="nav-toggle" onclick="{{toggleCollapse}}" aria-expanded="{{collapsedStr}}" aria-label="{{toggleLabel}}" title="{{toggleLabel}}" style="display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; border: 0; background: transparent; color: #5F6368; cursor: pointer">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="{{toggleChevronStyle}}"><path d="M11 6l-6 6 6 6"></path><path d="M17 6l-6 6 6 6"></path></svg>
    </button>
  </div>

  <!-- wide labeled panel: hidden while collapsed, the dock above still gets you everywhere -->
  <template data-sc="if" value="{{notCollapsed}}" hint-placeholder-val="{{ true }}">
  <nav aria-label="Sections" style="flex: 1 1 200px; min-width: 0; box-sizing: border-box; padding: 12px 12px 24px 0; display: flex; flex-direction: column; gap: 2px">
    <a href="Main.dc.html" style="{{s.overview}}" aria-current="{{cur.overview}}">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"></rect><rect x="13" y="4" width="7" height="7" rx="1.5"></rect><rect x="4" y="13" width="7" height="7" rx="1.5"></rect><rect x="13" y="13" width="7" height="7" rx="1.5"></rect></svg>
      <span style="flex: 1">Overview</span>
      <template data-sc="if" value="{{hasBadge}}" hint-placeholder-val="{{ true }}"><span style="min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 10px; background: #D93025; color: #FFFFFF; font-size: 12px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center" aria-label="{{badgeLabel}}" title="{{badgeLabel}}">{{badge}}</span></template>
    </a>

    <button type="button" data-fk="sec-explore" onclick="{{toggleExplore}}" aria-expanded="{{exploreStr}}" aria-controls="navsec-explore" style="display: flex; align-items: center; gap: 4px; width: 100%; margin-top: 14px; padding: 4px 0 4px 24px; border: 0; background: transparent; cursor: pointer; font: inherit; font-size: 12px; font-weight: 500; color: #5F6368; text-align: left">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="{{exploreChevron}}"><path d="M6 9l6 6 6-6"></path></svg>
      Explore
    </button>
    <template data-sc="if" value="{{exploreOpen}}" hint-placeholder-val="{{ true }}">
    <div id="navsec-explore" style="display: flex; flex-direction: column; gap: 2px">
      <a href="Journeys.dc.html" style="{{s.journeys}}" aria-current="{{cur.journeys}}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="5" cy="12" r="2"></circle><circle cx="19" cy="6" r="2"></circle><circle cx="19" cy="18" r="2"></circle><path d="M7 12h4l6-5.5M11 12l6 5.5"></path></svg>
        <span>Journeys</span>
      </a>
      <a href="Audiences.dc.html" style="{{s.audiences}}" aria-current="{{cur.audiences}}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3"></circle><path d="M3.5 19.5a5.5 5.5 0 0 1 11 0"></path><circle cx="17" cy="9" r="2.5"></circle><path d="M16 14.2a4.5 4.5 0 0 1 4.5 5.3"></path></svg>
        <span>Audiences</span>
      </a>
    </div>
    </template>

    <button type="button" data-fk="sec-insights" onclick="{{toggleInsights}}" aria-expanded="{{insightsStr}}" aria-controls="navsec-insights" style="display: flex; align-items: center; gap: 4px; width: 100%; margin-top: 14px; padding: 4px 0 4px 24px; border: 0; background: transparent; cursor: pointer; font: inherit; font-size: 12px; font-weight: 500; color: #5F6368; text-align: left">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="{{insightsChevron}}"><path d="M6 9l6 6 6-6"></path></svg>
      Insights
    </button>
    <template data-sc="if" value="{{insightsOpen}}" hint-placeholder-val="{{ true }}">
    <div id="navsec-insights" style="display: flex; flex-direction: column; gap: 2px">
      <a href="Ask.dc.html" style="{{s.ask}}" aria-current="{{cur.ask}}">
        <svg class="sq-sparkle" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7-4.7-1.8 4.7-1.8z"></path><path d="M18.5 15.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"></path></svg>
        <span>Chat now</span>
      </a>
      <a href="Brief.dc.html" style="{{s.brief}}" aria-current="{{cur.brief}}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"></path><path d="M14 3v5h5M9 13h7M9 17h5"></path></svg>
        <span>Recommendations</span>
      </a>
    </div>
    </template>

    <div style="height: 1px; background: #E8EAED; margin: 16px 0 12px 28px"></div>
    <a href="DataSources.dc.html" style="{{s.data}}" aria-current="{{cur.data}}">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><ellipse cx="12" cy="6" rx="7" ry="3"></ellipse><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"></path></svg>
      <span>Data sources</span>
    </a>
  </nav>
  </template>
</div>
