n    });\n    const bands = JD.bands.map(([a, b, v]) => ({\n      left: `calc(${pc(cx(a))} + 8px)`, width: `calc(${((cx(b) - cx(a)) / 10).toFixed(2)}% - 16px)`, h: (v * scale).toFixed(1) + 'px',\n      fill: (ps === a || ps === b) ? '#AECBFA' : '#EEF0F2'\n    }));\n    let bypass = { pts: '', op: 0 };\n    if (JD.bypass) {\n      const [a, b, t1, b1, t2, b2] = JD.bypass;\n      bypass = { pts: `${cx(a) + 8},${10 + t1 * scale} ${cx(b) - 8},${10 + t2 * scale} ${cx(b) - 8},${10 + b2 * scale} ${cx(a) + 8},${10 + b1 * scale}`, op: focus === a ? 0.9 : 0.45 };\n    }\n    const s = nodes[ps];\n    const merged = this.props.mergeBack === 'yes' || this.props.mergeBack === true;\n    const isEnd = raw[ps][3] === 'done';\n    const sel = {\n      label: ps === focus ? \"This issue's step\" : 'Selected step',\n      name: s.name, cause: s.cause, reachedTxt: s.reachedTxt, onTxt: s.onTxt, leftTxt: s.leftTxt,\n      leftStyle: s.share >= 20 ? 'color: #C5221F; font-weight: 500' : '',\n      sentence: isEnd ? `${s.reachedTxt} sessions finished the journey.`\n        : `${s.rateTxt} leave here, which is ${s.shareTxt} of everyone who leaves this journey.` + (s.loop ? ` ${s.loop[1]} went back to ${s.loop[0]}.` : ''),\n      notIssue: ps !== focus, reset: () => this.setState({ pathStep: undefined })\n    };\n\n    // ---------- Sankey: every direction out of and into each step ----------\n    const F = JD.flows;\n    const nIn = raw.map(() => 0), nOut = raw.map(() => 0);\n    F.forEach(([a, b, n]) => { if (typeof a === 'number') nOut[a] += n; if (typeof b === 'number') nIn[b] += n; });\n    const nodeV = raw.map((_, i) => Math.max(nIn[i], nOut[i]));\n    const Y0 = 8, HM = 200;\n    const skS = HM / Math.max(...nodeV);\n    const exitY = Y0 + HM + 56;\n    const skH = exitY + 50;\n    const outRank = (f) => (f[1] === f[0] + 1 ? 0 : typeof f[1] === 'number' ? 1 : f[3] === 'other' ? 2 : 3);\n    const inRank = (f) => (f[0] === 'start' ? 2 : f[0] === f[1] - 1 ? 0 : 1);\n    const ordered = (key) => F.map((f, i) => [f, i]).sort((x, y) => key(x[0]) - key(y[0]) || x[1] - y[1]).map((x) => x[0]);\n    const pos = new Map(F.map((f) => [f, {}]));\n    const oy = raw.map(() => Y0), iy = raw.map(() => Y0);\n    ordered(outRank).forEach((f) => { if (typeof f[0] !== 'number') return; const h = Math.max(1.5, f[2] * skS); Object.assign(pos.get(f), { a0: oy[f[0]], b0: oy[f[0]] + h }); oy[f[0]] += h; });\n    ordered(inRank).forEach((f) => { if (typeof f[1] !== 'number') return; const h = Math.max(1.5, f[2] * skS); Object.assign(pos.get(f), { a1: iy[f[1]], b1: iy[f[1]] + h }); iy[f[1]] += h; });\n    const NODEC = { natural: '#34A853', word: '#1A73E8', bug: '#D93025', done: '#1E8E3E' };\n    const FWDC = { natural: '#DCEFE2', word: '#DCE8FC', bug: '#FADBD8' };\n    const EXC = { quit: ['#E8EAED', '#9AA0A6', '#5F6368'], word: ['#D2E3FC', '#1A73E8', '#174EA6'], bug: ['#FAD2CF', '#D93025', '#C5221F'], other: ['#CBF0F8', '#12B5CB', '#007B83'] };\n    const r1 = (v) => v.toFixed(1);\n    const ribbon = (x0, a0, b0, x1, a1, b1) => { const m = (x0 + x1) / 2; return `M${r1(x0)},${r1(a0)} C${r1(m)},${r1(a0)} ${r1(m)},${r1(a1)} ${r1(x1)},${r1(a1)} L${r1(x1)},${r1(b1)} C${r1(m)},${r1(b1)} ${r1(m)},${r1(b0)} ${r1(x0)},${r1(b0)} Z`; };\n    const skPaths = [], skRects = [], skLabels = [];\n    F.forEach((f) => {\n      const [a, b, n, k, label] = f;\n      const P = pos.get(f);\n      const hot = a === ps || b === ps;\n      const op = hot ? 1 : 0.85;\n      if (a === 'start') {\n        if (b === 0) return;\n        skPaths.push({ d: ribbon(0, P.a1, P.b1, cx(b), P.a1, P.b1), fill: '#EEF0F2', op: 1 });\n        skLabels.push({ txt: `${fmt(n)} started here` + (label ? ` · ${label}` : ''), left: '4px', top: r1((P.a1 + P.b1) / 2 - 8) + 'px', tf: 'none', style: 'color: #5F6368' });\n      } else if (typeof b === 'number') {\n        const skip = b !== a + 1;\n        skPaths.push({ d: ribbon(cx(a), P.a0, P.b0, cx(b), P.a1, P.b1), fill: skip ? '#DADCE0' : FWDC[raw[a][3]], op });\n        if (skip) skLabels.push({ txt: `${fmt(n)} ${label}`, left: pc((cx(a + 1) + cx(b - 1)) / 2), top: r1((P.a1 + P.b1) / 2 - 8) + 'px', tf: 'translateX(-50%)', style: 'color: #3C4043; font-weight: 500' });\n      } else {\n        const ek = k === 'other' ? 'other' : k;\n        const xe = cx(a) + colW * (k === 'other' ? 0.64 : 0.36);\n        const h = P.b0 - P.a0;\n        const w2 = Math.max(1.2, h * 0.4);\n        const x0 = cx(a);\n        skPaths.push({ d: `M${r1(x0)},${r1(P.a0)} C${r1(xe + w2)},${r1(P.a0)} ${r1(xe + w2)},${r1(P.a0)} ${r1(xe + w2)},${exitY} L${r1(xe - w2)},${exitY} C${r1(xe - w2)},${r1(P.b0)} ${r1(xe - w2)},${r1(P.b0)} ${r1(x0)},${r1(P.b0)} Z`, fill: EXC[ek][0], op: hot ? 1 : 0.7 });\n        const bw = Math.max(8, h);\n        skRects.push({ left: `calc(${pc(xe)} - ${r1(bw / 2)}px)`, w: r1(bw) + 'px', top: exitY + 'px', h: '6px', fill: EXC[ek][1], ring: '' });\n        skLabels.push({ txt: k === 'other' ? `${fmt(n)} → ${label}` : `${fmt(n)} left`, left: pc(xe), top: (exitY + (k === 'other' ? 28 : 10)) + 'px', tf: 'translateX(-50%)', style: `color: ${EXC[ek][2]};` + (hot ? ' font-weight: 500;' : '') });\n      }\n    });\n    raw.forEach(([name, , , ck], i) => {\n      const h = Math.max(3, nodeV[i] * skS);\n      skRects.push({ left: `calc(${pc(cx(i))} - 6px)`, w: '12px', top: Y0 + 'px', h: r1(h) + 'px', fill: NODEC[ck], ring: i === ps ? 'box-shadow: 0 0 0 2px #FFFFFF, 0 0 0 4px #1A73E8;' : '' });\n      if (ck === 'done') skLabels.push({ txt: 'completed', left: pc(cx(i)), top: r1(Y0 + h + 6) + 'px', tf: 'translateX(-50%)', style: 'color: #137333; font-weight: 500' });\n    });\n    const sk = {\n      h: skH + 'px', vb: `0 0 1000 ${skH}`, paths: skPaths, rects: skRects, labels: skLabels,\n      aria: 'Flow of sessions: ' + F.filter((f) => f[0] !== 'start').map(([a, b, n, k, label]) => `${raw[a][0]} to ${typeof b === 'number' ? raw[b][0] : k === 'other' ? label : 'left the app'} ${fmt(n)}`).join('; ') + '. Use the table view for exact numbers.'\n    };\n    const arcMax = Math.max(...JD.arcs.map((a) => a[2]));\n    const arcs = JD.arcs.map(([from, to, n, color]) => {\n      const w = Math.max(3, Math.round(n / arcMax * 12));\n      const touches = from === ps || to === ps;\n      return { left: pc(cx(to)), width: ((cx(from) - cx(to)) / 10).toFixed(2) + '%', color: touches ? color : '#DADCE0', w: w + 'px', h: Math.round(48 + n / arcMax * 52) + 'px', n, labelTop: (-24 - w) + 'px' };\n    });\n    const dots = raw.map((_, i) => ({ x: pc(cx(i)), fill: i === ps ? '#1A73E8' : '#FFFFFF', stroke: i === ps ? '#1A73E8' : '#9AA0A6' }));\n    const redTile = 'border-color: #F6AEA9; background: #FFFBFA;';\n    const bfTiles = (JD.T[ps] || []).map((t) => ({ ...t, style: t.hot ? redTile : '', numStyle: t.hot ? 'color: #C5221F' : '' }));\n    const DARK = { '#D93025': '#C5221F', '#F9AB00': '#B06000', '#1E8E3E': '#137333' };\n    const marcs = JD.arcs.map(([from, to, n, color]) => {\n      const w = Math.max(2, Math.round(n / arcMax * 8));\n      const touches = from === ps || to === ps;\n      return { left: pc(cx(to)), width: ((cx(from) - cx(to)) / 10).toFixed(2) + '%', h: Math.round(26 + n / arcMax * 48) + 'px', w: w + 'px', color: touches ? color : '#E8EAED', txt: touches ? DARK[color] : '#9AA0A6', n, labelTop: (-10 - w) + 'px' };\n    });\n    const goodHere = JD.arcs.some(([from, to, , color]) => color === '#1E8E3E' && (from === ps || to === ps));\n    const mTiles = bfTiles.concat(goodHere ? [{ label: 'Good friction', title: JD.good.title, num: '', sub: JD.good.sub, style: 'border-color: #CEEAD6; background: #F6FBF7;', numStyle: '' }] : []);\n\n    const steps = JD.gridSteps;\n    const META = {\n      exit: { label: 'Exit rate', name: 'exit at this step', cuts: [3, 8, 14, 25] },\n      taps: { label: 'Repeated taps', name: 'repeated taps', cuts: [1, 3, 5, 7] },\n      back: { label: 'Going back', name: 'going back and forth', cuts: [1, 2, 4, 6] },\n      dead: { label: 'Dead taps', name: 'taps that did nothing', cuts: [1, 2, 4, 6] },\n      stuck: { label: 'Stuck >30s', name: 'stuck over 30 seconds', cuts: [3, 8, 14, 20] }\n    };\n    const M = META[metric];\n    const rows = JD.D[metric];\n    const scaleC = ['#F1F3F4', '#D2E3FC', '#AECBFA', '#669DF6', '#1967D2'];\n    const focusRow = steps.indexOf(stepNames[focus]);\n    const segGroup = { 'Individual traders': 'Individual trader', 'Large businesses': 'Large business' }[I.segment || ''];\n    const segCol = segGroup ? groups.indexOf(segGroup) : -1;\n    const grid = rows.map((vals, r) => ({\n      name: steps[r],\n      nameStyle: r === focusRow ? 'box-shadow: inset 4px 0 0 #1A73E8; color: #174EA6' : '',\n      cells: vals.map((v, c) => {\n        const hit = r === focusRow && c === segCol;\n        if (v === null) return { v: 'few', bg: '#FFFFFF', fg: '#5F6368', ring: '' };\n        let k = 0; while (k < M.cuts.length && v >= M.cuts[k]) k++;\n        return { v: v.toFixed(1) + '%', bg: scaleC[k], fg: k >= 3 ? '#FFFFFF' : '#202124', ring: hit ? 'font-weight: 700; outline: 2px solid #202124; outline-offset: -4px; border-radius: 6px' : '' };\n      })\n    }));\n    const on = 'background: #E8F0FE; color: #174EA6;';\n    const metrics = Object.keys(META).map((k) => ({ label: META[k].label, sel: metric === k ? 'true' : 'false', style: metric === k ? on : '', pick: () => this.setState({ metric: k }) }));\n    const more = ISSUES.length - 4;\n\n    return {\n      jtabs, crumb: JD.crumb, keepText: JD.keepText, isMock: JD.mock, topName: ISSUES[0].short,\n      cols: `repeat(${nSteps}, minmax(0, 1fr))`, hasBypass: !!JD.bypass, arcsAria: JD.arcsAria, good: JD.good,\n      strip, issues, hero, vis,\n      formFields: ['38%', '46%', '30%', '52%'], formFields3: ['42%', '56%', '34%'],\n      extraSel: cur >= 4, listOpen, listOpenStr: listOpen ? 'true' : 'false',\n      moreLabel: listOpen ? 'Hide list' : (more > 0 ? `+${more} more` : 'See as list'),\n      toggleList: () => this.setState({ listOpen: !listOpen }),\n      goTop: () => pick(0),\n      bursts: ['27.5%', '32.5%', '37.5%', '42.5%', '47.5%', '51.5%'],\n      nodes, bands, bypass, sel, arcs, dots, bfTiles, sk, marcs, mTiles,\n      merged, notMerged: !merged, showMTiles: merged && mTiles.length > 0,\n      isChart: view === 'chart', isTable: view === 'table',\n      chartPressed: view === 'chart' ? 'true' : 'false', tablePressed: view === 'table' ? 'true' : 'false',\n      chartBtn: view === 'chart' ? on : '', tableBtn: view === 'table' ? on : '',\n      showChart: () => this.setState({ view: 'chart' }), showTable: () => this.setState({ view: 'table' }),\n      metrics, grid, metricName: M.name,\n      products: [\n        ['Send money', 516, 71, 'Checkout and PIN (21.4%), after an error or a tap that did nothing'],\n        ['Cable TV and internet', 608, 80, 'Details (10.5%), stuck on the wording'],\n        ['Game voucher', 534, 82, 'Checkout and PIN (9.7%), after going back a step'],\n        ['Water bills', 531, 83, 'Details (9.8%), after an error or a tap that did nothing'],\n        ['Electricity bills', 567, 83, 'Checkout and PIN (8.4%), after an error or a tap that did nothing'],\n        ['E-load', 2167, 83, 'Choose product (7.1%), mostly browsing'],\n        ['Post-paid telecom', 553, 88, 'Details (6.9%), after going back a step']\n      ].map(([name, sN, pct, where]) => ({ name, sessions: fmt(sN), pct: pct + '%', w: pct + '%', where, color: pct < 71.5 ? '#D93025' : '#8AB4F8', pctStyle: pct < 71.5 ? 'font-weight: 500; color: #C5221F' : '' }))\n    };\n  }\n}"}, "Main": {"html": "<div style=\"min-height: 100vh; background: #F8F9FA; color: #202124; font-family: 'Google Sans Flex', 'Google Sans', Roboto, system-ui, sans-serif; font-size: 14px; line-height: 20px\">\n  <dc-import name=\"TopBar\" hint-size=\"100%,64px\"><\/dc-import>\n  <div style=\"display: flex; flex-wrap: wrap; align-items: flex-start\">\n    <div style=\"flex: 1 1 256px; max-width: 100%\"><dc-import name=\"NavRail\" active=\"overview\" hint-size=\"256px,640px\"><\/dc-import><\/div>\n    <main style=\"flex: 999 1 560px; min-width: 0; padding: 28px 32px 64px; box-sizing: border-box\">\n      <div style=\"max-width: 1120px; display: flex; flex-direction: column; gap: 24px\">\n\n        <div style=\"display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px\">\n          <div>\n          <div style=\"display: flex; align-items: center; gap: 4px\">\n              <h1 style=\"margin: 0; font-size: 28px; line-height: 36px; font-weight: 400\">Overview<\/h1>\n            <\/div>\n            <p style=\"margin: 4px 0 0; color: #5F6368\"><span style=\"font-weight: 500; color: #202124\">What needs attention this week?<\/span> Ranked by money at risk.<\/p>\n          <\/div>\n          <a class=\"btn btn-outlined\" href=\"Brief.dc.html\">\n            <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 3h9l4 4v14H6z\"><\/path><path d=\"M14 3v5h5M9 13h7M9 17h5\"><\/path><\/svg>\n            Weekly brief\n          <\/a>\n        <\/div>\n\n        <dc-import name=\"ScopeBar\" hint-size=\"100%,40px\"><\/dc-import>\n\n        <section class=\"card\" aria-labelledby=\"takeaway\" style=\"padding: 28px 32px; display: flex; flex-direction: column; gap: 24px\">\n          <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 8px\">\n            <h2 id=\"takeaway\" style=\"margin: 0; font-size: 14px; line-height: 20px; font-weight: 500; color: #1967D2\">This week's takeaway<\/h2>\n            <span class=\"tag\">Calculated<\/span>\n            <span class=\"rank\" style=\"margin-left: 8px\" title=\"Problem 1 of 3\">P1<\/span>\n            <span class=\"chip\" style=\"background: #FCE8E6; color: #C5221F\"><span class=\"dot\" style=\"background: #D93025\"><\/span>Critical · Bug<\/span>\n            <span class=\"num\" style=\"margin-left: auto; font-size: 20px; line-height: 28px; font-weight: 500\">₱3,780<span style=\"font-size: 13px; font-weight: 400; color: #5F6368\"> /wk at risk<\/span><\/span>\n          <\/div>\n          <p style=\"margin: 0; font-size: 28px; line-height: 36px; font-weight: 400\">Fix <span style=\"font-weight: 500\">Send money checkout<\/span> for individual traders<\/p>\n\n          <div style=\"display: flex; flex-wrap: wrap; gap: 20px 40px; padding: 20px 24px; background: #F8F9FA; border-radius: 12px\">\n            <div style=\"flex: 1 1 300px; display: flex; flex-direction: column; gap: 6px\">\n              <div style=\"display: flex; align-items: center; gap: 8px\"><span class=\"lbl\">Why<\/span><span class=\"tag tag-ai\">AI<\/span><\/div>\n              <p style=\"margin: 0; font-size: 20px; line-height: 28px\">The payment call is timing out.<\/p>\n              <p style=\"margin: 0; font-size: 13px; color: #5F6368\">payment_timeout errors, then 168 repeated taps on Pay.<\/p>\n            <\/div>\n            <div style=\"flex: 1 1 300px; display: flex; flex-direction: column; gap: 6px\">\n              <div style=\"display: flex; align-items: center; gap: 8px\"><span class=\"lbl\">Evidence<\/span><span class=\"tag\">Calculated<\/span><\/div>\n              <div style=\"display: flex; align-items: center; gap: 16px\">\n                <span class=\"num\" style=\"font-size: 32px; line-height: 40px\">61%<\/span>\n                <div title=\"Share of sessions that end at Checkout and PIN\" style=\"position: relative; flex: 1; height: 10px; border-radius: 5px; background: #E8EAED\">\n                  <div style=\"width: 61%; height: 100%; border-radius: 5px; background: #D93025\"><\/div>\n                  <span style=\"position: absolute; left: 9%; top: -4px; width: 2px; height: 18px; border-radius: 1px; background: #3C4043\"><\/span>\n                <\/div>\n              <\/div>\n              <p style=\"margin: 0; font-size: 13px; color: #5F6368\">of their sessions end at checkout, vs 9% for everyone else<\/p>\n            <\/div>\n          <\/div>\n\n          <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px\">\n            <span class=\"meta\" title=\"Sessions affected\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" aria-hidden=\"true\"><circle cx=\"9\" cy=\"8\" r=\"3\"><\/circle><path d=\"M3.5 19.5a5.5 5.5 0 0 1 11 0\"><\/path><circle cx=\"17\" cy=\"9\" r=\"2.5\"><\/circle><path d=\"M16 14.2a4.5 4.5 0 0 1 4.5 5.3\"><\/path><\/svg><span class=\"num\">157<\/span><span class=\"sr\">sessions<\/span><\/span>\n            <span class=\"meta\" title=\"High confidence\"><span style=\"display: inline-flex; gap: 2px; align-items: flex-end\" aria-hidden=\"true\"><span style=\"width: 4px; height: 7px; border-radius: 1px; background: #1A73E8\"><\/span><span style=\"width: 4px; height: 11px; border-radius: 1px; background: #1A73E8\"><\/span><span style=\"width: 4px; height: 15px; border-radius: 1px; background: #1A73E8\"><\/span><\/span><span class=\"sr\">High confidence<\/span><\/span>\n            <span class=\"meta\" title=\"Spotted 30 days ago\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"8.5\"><\/circle><path d=\"M12 7.5V12l3 2\"><\/path><\/svg>30d<span class=\"sr\">, spotted 30 days ago<\/span><\/span>\n            <div style=\"margin-left: auto; display: flex; flex-wrap: nowrap; align-items: center; gap: 8px\">\n              <a class=\"btn btn-tonal\" href=\"Main.dc.html\">Draft ticket<\/a>\n              <a class=\"btn btn-filled\" href=\"Journeys.dc.html\">Open in Journeys<\/a>\n              <button type=\"button\" class=\"ibtn\" aria-label=\"More: assign owner, snooze, mark fixed\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"currentColor\" aria-hidden=\"true\"><circle c    <div style=\"display: flex; align-items: center; gap: 4px; padding: 16px 20px 8px\">\n            <h2 id=\"problems\" class=\"h2\">Other problems<\/h2>\n            <button type=\"button\" class=\"info\" aria-label=\"Ranked by impact: severity × people affected × value. Select a row to expand.\" title=\"Ranked by impact: severity × people affected × value\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\/circle><path d=\"M12 11v5.5\"><\/path><circle cx=\"12\" cy=\"7.8\" r=\".6\" fill=\"currentColor\"><\/circle><\/svg><\/button>\n          <\/div>\n          <div style=\"overflow-x: auto\">\n            <div style=\"min-width: 760px\">\n              <div class=\"cols\" style=\"padding: 8px 20px; border-bottom: 1px solid #DADCE0\" aria-hidden=\"true\">\n                <span><\/span><span class=\"lbl\">What to do<\/span><span class=\"lbl\">Leave at this step<\/span><span class=\"lbl\" style=\"text-align: right\">At risk /wk<\/span><span class=\"lbl\">Conf.<\/span><span><\/span>\n              <\/div>\n              <template data-sc=\"for\" list=\"{{problems}}\" as=\"p\" hint-placeholder-count=\"2\">\n                <div style=\"border-bottom: 1px solid #F1F3F4; {{p.openBg}}\">\n                  <button type=\"button\" class=\"row cols\" onClick=\"{{p.toggle}}\" aria-expanded=\"{{p.openStr}}\">\n                    <span class=\"rank\">P{{p.rank}}<\/span>\n                    <span style=\"display: flex; align-items: center; gap: 10px; min-width: 0\">\n                      <span class=\"chip\" style=\"background: {{p.sevBg}}; color: {{p.sevFg}}; flex: none\"><span class=\"dot\" style=\"background: {{p.causeColor}}\"><\/span>{{p.sev}} · {{p.cause}}<\/span>\n                      <span style=\"min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap\">{{p.action}} <span style=\"font-weight: 500\">{{p.item}}<\/span> for {{p.who}} <span style=\"color: #5F6368\">· {{p.ctx}}<\/span><\/span>\n                    <\/span>\n                    <span style=\"display: flex; align-items: center; gap: 10px\">\n                      <span class=\"num\" style=\"font-weight: 500; width: 40px\">{{p.stat}}<\/span>\n                      <span style=\"position: relative; flex: 1; height: 8px; border-radius: 4px; background: #F1F3F4\">\n                        <span style=\"display: block; width: {{p.statW}}; height: 100%; border-radius: 4px; background: {{p.barColor}}\"><\/span>\n                        <template data-sc=\"if\" value=\"{{p.hasBase}}\" hint-placeholder-val=\"{{ false }}\"><span style=\"position: absolute; left: {{p.baseW}}; top: -4px; width: 2px; height: 16px; border-radius: 1px; background: #3C4043\"><\/span><\/template>\n                      <\/span>\n                      <span class=\"num cap\" style=\"width: 60px; white-space: nowrap\">{{p.baseShort}}<\/span>\n                    <\/span>\n                    <span class=\"num\" style=\"text-align: right; {{p.valueStyle}}\">{{p.value}}<\/span>\n                    <span style=\"display: inline-flex; gap: 2px; align-items: flex-end\" title=\"{{p.confLabel}} confidence\"><span class=\"sr\">{{p.confLabel}} confidence<\/span><span style=\"width: 4px; height: 7px; border-radius: 1px; background: {{p.c1}}\"><\/span><span style=\"width: 4px; height: 11px; border-radius: 1px; background: {{p.c2}}\"><\/span><span style=\"width: 4px; height: 15px; border-radius: 1px; background: {{p.c3}}\"><\/span><\/span>\n                    <span style=\"display: inline-flex; color: #5F6368\">\n                      <template data-sc=\"if\" value=\"{{p.open}}\" hint-placeholder-val=\"{{ false }}\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M7 14l5-5 5 5\"><\/path><\/svg><\/template>\n                      <template data-sc=\"if\" value=\"{{p.closed}}\" hint-placeholder-val=\"{{ true }}\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M7 10l5 5 5-5\"><\/path><\/svg><\/template>\n                    <\/span>\n                  <\/button>\n                  <template data-sc=\"if\" value=\"{{p.open}}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"padding: 0 20px 16px 60px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px\">\n                      <span style=\"display: inline-flex; align-items: center; gap: 8px\"><span class=\"lbl\">Why<\/span><span class=\"tag tag-ai\">AI<\/span>{{p.why}}<\/span>\n                      <span class=\"cap num\" style=\"font-size: 13px\">{{p.sessions}} sessions · spotted {{p.ageLong}}<\/span>\n                      <span style=\"margin-left: auto; display: flex; flex-wrap: nowrap; gap: 8px; align-items: center\">\n                        <a class=\"btn btn-tonal\" href=\"Main.dc.html\">Draft ticket<\/a>\n                        <a class=\"btn btn-filled\" href=\"Journeys.dc.html\">Open in Journeys<\/a>\n                        <button type=\"button\" class=\"ibtn\" aria-label=\"More: assign owner, snooze, mark fixed\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"currentColor\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"5\" r=\"1.8\"><\/circle><circle cx=\"12\" cy=\"12\" r=\"1.8\"><\/circle><circle cx=\"12\" cy=\"19\" r=\"1.8\"><\/circle><\/svg><\/button>\n                      <\/span>\n                    <\/div>\n                  <\/template>\n                <\/div>\n              <\/template>\n            <\/div>\n          <\/div>\n        <\/section>\n\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px; align-items: start\">\n          <section class=\"card\" aria-labelledby=\"why-leave\" style=\"padding: 20px 24px; display: flex; flex-direction: column; gap: 14px\">\n            <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 8px\">\n              <h2 id=\"why-leave\" class=\"h2\" style=\"font-size: 16px\">Why people leave<\/h2>\n              <span class=\"cap num\">875 exits<\/span>\n            <\/div>\n            <div style=\"display: flex; height: 12px; border-radius: 6px; overflow: hidden; gap: 2px\" role=\"img\" aria-label=\"Technical bug 25%, Confusing wording 17%, UX friction 3%, Natural exit 55%\">\n              <div style=\"width: 25%; background: #D93025\"><\/div>\n              <div style=\"width: 17%; background: #1A73E8\"><\/div>\n              <div style=\"width: 3%; background: #F9AB00\"><\/div>\n              <div style=\"width: 55%; background: #BDC1C6\"><\/div>\n            <\/div>\n            <div style=\"display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 13px\">\n              <span style=\"display: inline-flex; align-items: center; gap: 6px\"><span class=\"dot\" style=\"background: #D93025\"><\/span>Bug <span class=\"num\" style=\"font-weight: 500\">25%<\/span><\/span>\n              <span style=\"display: inline-flex; align-items: center; gap: 6px\"><span class=\"dot\" style=\"background: #1A73E8\"><\/span>Wording <span class=\"num\" style=\"font-weight: 500\">17%<\/span><\/span>\n              <span style=\"display: inline-flex; align-items: center; gap: 6px\"><span class=\"dot\" style=\"background: #F9AB00\"><\/span>UX <span class=\"num\" style=\"font-weight: 500\">3%<\/span><\/span>\n              <span style=\"display: inline-flex; align-items: center; gap: 6px; color: #5F6368\" title=\"No fix needed. Don't add pop-ups to hold these people back.\"><span class=\"dot\" style=\"background: #BDC1C6\"><\/span>Natural <span class=\"num\">55%<\/span> · no fix needed<\/span>\n            <\/div>\n          <\/section>\n          <section class=\"card\" aria-labelledby=\"checked\" style=\"padding: 20px 24px; display: flex; flex-direction: column; gap: 12px\">\n            <h2 id=\"checked\" class=\"h2\" style=\"font-size: 16px\">Also checked<\/h2>\n            <div style=\"display: flex; align-items: center; gap: 10px\">\n              <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1E8E3E\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\/circle><path d=\"M8 12.5l2.8 2.8L16.5 9.5\"><\/path><\/svg>\n              <span title=\"87% of large-business top-ups exceed ₱5,000; errors are low\">Keep <span style=\"font-weight: 500\">Top-up flow<\/span> as is for large businesses <a href=\"Audiences.dc.html\" style=\"text-decoration: none; font-size: 13px\">· a growth audience →<\/a><\/span>\n            <\/div>\n            <div style=\"display: flex; align-items: center; gap: 10px\">\n              <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#5F6368\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\/circle><path d=\"M8 12h8\"><\/path><\/svg>\n              <span title=\"1,432 duplicate checkout events, Sep 22–26, app 4.11.1\">Ruled out: Android double-fire, already fixed<\/span>\n            <\/div>\n          <\/section>\n        <\/div>\n\n        <p class=\"cap\" style=\"margin: 0\">₱ values are estimates · Sample data<\/p>\n      <\/div>\n    <\/main>\n  <\/div>\n<\/div>", "js": "class Component extends DCLogic {\n  renderVals() {\n    const openIdx = this.state.openIdx === undefined ? -1 : this.state.openIdx;\n    const sev = {\n      Critical: { bg: '#FCE8E6', fg: '#C5221F' },\n      Warning: { bg: '#FEF7E0', fg: '#B06000' }\n    };\n    const confBars = (n) => [1, 2, 3].map((i) => (i <= n ? '#1A73E8' : '#DADCE0'));\n    // Headline grammar: [Action] [Item] for [Who] · [context]\n    // Action follows type and confidence: Fix (bug, high), Investigate (medium/low),\n    // Rewrite (wording), Simplify (UX friction), Keep (natural exit / healthy).\n    const problems = [\n      { rank: 2, sev: 'Critical', cause: 'Bug', causeColor: '#D93025', value: '₱2,940',\n        action: 'Investigate', item: 'OTP code', who: 'all users', ctx: 'spike on Oct 9, 02:00–10:00 UTC',\n        stat: 68, base: 5, baseShort: 'vs 5%', barColor: '#D93025',\n        why: 'Codes likely not arriving', sessions: '134', conf: 2, ageLong: '6 days ago' },\n      { rank: 3, sev: 'Warning', cause: 'Wording', causeColor: '#1A73E8', value: 'n/a',\n        action: 'Rewrite', item: 'Personal data labels', who: 'all users', ctx: 'worst for individual traders',\n        stat: 18, base: null, baseShort: 'max 32%', barColor: '#F9AB00',\n        why: 'Long pauses, few errors', sessions: '2,509', conf: 3, ageLong: 'today' }\n    ].map((p, i) => {\n      const [c1, c2, c3] = confBars(p.conf);\n      const open = openIdx === i;\n      return {\n        ...p,\n        sevBg: sev[p.sev].bg, sevFg: sev[p.sev].fg,\n        stat: p.stat + '%', statW: p.stat + '%',\n        hasBase: p.base !== null, baseW: (p.base ?? 0) + '%',\n        valueStyle: p.value === 'n/a' ? 'color: #5F6368' : 'font-weight: 500',\n        c1, c2, c3, confLabel: ['', 'Low', 'Medium', 'High'][p.conf],\n        open, closed: !open, openStr: open ? 'true' : 'false',\n        openBg: open ? 'background: #FAFBFF;' : '',\n        toggle: () => this.setState({ openIdx: open ? -1 : i })\n      };\n    });\n    return { problems };\n  }\n}"}, "NavRail": {"html": "<nav aria-label=\"Sections\" style=\"box-sizing: border-box; width: 100%; min-height: 640px; padding: 12px 12px 24px 0; display: flex; flex-direction: column; gap: 2px; font-family: 'Google Sans Flex', 'Google Sans', Roboto, system-ui, sans-serif; font-size: 14px; line-height: 20px; color: #3C4043\">\n  <a href=\"Main.dc.html\" style=\"{{s.overview}}\">\n    <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentC -hidden=\"true\"><path d=\"M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7-4.7-1.8 4.7-1.8z\"><\/path><path d=\"M18.5 15.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z\"><\/path><\/svg>\n    <span>Ask<\/span>\n  <\/a>\n  <a href=\"Brief.dc.html\" style=\"{{s.brief}}\">\n    <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 3h9l4 4v14H6z\"><\/path><path d=\"M14 3v5h5M9 13h7M9 17h5\"><\/path><\/svg>\n    <span>Weekly brief<\/span>\n  <\/a>\n\n  <div style=\"flex: 1; min-height: 32px\"><\/div>\n  <a href=\"DataSources.dc.html\" style=\"{{s.data}}\">\n    <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" aria-hidden=\"true\"><ellipse cx=\"12\" cy=\"6\" rx=\"7\" ry=\"3\"><\/ellipse><path d=\"M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3\"><\/path><\/svg>\n    <span>Data sources<\/span>\n  <\/a>\n<\/nav>", "js": "class Component extends DCLogic {\n  renderVals() {\n    const active = this.props.active ?? 'overview';\n    const base = 'display: flex; align-items: center; gap: 14px; height: 44px; padding: 0 16px 0 28px; border-radius: 0 22px 22px 0; text-decoration: none; ';\n    const on = base + 'background: #E8F0FE; color: #174EA6; font-weight: 500;';\n    const off = base + 'background: transparent; color: #3C4043; font-weight: 400;';\n    const keys = ['overview', 'journeys', 'audiences', 'ask', 'brief', 'data'];\n    const s = {};\n    keys.forEach((k) => { s[k] = k === active ? on : off; });\n    return { s };\n  }\n}"}, "ProblemDetail": {"html": "<aside aria-labelledby=\"pd-title\" style=\"width: 560px; min-height: 1900px; box-sizing: border-box; background: #FFFFFF; border-left: 1px solid #DADCE0; box-shadow: -2px 0 8px rgba(60,64,67,.12); font-family: 'Google Sans Flex', 'Google Sans', Roboto, system-ui, sans-serif; font-size: 14px; line-height: 20px; color: #202124; display: flex; flex-direction: column\">\n\n  <div style=\"padding: 16px 16px 20px 28px; display: flex; flex-direction: column; gap: 12px\">\n    <div style=\"display: flex; align-items: center; gap: 8px\">\n      <span class=\"chip\" style=\"background: {{d.chipBg}}; color: {{d.chipFg}}\"><span class=\"dot\" style=\"background: {{d.dot}}\"><\/span>{{d.chip}}<\/span>\n      <span class=\"cap\" style=\"margin-left: 4px\">{{d.pid}} · problem {{d.rank}} of 3<\/span>\n      <template data-sc=\"if\" value=\"{{closeLink}}\" hint-placeholder-val=\"{{ true }}\"><a href=\"Journeys.dc.html\" aria-label=\"Close and go back to Journeys\" style=\"margin-left: auto; width: 40px; height: 40px; border-radius: 20px; display: inline-flex; align-items: center; justify-content: center; color: #5F6368\">\n        <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M6 6l12 12M18 6L6 18\"><\/path><\/svg>\n      <\/a><\/template><template data-sc=\"if\" value=\"{{closeCb}}\" hint-placeholder-val=\"{{ false }}\"><button type=\"button\" aria-label=\"Close drawer\" onClick=\"{{close}}\" style=\"margin-left: auto; width: 40px; height: 40px; border-radius: 20px; display: inline-flex; align-items: center; justify-content: center; color: #5F6368; border: 0; background: transparent; cursor: pointer; padding: 0\">\n        <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M6 6l12 12M18 6L6 18\"><\/path><\/svg>\n      <\/button><\/template>\n    <\/div>\n    <h1 id=\"pd-title\" style=\"margin: 0; font-size: 24px; line-height: 32px; font-weight: 400\">{{d.action}} <span style=\"font-weight: 500\">{{d.item}}<\/span> for {{d.who}}<\/h1>\n    <p style=\"margin: -4px 0 0; color: #5F6368\">{{d.sub}}<\/p>\n    <p class=\"cap\" style=\"margin: 0\">Full diagnosis. Where it happens and who is affected are on the Journeys page behind this drawer.<\/p>\n    <div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; padding: 16px; background: #F8F9FA; border-radius: 12px\">\n      <div><div class=\"lbl\">At risk<\/div><div class=\"num\" style=\"font-size: 20px; line-height: 28px; {{d.valueStyle}}\">{{d.value}}<span style=\"font-size: 13px; color: #5F6368\">{{d.unit}}<\/span><\/div><\/div>\n      <div><div class=\"lbl\">Sessions<\/div><div class=\"num\" style=\"font-size: 20px; line-height: 28px\">{{d.sessions}}<\/div><\/div>\n      <div><div class=\"lbl\">Confidence<\/div><div style=\"display: flex; align-items: center; gap: 8px; font-size: 20px; line-height: 28px\">{{d.conf}}\n        <span aria-hidden=\"true\" style=\"display: inline-flex; gap: 2px; align-items: flex-end\"><span style=\"width: 4px; height: 8px; background: {{d.c1}}; border-radius: 1px\"><\/span><span style=\"width: 4px; height: 12px; background: {{d.c2}}; border-radius: 1px\"><\/span><span style=\"width: 4px; height: 16px; background: {{d.c3}}; border-radius: 1px\"><\/span><\/span>\n      <\/div><\/div>\n    <\/div>\n    <div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n      <button type=\"button\" class=\"btn btn-filled\">\n        <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" aria-hidden=\"true\"><rect x=\"3\" y=\"6\" width=\"18\" height=\"12\" rx=\"2\"><\/rect><path d=\"M9 6v12\" stroke-dasharray=\"2 2\"><\/path><\/svg>\n        Draft ticket\n      <\/button>\n      <template data-sc=\"if\" value=\"{{watchLink}}\" hint-placeholder-val=\"{{ true }}\"><a class=\"btn btn-outlined\" href=\"{{d.watchHref}}\">\n        <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"currentColor\" aria-hidden=\"true\"><path d=\"M8 5.5v13l10.5-6.5z\"><\/path><\/svg>\n        Watch sessions\n      <\/a><\/template><template data-sc=\"if\" value=\"{{watchCb}}\" hint-placeholder-val=\" n.c}} <span style=\"color: #5F6368\">{{n.d}}<\/span><\/li>\n      <\/template>\n    <\/ol>\n  <\/section>\n\n  <section class=\"blk\" aria-labelledby=\"pd-ev\">\n    <div style=\"display: flex; align-items: center; gap: 8px\"><h2 id=\"pd-ev\" class=\"sec\">The evidence<\/h2><span class=\"tag\">Calculated<\/span><\/div>\n    <div style=\"display: grid; grid-template-columns: 130px 1fr 56px; gap: 6px 12px; align-items: center\">\n      <span><\/span><span class=\"cap\" style=\"display: flex; gap: 16px\"><span style=\"display: inline-flex; align-items: center; gap: 6px\"><span class=\"dot\" style=\"background: #D93025\"><\/span>{{d.nowLabel}}<\/span><span style=\"display: inline-flex; align-items: center; gap: 6px\"><span class=\"dot\" style=\"background: #9AA0A6\"><\/span>{{d.usualLabel}}<\/span><\/span><span><\/span>\n      <template data-sc=\"for\" list=\"{{d.evidence}}\" as=\"e\" hint-placeholder-count=\"3\">\n        <span style=\"color: #3C4043\">{{e.label}}<\/span>\n        <div style=\"display: flex; flex-direction: column; gap: 4px\">\n          <div class=\"track\"><div style=\"width: {{e.nowW}}; height: 100%; background: #D93025\"><\/div><\/div>\n          <div class=\"track\"><div style=\"width: {{e.usualW}}; height: 100%; background: #9AA0A6\"><\/div><\/div>\n        <\/div>\n        <span class=\"num\" style=\"text-align: right; font-weight: 500\">{{e.ratio}}<\/span>\n        <span><\/span>\n        <span class=\"cap num\" style=\"margin-bottom: 8px\">{{e.now}} vs {{e.usual}}<\/span>\n        <span><\/span>\n      <\/template>\n    <\/div>\n    <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px\">\n      <template data-sc=\"for\" list=\"{{d.facts}}\" as=\"f\" hint-placeholder-count=\"2\">\n        <div style=\"padding: 14px 16px; border: 1px solid #E8EAED; border-radius: 8px\">\n          <div class=\"lbl\">{{f.label}}<\/div>\n          <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-top: 4px\"><span style=\"{{f.style}}\">{{f.what}}<\/span><span class=\"num\" style=\"font-size: 18px\">{{f.n}}<\/span><\/div>\n        <\/div>\n      <\/template>\n    <\/div>\n  <\/section>\n\n  <section class=\"blk\" aria-labelledby=\"pd-who\">\n    <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 8px\"><h2 id=\"pd-who\" class=\"sec\">More breakdowns<\/h2><span class=\"tag\">Calculated<\/span><template data-sc=\"if\" value=\"{{d.breakMock}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"mock\">Mock data<\/span><\/template><\/div>\n    <p class=\"cap\" style=\"margin: 0\">{{d.breakNote}} By user group is on the Journeys page; these are the extra cuts.<\/p>\n    <template data-sc=\"for\" list=\"{{d.breakdowns}}\" as=\"b\" hint-placeholder-count=\"3\">\n      <div style=\"display: flex; flex-direction: column; gap: 8px; padding-top: 4px\">\n        <h3 class=\"lbl\" style=\"margin: 0\">{{b.title}}<\/h3>\n        <template data-sc=\"for\" list=\"{{b.rows}}\" as=\"r\" hint-placeholder-count=\"3\">\n          <div style=\"display: grid; grid-template-columns: 150px 1fr 44px 84px; gap: 12px; align-items: center\">\n            <span style=\"{{r.labelStyle}}\">{{r.label}}<\/span>\n            <div class=\"track\"><div style=\"width: {{r.w}}; height: 100%; background: {{r.color}}\"><\/div><\/div>\n            <span class=\"num\" style=\"text-align: right; {{r.labelStyle}}\">{{r.pct}}<\/span>\n            <span class=\"num cap\" style=\"text-align: right\">{{r.n}}<\/span>\n          <\/div>\n        <\/template>\n      <\/div>\n    <\/template>\n  <\/section>\n\n  <section class=\"blk\" aria-labelledby=\"pd-trust\">\n    <h2 id=\"pd-trust\" class=\"sec\">Can we trust this?<\/h2>\n    <div style=\"display: flex; gap: 12px; align-items: flex-start\">\n      <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1E8E3E\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"margin-top: 2px\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\/circle><path d=\"M8 12.5l2.8 2.8L16.5 9.5\"><\/path><\/svg>\n      <p style=\"margin: 0; color: #3C4043\">{{d.trustOk}}<\/p>\n    <\/div>\n    <div style=\"display: flex; gap: 12px; align-items: flex-start\">\n      <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#5F6368\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\" style=\"margin-top: 2px\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\/circle><path d=\"M8 12h8\"><\/path><\/svg>\n      <p style=\"margin: 0; color: #3C4043\">{{d.trustNote}}<\/p>\n    <\/div>\n  <\/section>\n\n  <section class=\"blk\" aria-labelledby=\"pd-raw\">\n    <h2 id=\"pd-raw\" class=\"sec\">Raw evidence<\/h2>\n    <p class=\"cap\" style=\"margin: 0\">A sample of the events behind this finding, attached to the drafted ticket.<\/p>\n    <pre style=\"margin: 0; padding: 12px 14px; border-radius: 8px; background: #F8F9FA; font-family: 'Roboto Mono', ui-monospace, monospace; font-size: 12px; line-height: 18px; color: #3C4043; white-space: pre-wrap\">{{d.raw}}<\/pre>\n    <span class=\"cap\">Sample shown with mock values; inputs are masked.<\/span>\n  <\/section>\n\n  <div style=\"margin-top: auto; padding: 16px 28px; border-top: 1px solid #E8EAED; display: flex; flex-wrap: wrap; gap: 8px; align-items: center\">\n    <span class=\"cap\">Spotted {{d.spotted}} · Money is an estimate<\/span>\n    <button type=\"button\" class=\"btn btn-text\" style=\"margin-left: auto\">Snooze a week<\/button>\n    <button type=\"button\" class=\"btn btn-text\">Mark fixed<\/button>\n  <\/div>\n<\/aside>", "js": "class Component extends DCLogic {\n  renderVals() {\n    const pid = this.props.pid ?? 'P1';\n    const conf = (n) => [1, 2, 3].map((i) => (i <= n ? '#1A73E8' : '#DADCE0'));\n    const ev = (label, now, usual, max, ratio) => ({ label, now: now + '%', usual: usual + '%', nowW: Math.min(100, now / max * 100) + '%', usualW: Math.min(100, usual / max * 100) + '%', ratio });\n    const mk = (title, rows, max) => {\n      const top = Math.max(...rows.map((r) => r[1]));\n      return { title, rows: rows.map(([label, v, n]) => ({\n        label, pct: (v >= 10 ? Math.round(v) : v.toFixed(1)) + '%', n: n.toLocaleString('en-US') + ' sess.',\n        w: Math.min(100, v / max * 100).toFixed(1) + '%', color: v === top ? '#D93025' : '#BDC1C6',\n        labelStyle: v === top ? 'font-weight: 500; color: #202124' : 'color: #3C4043'\n      })) };\n    };\n    const mono = \"font-family: 'Roboto Mono', ui-monospace, monospace; font-size: 13px\";\n    const D = {\n      P1: {\n        rank: 1, chip: 'Critical · Bug', chipBg: '#FCE8E6', chipFg: '#C5221F', dot: '#D93025',\n        action: 'Fix', item: 'Send money checkout', who: 'individual traders',\n        sub: '61% of their sessions end at Checkout and PIN, vs 9% for everyone else',\n        value: '₱3,780', unit: ' /wk', sessions: '157', confN: 3, conf: 'High', owner: 'Unassigned', watchHref: 'SessionPlayer.dc.html',\n        reason: 'A failing payment call, not confusion. Individual traders hit payment_timeout and then tap Pay again and again before they give up.',\n        ruledOut: ['Not confusing wording: people tap Pay and hit errors rather than pausing.', 'Not a tracking fault: tracking on this screen was healthy all period.'],\n        caveat: 'Caveat: events alone can\\'t say whether the app, the network or the payment provider is at fault.',\n        next: [{ a: 'Investigate', b: 'payment_timeout', c: 'for individual traders', d: '' }, { a: 'Fix', b: 'Pay button', c: 'response for individual traders', d: '' }, { a: 'Monitor', b: 'Checkout and PIN', c: 'for individual traders', d: '· after the fix' }],\n        nowLabel: 'Individual traders', usualLabel: 'Everyone else',\n        evidence: [ev('Leave here', 61, 8.9, 70, '6.8×'), ev('Repeated taps', 26, 0.5, 70, '51×'), ev('Errors', 17, 2.8, 70, '5.9×')],\n        facts: [{ label: 'Error shown', what: 'payment_timeout', style: mono, n: '26' }, { label: 'Most repeated tap', what: 'Pay button', style: '', n: '168' }],\n        breakMock: false, breakNote: 'Share of sessions that leave at Checkout and PIN.',\n        breakdowns: [\n          mk('Product', [['Send money', 23, 518], ['Game voucher', 14, 539], ['Electricity bills', 12, 563], ['Cable TV and internet', 8.6, 560], ['Post-paid telecom', 7.8, 555], ['E-load', 7.3, 1976]], 25),\n          mk('Device', [['Android, low-end', 12, 1579], ['Android, mid/high', 9.7, 1078], ['iOS', 9.7, 2577]], 25),\n          mk('App version', [['4.11.1', 12, 1085], ['4.11.2', 10, 3206], ['4.12', 9.1, 943]], 25)\n        ],\n        trustOk: 'Tracking was healthy on this screen during the period. 73 of 95 exits carry an error or repeated taps, so these are real people failing.',\n        trustNote: 'Ruled out: double-fired checkout events on Android (Sep 22–26, app 4.11.1). Fixed before this period.',\n        raw: '{ \"event\": \"txn_checkout\", \"product\": \"send_money\",\\n  \"persona\": \"individual_trader\", \"error\": \"payment_timeout\",\\n  \"taps_on\": \"pay\", \"taps_2s\": 4, \"next\": \"session_end\" }',\n        spotted: '30 days ago'\n      },\n      P2: {\n        rank: 2, chip: 'Critical · Bug', chipBg: '#FCE8E6', chipFg: '#C5221F', dot: '#D93025',\n        action: 'Investigate', item: 'OTP code', who: 'all users',\n        sub: 'Exits jumped from 5% to 68% on Oct 9, 02:00–10:00 UTC · worst for individual traders',\n        value: '₱2,940', unit: ' /wk', sessions: '134', confN: 2, conf: 'Medium', owner: 'Engineering', watchHref: 'SessionPlayerOTP.dc.html',\n        reason: 'Codes most likely never arrived. 89 of 91 people who left hit an error or a tap that did nothing, and Resend code was tapped 457 times.',\n        ruledOut: ['Not confusing wording: people tap repeatedly instead of pausing.', 'Not a tracking fault: OTP events were read normally on Oct 9.'],\n        caveat: 'Caveat: events can\\'t tell whether the SMS provider, the network or the app failed to deliver the code.',\n        next: [{ a: 'Investigate', b: 'SMS delivery', c: 'for Oct 9, 02:00–10:00 UTC', d: '· with the provider' }, { a: 'Fix', b: 'Resend code', c: 'feedback for all users', d: '· show when a code is on its way' }, { a: 'Monitor', b: 'OTP code', c: 'for all users', d: '· alert if exits pass 15%' }],\n        nowLabel: 'OTP code', usualLabel: 'Baseline',\n        evidence: [ev('Leave here, Oct 9 vs other days', 68, 5, 70, '13.6×'), ev('Repeated taps vs other steps', 5.6, 0.7, 10, '8×'), ev('Going back vs other steps', 3.5, 1.3, 10, '2.7×')],\n        facts: [{ label: 'Most repeated tap', what: 'Resend code', style: '', n: '457' }, { label: 'Loops back', what: 'to Phone number', style: '', n: '62' }],\n        breakMock: true, breakNote: 'Share of sessions that leave at OTP code during the spike.',\n        breakdowns: [\n          mk('Mobile network', [['Network A', 74, 61], ['Network B', 66, 48], ['Network C', 58, 25]], 100),\n          mk('Device', [['Android, low-end', 71, 52], ['Android, mid/high', 69, 38], ['iOS', 64, 44]], 100),\n          mk('App version', [['4.12', 70, 41], ['4.11.2', 67, 71], ['4.11.1', 66, 22]], 100)\n        ],\n        trustOk: 'OTP events were read normally on Oct 9. Exits carry real errors and repeated taps, so people really were stuck.',\n        trustNote: 'Not related: Oct 11 is missing 3.2% of its rows, outside the spike window.',\n        raw: '{ \"event\": \"otp\", \"screen\": \"verify_phone\",\\n  \"taps_on\": \"resend_code\", \"taps_2s\": 5,\\n  \"error\": null, \"dwell_s\": 54, \"next\": \"session_end\" }',\n        spotted: '6 days ago'\n      },\n      P3: {\n        rank: 3, chip: 'Warning · Wording', chipBg: '#FEF7E0', chipFg: '#B06000', dot: '#1A73E8',\n        action: 'Rewrite', item: 'Personal data labels', who: 'all users',\n        sub: '18.5% leave here every week · worst for individual traders (31.8%)',\n        value: 'No ₱ estimate', unit: '', valueStyle: 'font-size: 15px; color: #5F6368', sessions: '2,509', confN: 3, conf: 'High', owner: 'Design', watchHref: 'SessionPlayerForm.dc.html',\n        reason: 'People are unsure what to enter. They pause for a long time and leave with few errors: 16.9% are stuck over 30 seconds, the highest of any step.',\n        ruledOut: ['Not a bug: errors and taps that did nothing stay low (1.5%).', 'Not a natural exit: people pause on fields before leaving, rather than leaving straight away.'],\n        caveat: 'Caveat: which field causes the pause isn\\'t tracked yet; per-field timing would confirm it.',\n        next: [{ a: 'Rewrite', b: 'field labels and hints', c: 'for all users', d: '' }, { a: 'Test', b: 'the new labels', c: 'with individual traders', d: '· the most affected group' }, { a: 'Monitor', b: 'stuck time', c: 'at Personal data', d: '· after the change' }],\n        nowLabel: 'Personal data', usualLabel: 'Other sign-up steps',\n        evidence: [ev('Stuck over 30s', 16.9, 4.7, 20, '3.6×'), ev('Leave here', 18.5, 5.7, 20, '3.2×'), ev('Taps that did nothing', 1.5, 1.3, 20, '1.2×')],\n        facts: [{ label: 'Worst user group', what: 'Individual traders', style: '', n: '31.8%' }, { label: 'Dead taps, individual traders', what: 'vs 1.5% overall', style: '', n: '9.1%' }],\n        breakMock: true, breakNote: 'Share of sessions that leave at Personal data.',\n        breakdowns: [\n          mk('Device', [['Android, low-end', 22, 240], ['Android, mid/high', 17, 180], ['iOS', 15, 241]], 30),\n          mk('App version', [['4.11.1', 20, 150], ['4.11.2', 18, 380], ['4.12', 17, 131]], 30),\n          mk('Time of day', [['Evening', 21, 260], ['Afternoon', 18, 230], ['Morning', 15, 171]], 30)\n        ],\n        trustOk: 'Tracking on Personal data was healthy all period, and the pattern is steady week to week.',\n        trustNote: 'Per-field timing isn\\'t tracked yet, so the drawer can\\'t point to one field.',\n        raw: '{ \"event\": \"personal_data\", \"persona\": \"individual_trader\",\\n  \"dwell_s\": 71, \"focus_changes\": 9,\\n  \"error\": null, \"next\": \"session_end\" }',\n        spotted: 'today'\n      }\n    };\n    const x = D[pid];\n    const [c1, c2, c3] = conf(x.confN);\n    const hasClose = typeof this.props.onClose === 'function';\n    const hasWatch = typeof this.props.onWatch === 'function';\n    const playerKey = { 'SessionPlayer.dc.html': 'checkout', 'SessionPlayerOTP.dc.html': 'otp', 'SessionPlayerForm.dc.html': 'form' }[x.watchHref];\n    return {\n      d: { ...x, pid, c1, c2, c3, valueStyle: x.valueStyle || '' },\n      closeLink: !hasClose, closeCb: hasClose, close: () => this.props.onClose(),\n      watchLink: !hasWatch, watchCb: hasWatch, watch: () => this.props.onWatch(playerKey)\n    };\n  }\n}"}, "ProblemDetailP2": {"html": "<dc-import name=\"ProblemDetail\" pid=\"P2\" hint-size=\"560px,1900px\"><\/dc-import>", "js": "class Component extends DCLogic {\n  renderVals() {\n    return {};\n  }\n}"}, "ProblemDetailP3": {"html": "<dc-import name=\"ProblemDetail\" pid=\"P3\" hint-size=\"560px,1900px\"><\/dc-import>", "js": "class Component extends DCLogic {\n  renderVals() {\n    return {};\n  }\n}"}, "ScopeBar": {"html": "<div role=\"group\" aria-label=\"Scope of this view\" style=\"box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-height: 40px; font-family: 'Google Sans Flex', 'Google Sans', Roboto, system-ui, sans-serif; font-size: 14px; line-height: 20px; color: #3C4043\">\n  <button type=\"button\" aria-haspopup=\"menu\" style=\"display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px 0 14px; border-radius: 8px; border: 1px solid #DADCE0; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 500; color: #3C4043; cursor: pointer\">\n    <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#5F6368\" stroke-width=\"1.75\" aria-hidden=\"true\"><rect x=\"4\" y=\"5\" width=\"16\" height=\"15\" rx=\"2\"><\/rect><pa height: 18px; accent-color: #1A73E8; margin: 0\">\n            <span style=\"width: 8px; height: 8px; border-radius: 4px; background: {{g.color}}\"><\/span>\n            <span style=\"flex: 1; color: #202124\">{{g.label}}<\/span>\n            <span style=\"color: #5F6368; font-variant-numeric: tabular-nums\">{{g.users}}<\/span>\n          <\/label>\n        <\/template>\n        <div style=\"height: 1px; background: #E8EAED; margin: 8px 0\"><\/div>\n        <div style=\"display: flex; justify-content: flex-end; gap: 8px; padding: 4px 12px 4px\">\n          <button type=\"button\" onClick=\"{{toggle}}\" style=\"height: 36px; padding: 0 12px; border: 0; border-radius: 18px; background: transparent; color: #1A73E8; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer\">Cancel<\/button>\n          <button type=\"button\" onClick=\"{{toggle}}\" style=\"height: 36px; padding: 0 20px; border: 0; border-radius: 18px; background: #1A73E8; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer\">Apply<\/button>\n        <\/div>\n      <\/div>\n    <\/template>\n  <\/div>\n\n  <button type=\"button\" aria-haspopup=\"menu\" style=\"display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px 0 14px; border-radius: 8px; border: 1px solid #DADCE0; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 500; color: #3C4043; cursor: pointer\">\n    <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#5F6368\" stroke-width=\"1.75\" aria-hidden=\"true\"><rect x=\"7\" y=\"3\" width=\"10\" height=\"18\" rx=\"2\"><\/rect><path d=\"M11 18h2\"><\/path><\/svg>\n    App\n    <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#5F6368\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M7 10l5 5 5-5\"><\/path><\/svg>\n  <\/button>\n\n  <button type=\"button\" aria-pressed=\"true\" style=\"display: inline-flex; align-items: cen
