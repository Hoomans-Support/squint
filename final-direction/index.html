 {{r.outFg}}\">{{r.outcome}}<\/span>\n        <\/button>\n      <\/template>\n      <button type=\"button\" style=\"margin-top: 4px; height: 36px; border: 0; background: transparent; color: #1A73E8; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer\">Show 10 more<\/button>\n    <\/aside>\n\n    <main style=\"flex: 999 1 560px; min-width: 0; padding: 24px 32px 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px\">\n      <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px\">\n        <span style=\"font-size: 18px; line-height: 24px; font-weight: 500\">{{s.group}} · {{s.device}}<\/span>\n        <span class=\"chip\" style=\"background: {{s.outBg}}; color: {{s.outFg}}\">{{s.outcome}}<\/span>\n        <span class=\"cap\">Session {{s.n}} of 15 · {{s.durTxt}} · {{s.when}}<\/span>\n      <\/div>\n\n      <div style=\"display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start\">\n        <figure style=\"margin: 0; display: flex; flex-direction: column; align-items: center; gap: 10px\">\n          <template data-sc=\"if\" value=\"{{isOtp}}\" hint-placeholder-val=\"{{ false }}\">\n            <div class=\"phone\" role=\"img\" aria-label=\"OTP code screen at the current moment, with the latest tap marked on Resend code.\">\n              <div style=\"font-size: 13px; font-weight: 500\">‹ Verify your phone<\/div>\n              <div class=\"bar\" style=\"height: 8px; width: 88%\"><\/div>\n              <div style=\"display: flex; gap: 6px; margin-top: 8px\"><span class=\"field\" style=\"flex: 1; height: 36px\"><\/span><span class=\"field\" style=\"flex: 1; height: 36px\"><\/span><span class=\"field\" style=\"flex: 1; height: 36px\"><\/span><span class=\"field\" style=\"flex: 1; height: 36px\"><\/span><span class=\"field\" style=\"flex: 1; height: 36px\"><\/span><\/div>\n              <div style=\"flex: 1\"><\/div>\n              <div style=\"align-self: center; padding: 8px 14px; border-radius: 8px; background: #F1F3F4; font-size: 11px; color: #3C4043\">Resend code / receive via SMS<\/div>\n              <div style=\"height: 22px\"><\/div>\n              <div style=\"height: 40px; border-radius: 8px; background: #202124; color: #FFFFFF; font-size: 13px; font-weight: 500; display: flex; align-items: center; justify-content: center\">Verify<\/div>\n              <span style=\"position: absolute; left: 100px; top: 290px; width: 40px; height: 40px; border-radius: 20px; border: 3px solid #D93025; box-sizing: border-box; background: rgba(217,48,37,.15)\"><\/span>\n              <span style=\"position: absolute; left: 132px; top: 280px; height: 20px; padding: 0 6px; border-radius: 10px; background: #D93025; color: #FFFFFF; font-size: 11px; font-weight: 500; display: flex; align-items: center\">×4<\/span>\n            <\/div>\n          <\/template>\n          <template data-sc=\"if\" value=\"{{isCheckout}}\" hint-placeholder-val=\"{{ true }}\">\n            <div class=\"phone\" role=\"img\" aria-label=\"Checkout and PIN screen at the current moment, with a payment_timeout error and the latest tap marked on Pay.\">\n              <div style=\"font-size: 13px; font-weight: 500\">‹ Checkout<\/div>\n              <div class=\"bar\" style=\"height: 8px; width: 70%\"><\/div>\n              <div class=\"bar\" style=\"height: 8px; width: 50%\"><\/div>\n              <div style=\"display: flex; justify-content: center; gap: 10px; margin-top: 12px\"><span style=\"width: 12px; height: 12px; border-radius: 6px; background: #202124\"><\/span><span style=\"width: 12px; height: 12px; border-radius: 6px; background: #202124\"><\/span><span style=\"width: 12px; height: 12px; border-radius: 6px; background: #202124\"><\/span><span style=\"width: 12px; height: 12px; border-radius: 6px; background: #202124\"><\/span><\/div>\n              <div style=\"margin-top: 12px; padding: 8px 10px; border-radius: 8px; background: #FCE8E6; color: #C5221F; font-size: 11px; font-family: 'Roboto Mono', ui-monospace, monospace\">payment_timeout<\/div>\n              <div style=\"flex: 1\"><\/div>\n              <div style=\"height: 44px; border-radius: 8px; background: #1A73E8; color: #FFFFFF; font-size: 14px; font-weight: 500; display: flex; align-items: center; justify-content: center\">Pay<\/div>\n              <span style=\"position: absolute; left: 100px; top: 372px; width: 40px; height: 40px; border-radius: 20px; border: 3px solid #D93025; box-sizing: border-box; background: rgba(217,48,37,.15)\"><\/span>\n              <span style=\"position: absolute; left: 132px; top: 362px; height: 20px; padding: 0 6px; border-radius: 10px; background: #D93025; color: #FFFFFF; font-size: 11px; font-weight: 500; display: flex; align-items: center\">×4<\/span>\n            <\/div>\n          <\/template>\n          <template data-sc=\"if\" value=\"{{isForm}}\" hint-placeholder-val=\"{{ false }}\">\n            <div class=\"phone\" role=\"img\" aria-label=\"Personal data screen at the current moment, with the cursor paused on the third field.\">\n              <div style=\"font-size: 13px; font-weight: 500\">‹ Personal data<\/div>\n              <div style=\"display: flex; flex-direction: column; gap: 5px\"><span class=\"bar\" style=\"height: 6px; width: 38%; background: #E8EAED\"><\/span><span class=\"field\" style=\"height: 30px\"><\/span><\/div>\n              <div style=\"display: flex; flex-direction: column; gap: 5px\"><span class=\"bar\" style=\"height: 6px; width: 46%; background: #E8EAED\"><\/span><span class=\"field\" style=\"height: 30px\"><\/span><\/div>\n              <div style=\"display: flex; flex-direction: column; gap: 5px\"><span class=\"bar\" style=\"height: 6px; width: 30%; background: #E8EAED\"><\/span><span class=\"field\" style=\"height: 30px; border: 2px solid #1A73E8\"><\/span><\/div>\n              <div style=\"display: flex; flex-direction: column; gap: 5px\"><span class=\"bar\" style=\"height: 6px; width: 52%; background: #E8EAED\"><\/span><span class=\"field\" style=\"height: 30px\"><\/span><\/div>\n              <div style=\"flex: 1\"><\/div>\n              <div style=\"height: 40px; border-radius: 8px; background: #202124; color: #FFFFFF; font-size: 13px; font-weight: 500; display: flex; align-items: center; justify-content: center\">Continue<\/div>\n              <span style=\"position: absolute; right: 18px; top: 190px; display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 10px; border-radius: 12px; background: #1A73E8; color: #FFFFFF; font-size: 11px; font-weight: 500\">Paused 48s<\/span>\n            <\/div>\n          <\/template>\n          <figcaption class=\"cap num\">At {{s.atTxt}} · {{s.atStep}}<\/figcaption>\n        <\/figure>\n\n        <div style=\"flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 14px\">\n          <div style=\"display: flex; flex-direction: column; gap: 6px\">\n            <div role=\"img\" aria-label=\"Session timeline with events. The playhead is at {{s.atTxt}}.\" style=\"position: relative; height: 48px; border-radius: 8px; background: #FFFFFF; border: 1px solid #E8EAED\">\n              <template data-sc=\"for\" list=\"{{s.segments}}\" as=\"g\" hint-placeholder-count=\"3\"><span style=\"position: absolute; left: {{g.left}}; width: {{g.width}}; top: 10px; height: 26px; background: {{g.bg}}\"><\/span><\/template>\n              <template data-sc=\"for\" list=\"{{s.marks}}\" as=\"m\" hint-placeholder-count=\"6\"><span style=\"position: absolute; left: {{m.left}}; top: {{m.top}}; width: {{m.w}}; height: {{m.h}}; border-radius: {{m.r}}; background: {{m.c}}\"><\/span><\/template>\n              <span style=\"position: absolute; left: {{s.playLeft}}; top: -4px; bottom: -4px; width: 2px; background: #1A73E8\"><\/span>\n              <span style=\"position: absolute; left: {{s.playLeft}}; top: -8px; width: 12px; height: 12px; margin-left: -5px; border-radius: 6px; background: #1A73E8\"><\/span>\n            <\/div>\n            <div class=\"cap num\" style=\"display: flex; justify-content: space-between\"><span>0:00<\/span><span>{{s.durTxt}}<\/span><\/div>\n            <div style=\"display: flex; flex-wrap: wrap; gap: 12px\" class=\"cap\">\n              <span style=\"display: inline-flex; align-items: center; gap: 6px\"><span style=\"width: 3px; height: 12px; background: #D93025; border-radius: 1px\"><\/span>Repeated taps<\/span>\n              <span style=\"display: inline-flex; align-items: center; gap: 6px\"><span style=\"width: 10px; height: 10px; background: #F9AB00; border-radius: 2px\"><\/span>Error<\/span>\n              <span style=\"display: inline-flex; align-items: center; gap: 6px\"><span class=\"dot\" style=\"background: #1A73E8\"><\/span>Went back<\/span>\n              <span style=\"display: inline-flex; align-items: center; gap: 6px\"><span style=\"width: 14px; height: 6px; background: #E8EAED\"><\/span>Idle<\/span>\n              <span style=\"display: inline-flex; align-items: center; gap: 6px\"><span style=\"width: 10px; height: 10px; background: #202124; border-radius: 2px\"><\/span>Left<\/span>\n            <\/div>\n          <\/div>\n\n          <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 8px\">\n            <button type=\"button\" class=\"ctl\" aria-label=\"{{playLabel}}\" onClick=\"{{togglePlay}}\" style=\"background: #1A73E8; color: #FFFFFF\">\n              <template data-sc=\"if\" value=\"{{playing}}\" hint-placeholder-val=\"{{ false }}\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"currentColor\" aria-hidden=\"true\"><rect x=\"6\" y=\"5\" width=\"4\" height=\"14\" rx=\"1\"><\/rect><rect x=\"14\" y=\"5\" width=\"4\" height=\"14\" rx=\"1\"><\/rect><\/svg><\/template>\n              <template data-sc=\"if\" value=\"{{paused}}\" hint-placeholder-val=\"{{ true }}\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"currentColor\" aria-hidden=\"true\"><path d=\"M8 5.5v13l10.5-6.5z\"><\/path><\/svg><\/template>\n            <\/button>\n            <button type=\"button\" class=\"btn btn-tonal\" onClick=\"{{skip}}\" style=\"height: 40px\">Skip to the struggle · {{s.struggleTxt}}<\/button>\n            <label class=\"cap\" style=\"display: inline-flex; align-items: center; gap: 6px\">Speed\n              <select style=\"height: 36px; border: 1px solid #DADCE0; border-radius: 8px; background: #FFFFFF; font-family: inherit; font-size: 14px; padding: 0 8px\"><option>1×<\/option><option>2×<\/option><option>4×<\/option><\/select>\n            <\/label>\n          <\/div>\n\n          <ol style=\"margin: 0; padding: 0; list-style: none; border: 1px solid #E8EAED; border-radius: 12px; background: #FFFFFF; overflow: hidden\" aria-label=\"Events in this session\">\n            <template data-sc=\"for\" list=\"{{s.log}}\" as=\"e\" hint-placeholder-count=\"8\">\n              <li style=\"display: grid; grid-template-columns: 52px 14px 1fr; gap: 10px; align-items: center; min-height: 36px; padding: 4px 14px; border-top: 1px solid #F1F3F4; {{e.rowStyle}}\">\n                <span class=\"num cap\">{{e.t}}<\/span>\n                <span style=\"width: 10px; height: 10px; border-radius: {{e.r}}; background: {{e.c}}\"><\/span>\n                <span style=\"{{e.textStyle}}\">{{e.text}}<\/span>\n              <\/li>\n            <\/template>\n          <\/ol>\n\n          <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 8px\">\n            <button type=\"button\" class=\"btn btn-tonal\">Add to {{x.pid}} evidence<\/button>\n            <button type=\"button\" class=\"btn btn-outlined\" onClick=\"{{next}}\">Next session →<\/button>\n            <span class=\"cap\" style=\"margin-left: auto\">Sampled at random from the people behind {{x.pid}}<\/span>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/main>\n  <\/div>\n<\/div>", "js": "class Component extends DCLogic {\n  renderVals() {\n    const issue = this.props.issue ?? 'checkout';\n    const sel = this.state.sel ?? 0;\n    const playing = !!this.state.playing;\n    const fmt = (t) => Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');\n    const G = { 'Individual trader': '#D93025', Retail: '#F9AB00', 'Large business': '#1A73E8', Individual: '#1E8E3E', Unregistered: '#9AA0A6' };\n    const OUT = { Left: ['#FCE8E6', '#C5221F'], Finished: ['#E6F4EA', '#137333'], 'Came back later': ['#E8F0FE', '#174EA6'] };\n    // event types: step, burst, error, back, idle (with end), left, done\n    const SETS = {\n      checkout: {\n        meta: { pid: 'P1', action: 'Fix', item: 'Send money checkout', who: 'individual traders', sampleNote: '15 sessions that failed at Checkout and PIN' },\n        sessions: [\n          ['Individual trader', 'Android, low-end', 106, 'Left', 'Oct 12, 19:40', [[0, 'step', 'Choose product: Send money'], [12, 'step', 'Details filled'], [31, 'step', 'Checkout and PIN'], [46, 'tap', 'Tapped Pay'], [58, 'error', 'Error: payment_timeout'], [61, 'burst', 'Tapped Pay 4 times in 2s'], [75, 'error', 'Error: payment_timeout'], [78, 'burst', 'Tapped Pay 3 times in 2s'], [80, 'idle', 'No activity', 104], [106, 'left', 'Left the app']]],\n          ['Individual trader', 'iOS', 130, 'Came back later', 'Oct 11, 08:15', [[0, 'step', 'Choose product: Send money'], [20, 'step', 'Checkout and PIN'], [34, 'error', 'Error: payment_timeout'], [37, 'burst', 'Tapped Pay 5 times in 2s'], [52, 'back', 'Went back to Details'], [70, 'step', 'Checkout and PIN again'], [84, 'error', 'Error: payment_timeout'], [90, 'idle', 'No activity', 128], [130, 'left', 'Left; returned 2 hours later']]],\n          ['Individual trader', 'Android, mid/high', 80, 'Left', 'Oct 10, 12:02', [[0, 'step', 'Choose product: Send money'], [18, 'step', 'Checkout and PIN'], [29, 'error', 'Error: payment_timeout'], [31, 'burst', 'Tapped Pay 4 times in 2s'], [45, 'idle', 'No activity', 78], [80, 'left', 'Left the app']]],\n          ['Individual trader', 'Android, low-end', 95, 'Finished', 'Oct 9, 17:30', [[0, 'step', 'Choose product: Send money'], [22, 'step', 'Checkout and PIN'], [35, 'error', 'Error: payment_timeout'], [38, 'burst', 'Tapped Pay 3 times in 2s'], [60, 'tap', 'Tapped Pay again'], [95, 'done', 'Transaction done']]],\n          ['Individual trader', 'iOS', 62, 'Left', 'Oct 8, 21:05', [[0, 'step', 'Choose product: Send money'], [15, 'step', 'Checkout and PIN'], [27, 'error', 'Error: payment_timeout'], [30, 'burst', 'Tapped Pay 6 times in 2s'], [62, 'left', 'Left the app']]]\n        ]\n      },\n      form: {\n        meta: { pid: 'P3', action: 'Rewrite', item: 'Personal data labels', who: 'all users', sampleNote: '15 sessions that left at Personal data' },\n        sessions: [\n          ['Individual trader', 'Android, low-end', 118, 'Left', 'Oct 13, 20:10', [[0, 'step', 'OTP code verified'], [6, 'step', 'Personal data'], [14, 'tap', 'Filled the first field'], [22, 'idle', 'Paused on a field for 48s', 70], [72, 'tap', 'Cleared and retyped a field'], [80, 'idle', 'Paused again', 116], [118, 'left', 'Left the app']]],\n          ['Retail', 'iOS', 96, 'Left', 'Oct 12, 11:30', [[0, 'step', 'Personal data'], [10, 'tap', 'Filled two fields'], [20, 'idle', 'Paused on a field for 40s', 60], [62, 'back', 'Went back to OTP code'], [70, 'step', 'Personal data again'], [74, 'idle', 'No activity', 94], [96, 'left', 'Left the app']]],\n          ['Unregistered', 'Android', 150, 'Finished', 'Oct 11, 16:45', [[0, 'step', 'Personal data'], [12, 'tap', 'Filled the first field'], [20, 'idle', 'Paused for 55s', 75], [80, 'tap', 'Filled the rest'], [150, 'done', 'Moved on to TIN number']]],\n          ['Individual trader', 'Android, mid/high', 88, 'Came back later', 'Oct 10, 09:05', [[0, 'step', 'Personal data'], [8, 'idle', 'Paused for 60s', 68], [70, 'tap', 'Opened the help tooltip'], [88, 'left', 'Left; returned the next day']]],\n          ['Large business', 'iOS', 74, 'Left', 'Oct 9, 14:20', [[0, 'step', 'Personal data'], [15, 'tap', 'Filled two fields'], [25, 'idle', 'Paused for 45s', 70], [74, 'left', 'Left the app']]]\n        ]\n      },\n      otp: {\n        meta: { pid: 'P2', action: 'Investigate', item: 'OTP code', who: 'all users', sampleNote: '15 sessions that left at OTP code' },\n        sessions: [\n          ['Retail', 'Android', 82, 'Left', 'Oct 9, 03:12', [[0, 'step', 'Phone number'], [28, 'step', 'OTP code shown'], [29, 'back', 'Went back to Phone number'], [31, 'step', 'OTP code again'], [33, 'burst', 'Tapped Resend code 3 times'], [41, 'burst', 'Tapped Resend code 4 times'], [47, 'burst', 'Tapped Verify twice, no code entered'], [52, 'burst', 'Tapped Resend code 4 times'], [62, 'idle', 'No activity', 80], [82, 'left', 'Left the app']]],\n          ['Individual trader', 'Android, low-end', 96, 'Left', 'Oct 9, 05:40', [[0, 'step', 'Phone number'], [22, 'step', 'OTP code shown'], [30, 'burst', 'Tapped Resend code 5 times'], [44, 'back', 'Went back to Phone number'], [50, 'step', 'OTP code again'], [58, 'burst', 'Tapped Resend code 3 times'], [66, 'idle', 'No activity', 94], [96, 'left', 'Left the app']]],\n          ['Large business', 'iOS', 140, 'Came back later', 'Oct 9, 07:55', [[0, 'step', 'Phone number'], [25, 'step', 'OTP code shown'], [40, 'burst', 'Tapped Resend code 4 times'], [60, 'idle', 'No activity', 138], [140, 'left', 'Left; returned the next day']]],\n          ['Unregistered', 'Android', 70, 'Left', 'Oct 9, 02:20', [[0, 'step', 'Phone number'], [20, 'step', 'OTP code shown'], [26, 'burst', 'Tapped Resend code 3 times'], [35, 'burst', 'Tapped Verify 3 times'], [70, 'left', 'Left the app']]],\n          ['Individual', 'iOS', 110, 'Finished', 'Oct 9, 09:58', [[0, 'step', 'Phone number'], [24, 'step', 'OTP code shown'], [38, 'burst', 'Tapped Resend code 3 times'], [92, 'tap', 'Code arrived; entered it'], [110, 'done', 'Signed in']]]\n        ]\n      }\n    };\n    const set = SETS[issue];\n    const ST = {\n      burst: { c: '#D93025', r: '1px' }, error: { c: '#F9AB00', r: '2px' }, back: { c: '#1A73E8', r: '5px' },\n      idle: { c: '#BDC1C6', r: '2px' }, left: { c: '#202124', r: '2px' }, done: { c: '#1E8E3E', r: '5px' },\n      step: { c: '#DADCE0', r: '5px' }, tap: { c: '#5F6368', r: '5px' }\n    };\n    const markFor = (ev, dur) => {\n      const [t, type] = ev;\n      const left = (t / dur * 100).toFixed(1) + '%';\n      if (type === 'burst') return { left, top: '12px', w: '3px', h: '22px', r: '1px', c: '#D93025' };\n      if (type === 'error') return { left, top: '17px', w: '10px', h: '10px', r: '2px', c: '#F9AB00' };\n      if (type === 'back') return { left, top: '17px', w: '10px', h: '10px', r: '5px', c: '#1A73E8' };\n      if (type === 'left') return { left: `calc(${left} - 10px)`, top: '15px', w: '12px', h: '12px', r: '2px', c: '#202124' };\n      if (type === 'done') return { left: `calc(${left} - 10px)`, top: '15px', w: '12px', h: '12px', r: '6px', c: '#1E8E3E' };\n      return null;\n    };\n    const rows = set.sessions.map(([group, device, dur, outcome, when, events], i) => ({\n      group, device, durTxt: fmt(dur), outcome, groupDot: G[group],\n      outBg: OUT[outcome][0], outFg: OUT[outcome][1],\n      marks: events.filter((e) => e[1] === 'burst' || e[1] === 'error').map((e) => ({ left: (e[0] / dur * 100).toFixed(1) + '%', c: e[1] === 'burst' ? '#D93025' : '#F9AB00' })),\n      on: sel === i ? 'true' : 'false', style: sel === i ? 'background: #E8F0FE;' : '',\n      pick: () => this.setState({ sel: i, at: undefined, playing: false })\n    }));\n    const [group, device, dur, outcome, when, events] = set.sessions[sel];\n    const firstStruggle = (events.find((e) => e[1] === 'burst' || e[1] === 'error' || e[1] === 'idle') || [0])[0];\n    const at = this.state.at ?? firstStruggle + 3;\n    const curIdx = events.reduce((k, e, i) => (e[0] <= at ? i : k), 0);\n    let stepName = '';\n    events.forEach((e) => { if (e[0] <= at && e[1] === 'step') stepName = e[2].replace(/ shown| again|: .*/g, ''); });\n    const segments = [];\n    events.forEach((e) => { if (e[1] === 'idle') segments.push({ left: (e[0] / dur * 100).toFixed(1) + '%', width: ((e[3] - e[0]) / dur * 100).toFixed(1) + '%', bg: '#E8EAED' }); });\n    const s = {\n      n: sel + 1, group, device, outcome, when, durTxt: fmt(dur), outBg: OUT[outcome][0], outFg: OUT[outcome][1],\n      atTxt: fmt(Math.round(at)), atStep: stepName || 'Start', struggleTxt: fmt(firstStruggle),\n      playLeft: (at / dur * 100).toFixed(1) + '%', segments,\n      marks: events.map((e) => markFor(e, dur)).filter(Boolean),\n      log: events.map((e, i) => ({\n        t: fmt(e[0]), text: e[2], c: ST[e[1]].c, r: ST[e[1]].r,\n        rowStyle: i === curIdx ? 'background: #E8F0FE;' : '',\n        textStyle: i === curIdx ? 'font-weight: 500; color: #174EA6' : (e[1] === 'burst' || e[1] === 'error' ? 'color: #202124' : 'color: #5F6368')\n      }))\n    };\n    return {\n      x: { ...set.meta, shown: set.sessions.length }, rows, s,\n      closeLink: typeof this.props.onClose !== 'function', closeCb: typeof this.props.onClose === 'function', close: () => this.props.onClose(),\n      isOtp: issue === 'otp', isCheckout: issue === 'checkout', isForm: issue === 'form',\n      playing, paused: !playing, playLabel: playing ? 'Pause' : 'Play',\n      togglePlay: () => this.setState({ playing: !playing, at: playing ? at : Math.min(dur, at + 10) }),\n      skip: () => this.setState({ at: firstStruggle }),\n      next: () => this.setState({ sel: (sel + 1) % set.sessions.length, at: undefined, playing: false })\n    };\n  }\n}"}, "SessionPlayerForm": {"html": "<div style=\"min-height: 100vh\">\n  <dc-import name=\"SessionPlayer\" issue=\"form\" hint-size=\"100%,1100px\"><\/dc-import>\n<\/div>", "js": "class Component extends DCLogic {\n  renderVals() {\n    return {};\n  }\n}"}, "SessionPlayerOTP": {"html": "<div style=\"min-height: 100vh\">\n  <dc-import name=\"SessionPlayer\" issue=\"otp\" hint-size=\"100%,1100px\"><\/dc-import>\n<\/div>", "js": "class Component extends DCLogic {\n  renderVals() {\n    return {};\n  }\n}"}, "TopBar": {"html": "<header style=\"box-sizing: border-box; min-height: 64px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding: 8px 16px 8px 20px; background: #FFFFFF; border-bottom: 1px solid #DADCE0; font-family: 'Google Sans Flex', 'Google Sans', Roboto, system-ui, sans-serif; color: #202124\">\n  <a href=\"Main.dc.html\" style=\"display: flex; align-items: center; gap: 10px; text-decoration: none; color: #5F6368; min-width: 208px\">\n    <svg width=\"32\" height=\"32\" viewBox=\"30 30 545 545\" aria-hidden=\"true\"><g fill=\"none\" stroke-width=\"72\" stroke-linecap=\"round\"><path d=\"M165.2 100.8A188 188 0 0 1 358.8 100.8\" stroke=\"#FBBC04\"><\/path><path d=\"M423.2 165.2A188 188 0 0 1 423.2 358.8\" stroke=\"#4285F4\"><\/path><path d=\"M358.8 423.2A188 188 0 0 1 165.2 423.2\" stroke=\"#EA4335\"><\/path><path d=\"M100.8 358.8A188 188 0 0 1 100.8 165.2\" stroke=\"#34A853\"><\/path><path d=\"M432 432L528 528\" stroke=\"#202124\"><\/path><\/g><circle cx=\"262\" cy=\"262\" r=\"34\" fill=\"#4285F4\"><\/circle><\/svg>\n    <span style=\"font-size: 22px; line-height: 28px; font-weight: 700; letter-spacing: -0.2px; color: #202124\">Squint<\/span>\n  <\/a>\n\n  <form style=\"flex: 1 1 360px; max-width: 720px; display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 8px 0 16px; border-radius: 24px; background: #F1F3F4; margin: 0\" role=\"search\">\n    <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1A73E8\" stroke-width=\"1.75\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7-4.7-1.8 4.7-1.8z\"><\/path><path d=\"M18.5 15.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z\"><\/path><\/svg>\n    <label for=\"ask-q\" style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">Ask about your users<\/label>\n    <input id=\"ask-q\" type=\"text\" placeholder=\"Ask about your users, e.g. why do individual traders leave Send money?\" style=\"flex: 1; min-width: 0; height: 40px; border: 0; background: transparent; font-family: inherit; font-size: 16px; color: #202124; outline: none\">\n    <a href=\"Ask.dc.html\" style=\"height: 36px; padding: 0 16px; border-radius: 18px; background: #1A73E8; color: #FFFFFF; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; text-decoration: none\">Ask<\/a>\n  <\/form>\n\n  <div style=\"margin-left: auto; display: flex; align-items: center; gap: 4px\">\n    <a href=\"DataSources.dc.html\" style=\"display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px 0 12px; border-radius: 18px; border: 1px solid #DADCE0; color: #3C4043; font-size: 14px; font-weight: 500; text-decoration: none; margin-right: 8px\">\n      <span style=\"width: 8px; height: 8px; border-radius: 4px; background: #1E8E3E; display: inline-block\"><\/span>\n      Data reliable <span style=\"font-weight: 400; color: #5F6368\">· 1 note<\/span>\n    <\/a>\n    <button type=\"button\" aria-label=\"Help\" style=\"width: 40px; height: 40px; border-radius: 20px; border: 0; background: transparent; color: #5F6368; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; padding: 0\">\n      <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\/circle><path d=\"M9.5 9.5a2.5 2.5 0 1 1 3.6 2.2c-.7.4-1.1 1-1.1 1.8v.5\"><\/path><circle cx=\"12\" cy=\"17\" r=\".6\" fill=\"currentColor\"><\/circle><\/svg>\n    <\/button>\n    <button type=\"button\" aria-label=\"Settings: currency, theme, alerts\" style=\"width: 40px; height: 40px; border-radius: 20px; border: 0; background: transparent; color: #5F6368; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; padding: 0\">\n      <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M4 7h9M17 7h3M4 17h3M11 17h9\"><\/path><circle cx=\"15\" cy=\"7\" r=\"2\"><\/circle><circle cx=\"9\" cy=\"17\" r=\"2\"><\/circle><\/svg>\n    <\/button>\n    <button type=\"button\" aria-label=\"Account: Jane\" style=\"width: 40px; height: 40px; border-radius: 20px; border: 0; background: transparent; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; padding: 0\">\n      <span style=\"width: 32px; height: 32px; border-radius: 16px; background: #1E8E3E; color: #FFFFFF; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center\">J<\/span>\n    <\/button>\n  <\/div>\n<\/header>", "js": "class Component extends DCLogic {\n  renderVals() {\n    return {};\n  }\n}"}};
const TITLES = {"Main": "Overview", "FlowPrototype": "Journeys", "Journeys": "Journeys", "Audiences": "Audiences", "Ask": "Ask", "Brief": "Weekly brief", "DataSources": "Data sources", "ProblemDetail": "Drawer P1", "ProblemDetailP2": "Drawer P2", "ProblemDetailP3": "Drawer P3", "SessionPlayer": "Watch sessions P1", "SessionPlayerOTP": "Watch sessions P2", "SessionPlayerForm": "Watch sessions P3", "Components": "Components"};</script>
<script>
(function () {
  class DCLogic {
    constructor() { this.props = {}; this.state = {}; }
    setState(patch) { Object.assign(this.state, typeof patch === 'function' ? patch(this.state) : patch); schedule(); }
    forceUpdate() { schedule(); }
  }
  const SRC = window.__SQUINT__;
  const classes = {};
  for (const name of Object.keys(SRC)) {
    classes[name] = new Function('DCLogic', SRC[name].js + '\nreturn Component;')(DCLogic);
    const t = document.createElement('template');
    t.innerHTML = SRC[name].html;
    SRC[name].tpl = t;
  }

  const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  const ONE = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;
  function lookup(expr, scope) {
    expr = expr.trim();
    if (expr === 'true') return true;
    if (expr === 'false') return false;
    if (expr === 'null') return null;
    if (/^-?\d+(\.\d+)?$/.test(expr)) return Number(expr);
    if (/^'.*'$|^".*"$/.test(expr)) return expr.slice(1, -1);
    let v = scope;
    for (const part of expr.split('.')) { if (v == null) return undefined; v = v[part]; }
    return v;
  }
  function attrValue(raw, scope) {
    const one = raw.match(ONE);
    if (one) return lookup(one[1], scope);
    return raw.replace(HOLE, (_, e) => { const v = lookup(e, scope); return v == null ? '' : String(v); });
  }
  const camel = (s) => s.replace(/-([a-z])/g, (_, c) => c.toUpperCase());

  // Journeys links open the version where See why and Watch sessions slide in as overlays.
  const ALIAS = { Journeys: 'FlowPrototype' };
  const instances = new Map();
  let route = 'Main';

  function renderComponent(name, props, key) {
    const Cls = classes[name];
    if (!Cls) return [document.createTextNode('[missing ' + name + ']')];
    let inst = instances.get(key);
    if (!inst || inst.__name !== name) { inst = new Cls(); inst.__name = name; instances.set(key, inst); }
    inst.props = props;
    const vals = inst.renderVals ? inst.renderVals() : {};
    const ctx = { key, n: 0 };
    return renderNodes(SRC[name].tpl.content.childNodes, vals, ctx);
  }

  function renderNodes(nodes, scope, ctx) {
    const out = [];
    for (const node of nodes) {
      if (node.nodeType === 3) {
        out.push(document.createTextNode(node.nodeValue.replace(HOLE, (_, e) => { const v = lookup(e, scope); return v == null ? '' : String(v); })));
        continue;
      }
      if (node.nodeType !== 1) continue;
      const tag = node.tagName.toLowerCase();
      if (tag === 'template' && node.dataset.sc === 'if') {
        if (attrValue(node.getAttribute('value') || '', scope)) out.push(...renderNodes(node.content.childNodes, scope, ctx));
        continue;
      }
      if (tag === 'template' && node.dataset.sc === 'for') {
        const list = attrValue(node.getAttribute('list') || '', scope) || [];
        const as = node.getAttribute('as') || 'item';
        list.forEach((item, i) => {
          const child = Object.create(scope);
          child[as] = item; child.$index = i;
          out.push(...renderNodes(node.content.childNodes, child, ctx));
        });
        continue;
      }
      if (tag === 'dc-import') {
        const props = {};
        let name = '';
        for (const a of node.attributes) {
          if (a.name === 'name') { name = a.value; continue; }
          if (a.name.startsWith('hint-')) continue;
          props[camel(a.name)] = attrValue(a.value, scope);
        }
        out.push(...renderComponent(name, props, ctx.key + '/' + name + '#' + (ctx.n++)));
        continue;
      }
      const el = node.namespaceURI === 'http://www.w3.org/2000/svg'
        ? document.createElementNS(node.namespaceURI, node.tagName)
        : document.createElement(tag);
      for (const a of node.attributes) {
        const v = attrValue(a.value, scope);
        if (a.name.startsWith('on') && a.name.length > 2) {
          if (typeof v === 'function') el.addEventListener(a.name.slice(2), (e) => { v(e); });
          continue;
        }
        if (a.name === 'checked' || a.name === 'disabled' || a.name === 'selected') {
          if (v === false || v === 'false' || v == null) continue;
          el.setAttribute(a.name, '');
          continue;
        }
        if (a.name === 'href' && typeof v === 'string') {
          const m = v.match(/^\.?\/?([A-Za-z0-9_-]+)\.dc\.html$/);
          if (m) { el.setAttribute('href', '#' + (ALIAS[m[1]] || m[1])); continue; }
        }
        el.setAttribute(a.name, v == null ? '' : String(v));
      }
      for (const c of renderNodes(node.childNodes, scope, ctx)) el.appendChild(c);
      out.push(el);
    }
    return out;
  }

  const app = document.getElementById('app');
  let pending = false;
  function schedule() { if (pending) return; pending = true; Promise.resolve().then(() => { pending = false; draw(); }); }
  function draw() {
    const x = window.scrollX, y = window.scrollY;
    const nodes = renderComponent(route, {}, 'root:' + route);
    app.replaceChildren(...nodes);
    window.scrollTo(x, y);
  }
  function go() {
    const h = decodeURIComponent(location.hash.replace(/^#/, ''));
    const next = classes[h] ? h : (h ? null : 'Main');
    if (next === null) return; // an in-page anchor such as #signals
    if (next !== route) { route = next; instances.clear(); window.scrollTo(0, 0); }
    draw();
    document.title = 'Squint · ' + (TITLES[route] || route);
  }
  document.addEventListener('submit', (e) => e.preventDefault());
  window.addEventListener('hashchange', go);
  go();
})();
</script>
