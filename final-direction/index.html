<body>
<div id="app"></div>
<nav id="squint-pages" aria-label="Prototype pages"><span>Prototype · mock data marked</span><a href="#Main">Overview</a><a href="#FlowPrototype">Journeys</a><a href="#Audiences">Audiences</a><a href="#Ask">Ask</a><a href="#Brief">Brief</a><a href="#DataSources">Data sources</a><a href="#Components">Components</a></nav>
<script>window.__SQUINT__ = {"Ask": {"html": "<div style=\"min-height: 100vh; background: #F8F9FA; color: #202124; font-family: 'Google Sans Flex', 'Google Sans', Roboto, system-ui, sans-serif; font-size: 14px; line-height: 20px\">\n  <dc-import name=\"TopBar\" hint-size=\"100%,64px\"><\/dc-import>\n  <div style=\"display: flex; flex-wrap: wrap; align-items: stretch\">\n\n    <div style=\"flex: 0 0 256px\"><dc-import name=\"NavRail\" active=\"ask\" hint-size=\"256px,640px\"><\/dc-import><\/div>\n\n    <aside aria-label=\"Question history\" style=\"flex: 1 1 300px; max-width: 320px; box-sizing: border-box; padding: 16px 12px 24px; background: #FFFFFF; border-right: 1px solid #E8EAED; border-left: 1px solid #E8EAED; display: flex; flex-direction: column; gap: 8px\">\n      <button type=\"button\" class=\"btn btn-tonal\" style=\"align-self: flex-start; padding: 0 20px 0 16px\">\n        <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"><\/path><\/svg>\n        New question\n      <\/button>\n      <label style=\"display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border-radius: 20px; background: #F1F3F4; margin-top: 4px\">\n        <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#5F6368\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"6.5\"><\/circle><path d=\"M16 16l4 4\"><\/path><\/svg>\n        <span style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">Search your questions<\/span>\n        <input type=\"text\" placeholder=\"Search your questions\" style=\"flex: 1; min-width: 0; border: 0; background: transparent; font-family: inherit; font-size: 14px; outline: none\">\n      <\/label>\n      <div class=\"cap\" style=\"display: flex; align-items: center; gap: 6px; padding: 4px 12px 0\">\n        <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\"><rect x=\"5\" y=\"11\" width=\"14\" height=\"9\" rx=\"2\"><\/rect><path d=\"M8 11V8a4 4 0 0 1 8 0v3\"><\/path><\/svg>\n        Private to you · kept 90 days unless pinned\n      <\/div>\n\n      <template data-sc=\"for\" list=\"{{groups}}\" as=\"g\" hint-placeholder-count=\"4\">\n        <div class=\"grp\">{{g.label}}<\/div>\n        <template data-sc=\"for\" list=\"{{g.items}}\" as=\"h\" hint-placeholder-count=\"2\">\n          <button type=\"button\" class=\"hist\" style=\"{{h.sel}}\" aria-current=\"{{h.cur}}\">\n            <span style=\"display: flex; align-items: flex-start; gap: 8px\">\n              <span style=\"flex: 1; min-width: 0; {{h.titleStyle}}\">{{h.title}}<\/span>\n              <span title=\"{{h.freshTitle}}\" style=\"width: 8px; height: 8px; border-radius: 4px; margin-top: 6px; flex: none; background: {{h.fresh}}\"><\/span>\n            <\/span>\n            <span style=\"display: flex; flex-wrap: wrap; gap: 4px\">\n              <span class=\"mini\" style=\"background: #F1F3F4; color: #3C4043\">{{h.scope}}<\/span>\n              <template data-sc=\"if\" value=\"{{h.hasProblem}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"mini\" style=\"background: #FCE8E6; color: #C5221F\">{{h.problem}}<\/span><\/template>\n              <template data-sc=\"if\" value=\"{{h.shared}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"mini\" style=\"background: #E8F0FE; color: #174EA6\">Shared<\/span><\/template>\n            <\/span>\n          <\/button>\n        <\/template>\n      <\/template>\n      <div class=\"cap\" style=\"display: flex; flex-wrap: wrap; gap: 12px; padding: 16px 12px 0; border-top: 1px solid #F1F3F4; margin-top: 8px\">\n        <span style=\"display: inline-flex; align-items: center; gap: 6px\"><span class=\"dot\" style=\"background: #1A73E8\"><\/span>Newer data available<\/span>\n        <span style=\"display: inline-flex; align-items: center; gap: 6px\"><span class=\"dot\" style=\"background: #DADCE0\"><\/span>Up to date<\/span>\n      <\/div>\n    <\/aside>\n\n    <main style=\"flex: 999 1 560px; min-width: 0; padding: 28px 32px 48px; box-sizing: border-box\">\n      <div style=\"max-width: 840px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px\">\n\n        <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px\">\n          <h1 style=\"margin: 0; font-size: 22px; line-height: 30px; font-weight: 400; flex: 1 1 300px\">Why individual traders leave Send money<\/h1>\n          <span class=\"chip\" style=\"background: #F1F3F4; color: #3C4043\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\"><rect x=\"5\" y=\"11\" width=\"14\" height=\"9\" rx=\"2\"><\/rect><path d=\"M8 11V8a4 4 0 0 1 8 0v3\"><\/path><\/svg>Private<\/span>\n          <a class=\"btn btn-outlined\" href=\"AskFlow5.dc.html\" style=\"height: 36px; padding: 0 16px\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"12\" rx=\"2\"><\/rect><path d=\"M8 21h8M12 17v4\"><\/path><\/svg>Export slides<\/a>\n          <button type=\"button\" class=\"btn btn-outlined\" style=\"height: 36px; padding: 0 16px\">Share<\/button>\n          <button type=\"button\" class=\"ibtn\" aria-label=\"More: pin, rename, delete\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"currentColor\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"5\" r=\"1.8\"><\/circle><circle cx=\"12\" cy=\"12\" r=\"1.8\"><\/circle><circle cx=\"12\" cy=\"19\" r=\"1.8\"><\/circle><\/svg><\/button>\n        <\/div>\n\n        <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 12px 16px; border-radius: 12px; {{bannerStyle}}\">\n          <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" aria-hidden=\"true\" style=\"color: #5F6368\"><circle cx=\"12\" cy=\"12\" r=\"8.5\"><\/circle><path d=\"M12 7.5V12l3 2\"><\/path><\/svg>\n          <span style=\"flex: 1 1 320px\">{{bannerText}}<\/span>\n          <template data-sc=\"if\" value=\"{{stale}}\" hint-placeholder-val=\"{{ true }}\">\n            <button type=\"button\" class=\"btn btn-filled\" style=\"height: 36px; padding: 0 16px\" onClick=\"{{rerun}}\">\n              <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4.5 11A7.5 7.5 0 0 1 18 7\"><\/path><path d=\"M18 3v4h-4\"><\/path><path d=\"M19.5 13A7.5 7.5 0 0 1 6 17\"><\/path><path d=\"M6 21v-4h4\"><\/path><\/svg>\n              Re-run with latest data\n            <\/button>\n          <\/template>\n        <\/div>\n\n        <div style=\"display: flex; justify-content: flex-end\">\n          <p style=\"margin: 0; max-width: 560px; padding: 12px 18px; border-radius: 20px 20px 4px 20px; background: #E8F0FE; color: #174EA6; font-size: 16px; line-height: 24px\">Why do individual traders leave Send money?<\/p>\n        <\/div>\n\n        <section class=\"card\" aria-labelledby=\"a1\" style=\"padding: 24px; display: flex; flex-direction: column; gap: 18px\">\n          <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 8px\">\n            <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1A73E8\" stroke-width=\"1.75\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7-4.7-1.8 4.7-1.8z\"><\/path><\/svg>\n            <span class=\"tag tag-ai\">AI<\/span>\n            <span class=\"mini\" style=\"background: #FCE8E6; color: #C5221F\">P1<\/span>\n            <span class=\"cap\" style=\"margin-left: auto\">All users · Oct 8–14 · driver chart<\/span>\n          <\/div>\n          <h2 id=\"a1\" style=\"margin: 0; font-size: 24px; line-height: 32px; font-weight: 400\">Fix <span style=\"font-weight: 500\">Send money checkout<\/span> for individual traders<\/h2>\n          <p style=\"margin: 0; color: #3C4043\">The payment call is timing out: errors and repeated taps on Pay, not confusing wording.<\/p>\n\n          <div style=\"display: flex; flex-direction: column; gap: 12px\">\n            <div style=\"display: flex; align-items: center; gap: 8px\">\n              <span class=\"lbl\">What drives it<\/span><span class=\"tag\">Calculated<\/span>\n              <span class=\"cap\" style=\"margin-left: auto; display: inline-flex; gap: 16px\"><span style=\"display: inline-flex; align-items: center; gap: 6px\"><span class=\"dot\" style=\"background: #D93025\"><\/span>Individual traders<\/span><span style=\"display: inline-flex; align-items: center; gap: 6px\"><span class=\"dot\" style=\"background: #9AA0A6\"><\/span>Usual<\/span><\/span>\n            <\/div>\n            <template data-sc=\"for\" list=\"{{drivers}}\" as=\"d\" hint-placeholder-count=\"3\">\n              <div style=\"display: grid; grid-template-columns: 140px 1fr 150px; gap: 16px; align-items: center\">\n                <span style=\"color: #3C4043\">{{d.label}}<\/span>\n                <div style=\"display: flex; flex-direction: column; gap: 4px\">\n                  <div class=\"track\"><div style=\"width: {{d.a}}; height: 100%; background: #D93025\"><\/div><\/div>\n                  <div class=\"track\"><div style=\"width: {{d.b}}; height: 100%; background: #9AA0A6\"><\/div><\/div>\n                <\/div>\n                <span class=\"num\" style=\"text-align: right\"><span style=\"font-weight: 500\">{{d.ratio}}<\/span> <span class=\"cap\">{{d.vals}}<\/span><\/span>\n              <\/div>\n            <\/template>\n          <\/div>\n\n          <template data-sc=\"if\" value=\"{{rerunDone}}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; border-radius: 10px; border: 1px solid #AECBFA; background: #F8FBFF\">\n              <div style=\"display: flex; align-items: center; gap: 8px; flex-wrap: wrap\">\n                <span class=\"lbl\" style=\"color: #174EA6\">What changed since Oct 14<\/span>\n                <span class=\"mock\">Mock data<\/span>\n              <\/div>\n              <div style=\"display: grid; grid-template-columns: 160px auto auto 1fr; gap: 8px 12px; align-items: center\">\n                <span>Leave at checkout<\/span><span class=\"num\" style=\"color: #5F6368; text-decoration: line-through\">61%<\/span><span class=\"num\" style=\"font-weight: 500\">58%<\/span><span class=\"cap\" style=\"color: #137333\">−3 pts, still 6.4× usual<\/span>\n                <span>Repeated taps<\/span><span class=\"num\" style=\"color: #5F6368; text-decoration: line-through\">26%<\/span><span class=\"num\" style=\"font-weight: 500\">24%<\/span><span class=\"cap\">−2 pts<\/span>\n                <span>Errors<\/span><span class=\"num\" style=\"color: #5F6368; text-decoration: line-through\">17%<\/span><span class=\"num\" style=\"font-weight: 500\">17%<\/span><span class=\"cap\">no change<\/span>\n              <\/div>\n              <span class=\"cap\">The original answer above stays as it was, so you can still quote it.<\/span>\n            <\/div>\n          <\/template>\n\n          <div style=\"display: flex; flex-wrap: wrap; gap: 8px; padding-top: 16px; border-top: 1px solid #F1F3F4\">\n            <a class=\"btn btn-tonal\" href=\"Journeys.dc.html\">Open in Journeys<\/a>\n            <button type=\"button\" class=\"btn btn-outlined\">Pin to Overview<\/button>\n            <button type=\"button\" class=\"btn btn-outlined\">Copy as text<\/button>\n          <\/div>\n        <\/section>\n\n        <div style=\"display: flex; justify-content: flex-end\">\n          <p style=\"margin: 0; max-width: 560px; padding: 12px 18px; border-radius: 20px 20px 4px 20px; background: #E8F0FE; color: #174EA6; font-size: 16px; line-height: 24px\">Is it worse on low-end Android?<\/p>\n        <\/div>\n\n        <section class=\"card\" aria-labelledby=\"a2\" style=\"padding: 24px; display: flex; flex-direction: column; gap: 16px\">\n          <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 8px\">\n            <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1A73E8\" stroke-width=\"1.75\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7-4.7-1.8 4.7-1.8z\"><\/path><\/svg>\n            <span class=\"tag tag-ai\">AI<\/span>\n            <span class=\"cap\" style=\"margin-left: auto\">All users · Oct 8–14 · bar chart<\/span>\n          <\/div>\n          <h2 id=\"a2\" style=\"margin: 0; font-size: 20px; line-height: 28px; font-weight: 400\">Investigate <span style=\"font-weight: 500\">Checkout and PIN<\/span> for low-end Android <span style=\"font-size: 15px; color: #5F6368\">· slightly worse<\/span><\/h2>\n          <div style=\"display: flex; flex-direction: column; gap: 10px\">\n            <template data-sc=\"for\" list=\"{{devices}}\" as=\"d\" hint-placeholder-count=\"3\">\n              <div style=\"display: grid; grid-template-columns: 140px 1fr 48px 90px; gap: 12px; align-items: center\">\n                <span style=\"{{d.ls}}\">{{d.name}}<\/span>\n                <div class=\"track\"><div style=\"width: {{d.w}}; height: 100%; background: {{d.c}}\"><\/div><\/div>\n                <span class=\"num\" style=\"text-align: right; {{d.ls}}\">{{d.v}}<\/span>\n                <span class=\"cap num\" style=\"text-align: right\">{{d.n}}<\/span>\n              <\/div>\n            <\/template>\n          <\/div>\n          <p class=\"cap\" style=\"margin: 0\">Share of sessions that leave at Checkout and PIN, all products. 12% vs 9.7%: a small gap, so device isn't the main cause.<\/p>\n        <\/section>\n\n        <div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n          <button type=\"button\" class=\"sug\">Which app version is affected most?<\/button>\n          <button type=\"button\" class=\"sug\">Show their journey as a flow<\/button>\n        <\/div>\n\n        <form style=\"display: flex; flex-direction: column; gap: 8px; padding: 12px 12px 12px 20px; background: #FFFFFF; border: 1px solid #DADCE0; border-radius: 24px; margin: 0\">\n          <div style=\"display: flex; align-items: center; gap: 12px\">\n            <label for=\"ask-follow\" style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">Ask a follow-up<\/label>\n            <input id=\"ask-follow\" type=\"text\" placeholder=\"Ask a follow-up\" style=\"flex: 1; min-width: 0; height: 40px; border: 0; background: transparent; font-family: inherit; font-size: 16px; outline: none\">\n            <button type=\"submit\" aria-label=\"Send question\" style=\"width: 40px; height: 40px; border-radius: 20px; border: 0; background: #1A73E8; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; cursor: pointer\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 19V5M6 11l6-6 6 6\"><\/path><\/svg><\/button>\n          <\/div>\n          <span class=\"cap\" style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 6px\">Asking about <span class=\"mini\" style=\"background: #F1F3F4; color: #3C4043\">All users · Last 7 days<\/span> · saved with each answer<\/span>\n        <\/form>\n        <p class=\"cap\" style=\"margin: -8px 0 0 20px\">Answers only use numbers from your data. AI can be wrong; open the evidence before you act.<\/p>\n      <\/div>\n    <\/main>\n  <\/div>\n<\/div>", "js": "class Component extends DCLogic {\n  renderVals() {\n    const rerunDone = !!this.state.rerunDone;\n    const blue = '#1A73E8', grey = '#DADCE0';\n    const item = (title, scope, fresh, problem, shared, selected) => ({\n      title, scope, problem: problem || '', hasProblem: !!problem, shared: !!shared,\n      fresh: selected && rerunDone ? grey : (fresh ? blue : grey),\n      freshTitle: (selected && rerunDone) || !fresh ? 'Up to date' : 'Newer data available',\n      sel: selected ? 'background: #E8F0FE;' : '',\n      cur: selected ? 'true' : 'false',\n      titleStyle: selected ? 'font-weight: 500; color: #174EA6' : ''\n    });\n    const groups = [\n      { label: 'Pinned', items: [\n        item('Why individual traders leave Send money', 'All users · 7d', true, 'P1', false, true)\n      ] },\n      { label: 'Today', items: [\n        item('What follows an OTP failure?', 'All users · 24h', false, 'P2', false, false),\n        item('Personal data exits by user group', 'All users · 7d', false, 'P3', true, false)\n      ] },\n      { label: 'Yesterday', items: [\n        item('Where do payment drop-offs go?', 'Retail · 7d', true, '', false, false)\n      ] },\n      { label: 'Last 7 days', items: [\n        item('Why do retail buyers leave?', 'Retail · 30d', true, '', false, false),\n        item('Top-up sizes for large businesses', 'Large business · 30d', true, '', false, false)\n      ] }\n    ];\n    const devices = [['Android, low-end', 12, 1579], ['Android, mid/high', 9.7, 1078], ['iOS', 9.7, 2577]].map(([name, v, n], i) => ({\n      name, v: v + '%', w: (v / 20 * 100).toFixed(1) + '%', n: n.toLocaleString('en-US') + ' sess.',\n      c: i === 0 ? '#D93025' : '#BDC1C6',\n      ls: i === 0 ? 'font-weight: 500; color: #202124' : 'color: #3C4043'\n    }));\n    return {\n      groups, devices, rerunDone, stale: !rerunDone,\n      rerun: () => this.setState({ rerunDone: true }),\n      bannerText: rerunDone\n        ? 'Re-run today
