tyle=\"padding-bottom: 4px\">Include<\/span>\n          <label class=\"sw\"><span>Evidence appendix<\/span><input type=\"checkbox\" checked=\"true\" style=\"width: 18px; height: 18px; accent-color: #1A73E8; margin: 0\"><\/label>\n          <label class=\"sw\"><span>Speaker notes with numbers<\/span><input type=\"checkbox\" checked=\"true\" style=\"width: 18px; height: 18px; accent-color: #1A73E8; margin: 0\"><\/label>\n          <label class=\"sw\" style=\"color: #5F6368\"><span>AI and Calculated labels<\/span><input type=\"checkbox\" checked=\"true\" disabled=\"true\" style=\"width: 18px; height: 18px; margin: 0\"><\/label>\n          <span class=\"cap\">Labels can't be removed, so readers know which lines are AI.<\/span>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 16px 24px 20px 28px; border-top: 1px solid #E8EAED\">\n      <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#B06000\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\"><rect x=\"5\" y=\"11\" width=\"14\" height=\"9\" rx=\"2\"><\/rect><path d=\"M8 11V8a4 4 0 0 1 8 0v3\"><\/path><\/svg>\n      <span style=\"flex: 1 1 320px; font-size: 13px; color: #3C4043\">This chat is private. The deck is a copy: anyone you share it with sees these numbers.<\/span>\n      <a class=\"btn btn-text\" href=\"AskFlow4.dc.html\">Cancel<\/a>\n      <a class=\"btn btn-filled\" href=\"DeckSlide1.dc.html\">Export 4 slides<\/a>\n    <\/div>\n  <\/div>\n<\/div>", "js": "class Component extends DCLogic {\n  renderVals() {\n    const cur = this.state.cur ?? 0;\n    const red = '#D93025', grey = '#BDC1C6';\n    const mk = (rows) => rows.map(([name, v, max], i) => ({\n      name, v: typeof v === 'number' ? (v % 1 ? v.toFixed(1) + '%' : String(v)) : v,\n      w: (parseFloat(v) / max * 100).toFixed(1) + '%', c: i === 0 ? red : grey,\n      ls: i === 0 ? 'font-weight: 500; color: #202124' : 'color: #3C4043'\n    }));\n    const data = [\n      { title: 'Summary', kind: 'Takeaway + 3 numbers', eyebrow: 'Squint · Summary', headA: 'Investigate', headB: 'OTP code', headC: 'for all users',\n        body: 'Codes likely aren\\'t arriving. Individual traders are hit hardest.',\n        bars: mk([['Taps on Resend code', 457, 457], ['Exits with an error or dead tap', 89, 91], ['Loops back to Phone number', 62, 457]]) },\n      { title: 'Investigate OTP code for all users', kind: 'Answer 1 · bar chart', eyebrow: 'Squint · Answer 1', headA: 'Investigate', headB: 'OTP code', headC: 'for all users',\n        body: '71% of repeated taps land on Resend code: people wait for a code that doesn\\'t come.',\n        bars: mk([['Resend code / receive via SMS', 457, 457], ['Verify button (left)', 63, 457], ['Verify button (right)', 61, 457]]) },\n      { title: 'Investigate OTP code for individual traders', kind: 'Follow-up · bar chart', eyebrow: 'Squint · Answer 2', headA: 'Investigate', headB: 'OTP code', headC: 'for individual traders',\n        body: 'Every group taps repeatedly; individual traders most (7.5% vs 5.6% overall).',\n        bars: mk([['Individual trader', 7.5, 10], ['Individual', 6.8, 10], ['Large business', 5.9, 10]]) },\n      { title: 'Evidence and data notes', kind: 'Appendix', eyebrow: 'Squint · Appendix', headA: 'How', headB: 'these numbers', headC: 'were made',\n        body: '1,782 sessions at OTP code · scope All users, Oct 8–14 · KYC selfie tracker silent on app 4.12 (not used here).',\n        bars: mk([['Sessions read', 1782, 1782], ['Exits at OTP code', 179, 1782], ['Sessions set aside', 59, 1782]]) }\n    ];\n    const slides = data.map((s, i) => ({\n      ...s, n: i + 1, include: true, on: cur === i ? 'true' : 'false',\n      accent: i === 3 ? '#9AA0A6' : '#202124', chart: i === 3 ? '#9AA0A6' : red,\n      style: cur === i ? 'background: #E8F0FE; border-color: #AECBFA;' : '',\n      pick: () => this.setState({ cur: i })\n    }));\n    return { slides, sel: slides[cur] };\n  }\n}"}, "Audiences": {"html": "<div style=\"min-height: 100vh; background: #F8F9FA; color: #202124; font-family: 'Google Sans Flex', 'Google Sans', Roboto, system-ui, sans-serif; font-size: 14px; line-height: 20px\">\n  <dc-import name=\"TopBar\" hint-size=\"100%,64px\"><\/dc-import>\n  <div style=\"display: flex; flex-wrap: wrap; align-items: flex-start\">\n    <div style=\"flex: 1 1 256px; max-width: 100%\"><dc-import name=\"NavRail\" active=\"audiences\" hint-size=\"256px,640px\"><\/dc-import><\/div>\n    <main style=\"flex: 999 1 560px; min-width: 0; padding: 28px 32px 64px; box-sizing: border-box\">\n      <div style=\"max-width: 1120px; display: flex; flex-direction: column; gap: 24px\">\n\n        <div>\n          <div class=\"cap\" style=\"margin-bottom: 4px\">Explore<\/div>\n          <h1 style=\"margin: 0; font-size: 28px; line-height: 36px; font-weight: 400\">Audiences<\/h1>\n          <p style=\"margin: 4px 0 0; color: #5F6368\"><span style=\"font-weight: 500; color: #202124\">Who should we target, win back or protect?<\/span> Screen fixes live in <a href=\"Journeys.dc.html\" style=\"text-decoration: none; font-weight: 500\">Journeys<\/a>.<\/p>\n        <\/div>\n\n        <dc-import name=\"ScopeBar\" hint-size=\"100%,40px\"><\/dc-import>\n\n        <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 16px; border: 1px dashed #F9AB00; border-radius: 10px; background: #FFFDF5; font-size: 13px\">\n          <span class=\"mock\">Mock data<\/span>\n          <span style=\"color: #3C4043\">Return visits and repeat purchases are switched on with illustrative numbers. Everything marked “Mock data” is made up for this design.<\/span>\n        <\/div>\n\n        <!-- ① Top audience: now the evidence-backed win-back -->\n        <section class=\"card\" aria-labelledby=\"top\" style=\"padding: 28px 32px; display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start\">\n          <figure style=\"margin: 0; display: flex; flex-direction: column; gap: 14px; flex: 0 1 340px\">\n            <div style=\"display: flex; align-items: baseline; gap: 10px\">\n              <span class=\"num\" style=\"font-size: 40px; line-height: 48px; color: #C5221F\">52<\/span>\n              <span class=\"cap\" style=\"font-size: 13px\">of 88 people who stalled at OTP code<br>never came back<\/span>\n            <\/div>\n            <div style=\"display: flex; height: 20px; border-radius: 6px; overflow: hidden; gap: 2px\" role=\"img\" aria-label=\"Of 88 stalled people: 52 never returned, 15 returned but did not finish, 21 returned and finished sign-up\">\n              <div style=\"width: 59%; background: #D93025\"><\/div>\n              <div style=\"width: 17%; background: #F9AB00\"><\/div>\n              <div style=\"width: 24%; background: #1E8E3E\"><\/div>\n            <\/div>\n            <div style=\"display: grid; grid-template-columns: auto 1fr auto; gap: 6px 10px; align-items: center; font-size: 13px\">\n              <span class=\"dot\" style=\"background: #D93025\"><\/span><span>Never returned<\/span><span class=\"num\" style=\"font-weight: 500\">52<\/span>\n              <span class=\"dot\" style=\"background: #F9AB00\"><\/span><span>Returned, didn't finish<\/span><span class=\"num\">15<\/span>\n              <span class=\"dot\" style=\"background: #1E8E3E\"><\/span><span>Returned and signed up<\/span><span class=\"num\">21<\/span>\n            <\/div>\n            <figcaption><span class=\"mock\">Mock data<\/span><\/figcaption>\n          <\/figure>\n\n          <div style=\"flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 16px\">\n            <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 8px\">\n              <h2 id=\"top\" style=\"margin: 0; font-size: 14px; line-height: 20px; font-weight: 500; color: #1967D2\">Top audience to act on<\/h2>\n              <span class=\"chip\" style=\"background: #FCE8E6; color: #C5221F\">Win back<\/span>\n              <span class=\"chip\" style=\"background: #F1F3F4; color: #3C4043\">Linked to P2<\/span>\n            <\/div>\n            <p style=\"margin: 0; font-size: 28px; line-height: 36px\">Win back <span style=\"font-weight: 500\">sign-up<\/span> for 52 people who stalled at OTP code<\/p>\n            <p style=\"margin: 0; color: #5F6368\">They stopped at OTP code and haven't opened the app since. Send once the OTP fix ships, so they don't hit it again.<\/p>\n            <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px\">\n              <button type=\"button\" class=\"btn btn-filled\">Export 52 people<\/button>\n              <a class=\"btn btn-outlined\" href=\"Journeys.dc.html\">Check the OTP fix in Journeys<\/a>\n            <\/div>\n          <\/div>\n        <\/section>\n\n        <!-- ② Other audiences -->\n        <section aria-labelledby=\"more\" style=\"display: flex; flex-direction: column; gap: 12px\">\n          <h2 id=\"more\" class=\"h2\">Other audiences<\/h2>\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px\">\n\n            <article class=\"card\" style=\"padding: 20px; display: flex; flex-direction: column; gap: 10px\">\n              <div role=\"img\" aria-label=\"54% of buyers bought only once\" style=\"display: flex; height: 28px; align-items: flex-end; gap: 4px\">\n                <span style=\"width: 22px; height: 28px; background: #D93025; border-radius: 3px\"><\/span><span style=\"width: 22px; height: 15px; background: #DADCE0; border-radius: 3px\"><\/span><span style=\"width: 22px; height: 10px; background: #DADCE0; border-radius: 3px\"><\/span>\n              <\/div>\n              <div style=\"display: flex; align-items: center; gap: 8px; flex-wrap: wrap\"><span class=\"chip\" style=\"background: #FCE8E6; color: #C5221F\">Win back<\/span><span class=\"mock\">Mock data<\/span><\/div>\n              <span>Win back <span style=\"font-weight: 500\">a second purchase<\/span> for one-time buyers<\/span>\n              <span class=\"cap num\">One-time buyers · 54% of buyers · ~210 people<\/span>\n            <\/article>\n\n            <article class=\"card\" style=\"padding: 20px; display: flex; flex-direction: column; gap: 10px\">\n              <div role=\"img\" aria-label=\"62% of large businesses are in this audience\" style=\"width: 40px; height: 40px; border-radius: 20px; background: conic-gradient(#1A73E8 0 62%, #E8EAED 62% 100%); display: flex; align-items: center; justify-content: center\">\n                <span style=\"width: 26px; height: 26px; border-radius: 13px; background: #FFFFFF\"><\/span>\n              <\/div>\n              <div style=\"display: flex; align-items: center; gap: 8px; flex-wrap: wrap\"><span class=\"chip\" style=\"background: #E8F0FE; color: #174EA6\">Target<\/span><span class=\"tag tag-ai\">AI idea<\/span><\/div>\n              <span>Target <span style=\"font-weight: 500\">Top-up<\/span> promos for large businesses<\/span>\n              <span class=\"cap num\">High-value top-uppers · 10% · ~98 people<\/span>\n            <\/article>\n\n            <article class=\"card\" style=\"padding: 20px; display: flex; flex-direction: column; gap: 10px\">\n              <div role=\"img\" aria-label=\"18% of buyers bought 4 or more times\" style=\"display: flex; height: 28px; align-items: flex-end; gap: 4px\">\n                <span style=\"width: 22px; height: 28px; background: #DADCE0; border-radius: 3px\"><\/span><span style=\"width: 22px; height: 15px; background: #DADCE0; border-radius: 3px\"><\/span><span style=\"width: 22px; height: 10px; background: #1E8E3E; border-radius: 3px\"><\/span>\n              <\/div>\n              <div style=\"display: flex; align-items: center; gap: 8px; flex-wrap: wrap\"><span class=\"chip\" style=\"background: #E6F4EA; color: #137333\">Keep<\/span><span class=\"mock\">Mock data<\/span><\/div>\n              <span>Keep <span style=\"font-weight: 500\">Send money<\/span> reliable for loyal buyers<\/span>\n              <span class=\"cap num\">Loyal buyers, 4+ purchases · 18% · ~70 people<\/span>\n            <\/article>\n\n            <article class=\"card\" style=\"padding: 20px; display: flex; flex-direction: column; gap: 10px\">\n              <div role=\"img\" aria-label=\"Many sessions in a short burst from one device\" style=\"display: flex; align-items: flex-end; gap: 3px; height: 28px\">\n                <span style=\"width: 6px; height: 6px; background: #DADCE0; border-radius: 1px\"><\/span><span style=\"width: 6px; height: 6px; background: #DADCE0; border-radius: 1px\"><\/span><span style=\"width: 6px; height: 24px; background: #5F6368; border-radius: 1px\"><\/span><span style=\"width: 6px; height: 28px; background: #5F6368; border-radius: 1px\"><\/span><span style=\"width: 6px; height: 20px; background: #5F6368; border-radius: 1px\"><\/span><span style=\"width: 6px; height: 6px; background: #DADCE0; border-radius: 1px\"><\/span>\n              <\/div>\n              <div style=\"display: flex; align-items: center; gap: 8px; flex-wrap: wrap\"><span class=\"chip\" style=\"background: #FCE8E6; color: #C5221F\">Protect<\/span><span class=\"tag tag-ai\">AI idea<\/span><\/div>\n              <span>Protect <span style=\"font-weight: 500\">accounts on shared devices<\/span> for all users<\/span>\n              <span class=\"cap num\">Shared-device bursts · 2% of active users<\/span>\n            <\/article>\n          <\/div>\n          <p class=\"cap\" style=\"margin: 0\">Load-first store owners (4%) moved to the full mix below: no clear action this week.<\/p>\n        <\/section>\n\n        <!-- ③ Signals, now with data -->\n        <section id=\"signals\" aria-labelledby=\"unlock\" style=\"display: flex; flex-direction: column; gap: 12px\">\n          <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px\">\n            <h2 id=\"unlock\" class=\"h2\">People signals<\/h2>\n            <span class=\"cap\">What sits behind the audiences above<\/span>\n          <\/div>\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px\">\n\n            <article class=\"card\" style=\"padding: 20px; display: flex; flex-direction: column; gap: 14px\">\n              <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 8px\">\n                <h3 style=\"margin: 0; font-size: 16px; line-height: 24px; font-weight: 500\">Return visits<\/h3>\n                <span class=\"mock\">Mock data<\/span>\n              <\/div>\n              <span class=\"src\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" aria-hidden=\"true\"><rect x=\"7\" y=\"3\" width=\"10\" height=\"18\" rx=\"2\"><\/rect><path d=\"M11 18h2\"><\/path><\/svg>App tracker · calculated daily<\/span>\n              <div style=\"display: flex; flex-direction: column; gap: 6px\">\n                <span class=\"lbl\">People who left a journey and came back within…<\/span>\n                <div role=\"img\" aria-label=\"34% within 1 day, 52% within 7 days, 61% within 30 days\" style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; align-items: end; height: 96px\">\n                  <div style=\"display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; height: 100%\"><span class=\"num\" style=\"font-weight: 500\">34%<\/span><span style=\"height: 34%; background: #8AB4F8; border-radius: 4px 4px 0 0\"><\/span><\/div>\n                  <div style=\"display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; height: 100%\"><span class=\"num\" style=\"font-weight: 500\">52%<\/span><span style=\"height: 52%; background: #669DF6; border-radius: 4px 4px 0 0\"><\/span><\/div>\n                  <div style=\"display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; height: 100%\"><span class=\"num\" style=\"font-weight: 500\">61%<\/span><span style=\"height: 61%; background: #1A73E8; border-radius: 4px 4px 0 0\"><\/span><\/div>\n                <\/div>\n                <div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px\" class=\"cap\"><span>1 day<\/span><span>7 days<\/span><span>30 days<\/span><\/div>\n              <\/div>\n              <div style=\"display: flex; flex-direction: column; gap: 6px; padding-top: 12px; border-top: 1px solid #F1F3F4\">\n                <span class=\"lbl\">Back within 7 days, by user group<\/span>\n                <template data-sc=\"for\" list=\"{{ret}}\" as=\"r\" hint-placeholder-count=\"5\">\n                  <div style=\"display: grid; grid-template-columns: 120px 1fr 40px; gap: 10px; align-items: center; font-size: 13px\">\n                    <span style=\"{{r.ls}}\">{{r.name}}<\/span>\n                    <span class=\"track\"><span style=\"display: block; width: {{r.w}}; height: 100%; background: {{r.c}}\"><\/span><\/span>\n                    <span class=\"num\" style=\"text-align: right; {{r.ls}}\">{{r.v}}<\/span>\n                  <\/div>\n                <\/template>\n                <span class=\"cap\">Individual traders come back least, and they also hit the Send money checkout bug (P1).<\/span>\n              <\/div>\n            <\/article>\n\n            <article class=\"card\" style=\"padding: 20px; display: flex; flex-direction: column; gap: 14px\">\n              <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 8px\">\n                <h3 style=\"margin: 0; font-size: 16px; line-height: 24px; font-weight: 500\">Repeat purchases<\/h3>\n                <span style=\"display: inline-flex; gap: 6px\"><span class=\"chip\" style=\"background: #FEF7E0; color: #B06000\">Partial<\/span><span class=\"mock\">Mock data<\/span><\/span>\n              <\/div>\n              <span class=\"src\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" aria-hidden=\"true\"><rect x=\"7\" y=\"3\" width=\"10\" height=\"18\" rx=\"2\"><\/rect><path d=\"M11 18h2\"><\/path><\/svg>App tracker · completed-transaction events<\/span>\n              <div style=\"display: flex; flex-direction: column; gap: 6px\">\n                <span class=\"lbl\">Buyers by purchases in 30 days · ~390 buyers<\/span>\n                <div role=\"img\" aria-label=\"54% bought once, 28% bought 2 to 3 times, 18% bought 4 or more times\" style=\"display: flex; height: 20px; border-radius: 6px; overflow: hidden; gap: 2px\">\n                  <div style=\"width: 54%; background: #D93025\"><\/div>\n                  <div style=\"width: 28%; background: #8AB4F8\"><\/div>\n                  <div style=\"width: 18%; background: #1E8E3E\"><\/div>\n                <\/div>\n                <div style=\"display: grid; grid-template-columns: auto 1fr auto; gap: 6px 10px; align-items: center; font-size: 13px\">\n                  <span class=\"dot\" style=\"background: #D93025\"><\/span><span>Once<\/span><span class=\"num\" style=\"font-weight: 500\">54%<\/span>\n                  <span class=\"dot\" style=\"background: #8AB4F8\"><\/span><span>2–3 times<\/span><span class=\"num\">28%<\/span>\n                  <span class=\"dot\" style=\"background: #1E8E3E\"><\/span><span>4 or more · loyal<\/span><span class=\"num\">18%<\/span>\n                <\/div>\n              <\/div>\n              <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding-top: 12px; border-top: 1px solid #F1F3F4\">\n                <div><div class=\"lbl\">Bought again in 30 days<\/div><div class=\"num\" style=\"font-size: 22px; line-height: 30px\">46%<\/div><\/div>\n                <div><div class=\"lbl\">Median days to 2nd purchase<\/div><div class=\"num\" style=\"font-size: 22px; line-height: 30px\">6<\/div><\/div>\n              <\/div>\n              <a href=\"DataSources.dc.html\" style=\"font-weight: 500; text-decoration: none; font-size: 13px\">Misses refunds and off-app payments · connect orders data →<\/a>\n            <\/article>\n\n            <article class=\"card\" style=\"padding: 20px; display: flex; flex-direction: column; gap: 12px; border-style: dashed\">\n              <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 8px\">\n                <h3 style=\"margin: 0; font-size: 16px; line-height: 24px; font-weight: 500\">Lifetime value<\/h3>\n                <span class=\"chip\" style=\"background: #F1F3F4; color: #3C4043\">Needs backend data<\/span>\n              <\/div>\n              <span class=\"src\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" aria-hidden=\"true\"><ellipse cx=\"12\" cy=\"6\" rx=\"7\" ry=\"3\"><\/ellipse><path d=\"M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3\"><\/path><\/svg>Backend database · payments or ledger<\/span>\n              <p style=\"margin: 0; color: #3C4043\">What each person is worth over time, in real pesos.<\/p>\n              <div style=\"display: flex; flex-direction: column; gap: 2px\"><span class=\"lbl\">Unlocks<\/span><span class=\"cap\" style=\"font-size: 13px\">High-value audiences by real ₱ · real value at risk instead of estimates<\/span><\/div>\n              <a class=\"btn btn-filled\" href=\"DataSources.dc.html\" style=\"align-self: flex-start; margin-top: auto\">\n                <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"><\/path><\/svg>\n                Connect a database\n              <\/a>\n            <\/article>\n          <\/div>\n        <\/section>\n\n        <!-- ④ Context -->\n        <section class=\"card\" aria-labelledby=\"mix\" style=\"padding: 24px; display: flex; flex-direction: column; gap: 16px\">\n          <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px\">\n            <h2 id=\"mix\" class=\"h2\" style=\"font-size: 16px\">All 975 active users, by behavior<\/h2>\n            <span class=\"cap\">Context<\/span>\n          <\/div>\n          <div style=\"display: flex; height: 16px; border-radius: 8px; overflow: hidden; gap: 2px\" role=\"img\" aria-label=\"Straight-through completers 38%, High-value top-uppers 10%, Stalled at OTP code 9%, Load-first store owners 4%, Shared-device bursts 2%, Not yet grouped 37%\">\n            <div style=\"width: 38%; background: #1E8E3E\"><\/div>\n            <div style=\"width: 10%; background: #1A73E8\"><\/div>\n            <div style=\"width: 9%; background: #D93025\"><\/div>\n            <div style=\"width: 4%; background: #F9AB00\"><\/div>\n            <div style=\"width: 2%; background: #5F6368\"><\/div>\n            <div style=\"width: 37%; background: #DADCE0\"><\/div>\n          <\/div>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 13px\">\n            <span style=\"display: inline-flex; align-items: center; gap: 6px\"><span class=\"dot\" style=\"background: #1E8E3E\"><\/span>Straight-through completers <span class=\"num\" style=\"font-weight: 500\">38%<\/span><\/span>\n            <span style=\"display: inline-flex; align-items: center; gap: 6px\"><span class=\"dot\" style=\"background: #1A73E8\"><\/span>High-value top-uppers <span class=\"num\" style=\"font-weight: 500\">10%<\/span><\/span>\n            <span style=\"display: inline-flex; align-items: center; gap: 6px\"><span class=\"dot\" style=\"background: #D93025\"><\/span>Stalled at OTP <span class=\"num\" style=\"font-weight: 500\">9%<\/span><\/span>\n            <span style=\"display: inline-flex; align-items: center; gap: 6px\"><span class=\"dot\" style=\"background: #F9AB00\"><\/span>Load-first store owners <span class=\"num\" style=\"font-weight: 500\">4%<\/span><\/span>\n            <span style=\"display: inline-flex; align-items: center; gap: 6px\"><span class=\"dot\" style=\"background: #5F6368\"><\/span>Shared-device <span class=\"num\" style=\"font-weight: 500\">2%<\/span><\/span>\n            <span style=\"display: inline-flex; align-items: center; gap: 6px; color: #5F6368\"><span class=\"dot\" style=\"background: #DADCE0\"><\/span>Not yet grouped <span class=\"num\">37%<\/span><\/span>\n          <\/div>\n        <\/section>\n\n        <section aria-label=\"Definitions and caveats\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px\">\n          <div style=\"display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border: 1px solid #DADCE0; border-radius: 12px; background: #FFFFFF\">\n            <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#5F6368\" stroke-width=\"1.75\" stroke-linecap=\"round\" aria-hidden=\"true\" style=\"margin-top: 2px\"><path d=\"M4 6h16M7 12h10M10 18h4\"><\/path><\/svg>\n            <p style=\"margin: 0; color: #3C4043; font-size: 13px\"><span style=\"font-weight: 500; color: #202124\">User group<\/span> = who someone is (a filter). <span style=\"font-weight: 500; color: #202124\">Audience<\/span> = people Squint groups by behavior across journeys, to act on as a group.<\/p>\n          <\/div>\n          <div style=\"display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; background: #FEF7E0; border-radius: 12px\">\n            <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#B06000\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\" style=\"margin-top: 2px\"><path d=\"M12 4l9 16H3z\"><\/path><path d=\"M12 10v4M12 17v.5\"><\/path><\/svg>\n            <p style=\"margin: 0; color: #3C4043; font-size: 13px\"><span style=\"font-weight: 500; color: #202124\">37% of users aren't grouped yet.<\/span> Return visits and repeat purchases will widen coverage once real numbers replace the mock ones.<\/p>\n          <\/div>\n        <\/section>\n      <\/div>\n    <\/main>\n  <\/div>\n<\/div>", "js": "class Component extends DCLogic {\n  renderVals() {\n    // Mock return-within-7-days rates by user group (illustrative only)\n    const ret = [['Large business', 71], ['Retail', 58], ['Individual', 49], ['Unregistered', 41], ['Individual trader', 29]]\n      .sort((a, b) => b[1] - a[1])\n      .map(([name, v]) => ({\n        name, v: v + '%', w: v + '%',\n        c: name === 'Individual trader' ? '#D93025' : '#8AB4F8',\n        ls: name === 'Individual trader' ? 'font-weight: 500; color: #202124' : 'color: #3C4043'\n      }));\n    return { ret };\n  }\n}"}, "Brief": {"html": "<div style=\"min-height: 100vh; background: #F8F9FA; color: #202124; font-family: 'Google Sans Flex', 'Google Sans', Roboto, system-ui, sans-serif; font-size: 14px; line-height: 20px\">\n  <dc-import name=\"TopBar\" hint-size=\"100%,64px\"><\/dc-import>\n  <div style=\"display: flex; flex-wrap: wrap; align-items: flex-start\">\n    <div style=\"flex: 1 1 256px; max-width: 100%\"><dc-import name=\"NavRail\" active=\"brief\" hint-size=\"256px,640px\"><\/dc-import><\/div>\n    <main style=\"flex: 999 1 560px; min-width: 0; padding: 28px 32px 64px; box-sizing: border-box\">\n      <div style=\"max-width: 1120px; display: flex; flex-direction: column; gap: 24px\">\n\n        <div style=\"display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px\">\n          <div>\n            <h1 style=\"margin: 0; font-size: 28px; line-height: 36px; font-weight: 400\">Weekly brief<\/h1>\n            <p style=\"margin: 4px 0 0; color: #5F6368\"><span style=\"font-weight: 500; color: #202124\">What do we tell the team this week?<\/span> One page: the takeaway, three numbers, what to do.<\/p>\n          <\/div>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n            <button type=\"button\" class=\"btn btn-outlined\">Copy text<\/button>\n            <button type=\"button\" class=\"btn btn-outlined\">Download PDF<\/button>\n            <button type=\"button\" class=\"btn btn-filled\">Share<\/button>\n          <\/div>\n        <\/div>\n\n        <dc-import name=\"ScopeBar\" hint-size=\"100%,40px\"><\/dc-import>\n\n        <article style=\"max-width: 760px; width: 100%; box-sizing: border-box; margin: 0 auto; background: #FFFFFF; border: 1px solid #DADCE0; border-radius: 12px; padding: 48px 56px; display: flex; flex-direction: column; gap: 32px\">\n          <header style=\"display: flex; flex-direction: column; gap: 12px\">\n            <div class=\"cap\" style=\"display: flex; flex-wrap: wrap; gap: 8px; align-items: center\">\n              <svg width=\"20\" height=\"20\" viewBox=\"30 30 545 545\" aria-hidden=\"true\"><g fill=\"none\" stroke-width=\"72\" stroke-linecap=\"round\"><path d=\"M165.2 100.8A188 188 0 0 1 358.8 100.8\" stroke=\"#FBBC04\"><\/path><path d=\"M423.2 165.2A188 188 0 0 1 423.2 358.8\" stroke=\"#4285F4\"><\/path><path d=\"M358.8 423.2A188 188 0 0 1 165.2 423.2\" stroke=\"#EA4335\"><\/path><path d=\"M100.8 358.8A188 188 0 0 1 100.8 165.2\" stroke=\"#34A853\"><\/path><path d=\"M432 432L528 528\" stroke=\"#202124\"><\/path><\/g><circle cx=\"262\" cy=\"262\" r=\"34\" fill=\"#4285F4\"><\/circle><\/svg>\n              <span>Squint weekly brief · All users · Oct 8–14, 2026<\/span>\n            <\/div>\n            <h2 style=\"margin: 0; font-size: 28px; line-height: 36px; font-weight: 400\">Fix <span style=\"font-weight: 500\">Send money checkout<\/span> for individual traders<\/h2>\n            <p style=\"margin: 0; font-size: 16px; line-height: 24px; color: #5F6368\">The payment call is timing out. Sign-up completion also slipped 4.3 points, with an OTP spike on Oct 9.<\/p>\n          <\/header>\n\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 0; border: 1px solid #E8EAED; border-radius: 8px\">\n            <div style=\"padding: 16px 20px; border-right: 1px solid #E8EAED\"><div class=\"lbl\">Sign-up completion<\/div><div class=\"num\" style=\"font-size: 24px; line-height: 32px\">76.5%<\/div><div class=\"num\" style=\"font-size: 12px; color: #C5221F\">−4.3 pts<\/div><\/div>\n            <div style=\"padding: 16px 20px; border-right: 1px solid #E8EAED\"><div class=\"lbl\">Value at risk<\/div><div class=\"num\" style=\"font-size: 24px; line-height: 32px\">₱18,154/wk<\/div><div class=\"num\" style=\"font-size: 12px; color: #C5221F\">+₱2,940 · estimate<\/div><\/div>\n            <div style=\"padding: 16px 20px\"><div class=\"lbl\">Open problems<\/div><div class=\"num\" style=\"font-size: 24px; line-height: 32px\">3<\/div><div style=\"font-size: 12px; color: #5F6368\">2 critical · 1 warning<\/div><\/div>\n          <\/div>\n\n          <section aria-labelledby=\"b-do\" style=\"display: flex; flex-direction: column; gap: 18px\">\n            <h3 id=\"b-do\" class=\"sec\">What to do this week, and why<\/h3>\n            <div class=\"li\"><span class=\"n\">1<\/span><div style=\"display: flex; flex-direction: column; gap: 4px\">\n              <div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px\"><span style=\"color: #202124\">Fix <span style=\"font-weight: 500\">Send money checkout<\/span> for individual traders<\/span><span class=\"cap\">Engineering · [OWNER]<\/span><\/div>\n              <p style=\"margin: 0; color: #5F6368\">Payment call timing out. 61% of their sessions end at checkout, vs 9% for everyone else. About ₱3,780 a week.<\/p>\n            <\/div><\/div>\n            <div class=\"li\"><span class=\"n\">2<\/span><div style=\"display: flex; flex-direction: column; gap: 4px\">\n              <div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px\"><span style=\"color: #202124\">Investigate <span style=\"font-weight: 500\">OTP code<\/span> for all users <span style=\"color: #5F6368\">· Oct 9, 02:00–10:00 UTC<\/span><\/span><span class=\"cap\">Engineering · [OWNER]<\/span><\/div>\n              <p style=\"margin: 0; color: #5F6368\">Codes likely not arriving: exits rose from 5% to 68% and people kept tapping Resend code. About ₱2,940 a week.<\/p>\n            <\/div><\/div>\n            <div class=\"li\"><span class=\"n\">3<\/span><div style=\"display: flex; flex-direction: column; gap: 4px\">\n              <div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px\"><span style=\"color: #202124\">Rewrite <span style=\"font-weight: 500\">Personal data labels<\/span> for all users <span style=\"color: #5F6368\">· worst for individual traders<\/span><\/span><span class=\"cap\">Design · [OWNER]<\/span><\/div>\n              <p style=\"margin: 0; color: #5F6368\">Long pauses, few errors. 18% leave every week, up to 32% of individual traders.<\/p>\n            <\/div><\/div>\n          <\/section>\n\n          <section aria-labelledby=\"b-fine\" style=\"display: flex; flex-direction: column; gap: 10px\">\n            <h3 id=\"b-fine\" class=\"sec\">What to leave alone<\/h3>\n            <div style=\"display: flex; flex-direction: column; gap: 4px\">\n              <span>Keep <span style=\"font-weight: 500\">exit paths<\/span> pop-up free for all users<\/span>\n              <span style=\"color: #5F6368\">55% of exits are natural, with no sign of struggle.<\/span>\n            <\/div>\n            <div style=\"display: flex; flex-direction: column; gap: 4px\">\n              <span>Keep <span style=\"font-weight: 500\">Top-up flow<\/span> as is for large businesses<\/span>\n              <span style=\"color: #5F6368\">87% of their top-ups exceed ₱5,000, with low errors. Growth may target them with promos; the screens need no change.<\/span>\n            <\/div>\n          <\/section>\n\n          <footer style=\"padding-top: 20px; border-top: 1px solid #E8EAED; display: flex; flex-direction: column; gap: 6px\">\n            <span class=\"lbl\">Data notes<\/span>\n            <span class=\"cap\">99.6% of events read. The KYC selfie tracker is silent on app 4.12; 59 sessions inside tracking faults were set aside. Money is estimated at ₱150 per sign-up, ₱100 per top-up and ₱200 per transaction. Sample dataset, synthetic.<\/span>\n          <\/footer>\n        <\/article>\n      <\/div>\n    <\/main>\n  <\/div>\n<\/div>", "js": "class Component extends DCLogic {\n  renderVals() {\n    return {};\n  }\n}"}, "Components": {"html": "<div style=\"width: 1440px; min-height: 1700px; box-sizing: border-box; padding: 56px 64px; background: #F8F9FA; color: #202124; font-family: 'Google Sans Flex', 'Google Sans', Roboto, system-ui, sans-serif; font-size: 14px; line-height: 20px; display: flex; flex-direction: column; gap: 32px\">\n  <div>\n    <h1 style=\"margin: 0; font-size: 32px; line-height: 40px; font-weight: 400\">Header, filters and supporting components<\/h1>\n    <p style=\"margin: 8px 0 0; color: #5F6368\">Google palette and type. One meaning per color, one label set for causes everywhere.<\/p>\n  <\/div>\n\n  <section class=\"box\" aria-labelledby=\"c-top\" style=\"padding: 0; overflow: hidden; gap: 0\">\n    <div style=\"padding: 20px 24px 16px\"><h2 id=\"c-top\" class=\"sec\">Top app bar<\/h2><p class=\"cap\" style=\"margin: 4px 0 0\">Brand · Ask (always available) · data-trust pill · help, settings, account. Theme and currency moved into settings.<\/p><\/div>\n    <dc-import name=\"TopBar\" hint-size=\"100%,64px\"><\/dc-import>\n  <\/section>\n\n  <section class=\"box\" aria-labelledby=\"c-scope\" style=\"min-height: 420px\">\n    <div><h2 id=\"c-scope\" class=\"sec\">Scope bar<\/h2><p class=\"cap\" style=\"margin: 4px 0 0\">Sits under each page title so the scope reads as part of the page. User group is one menu with counts instead of seven chips. Shown open.<\/p><\/div>\n    <dc-import name=\"ScopeBar\" open=\"{{ true }}\" hint-size=\"100%,40px\"><\/dc-import>\n  <\/section>\n\n  <div style=\"display: grid; grid-template-columns: 256px 1fr; gap: 24px; align-items: start\">\n    <section class=\"box\" aria-labelledby=\"c-nav\" style=\"padding: 20px 0 0; gap: 8px\">\n      <div style=\"padding: 0 20px\"><h2 id=\"c-nav\" class=\"sec\">Navigation<\/h2><p class=\"cap\" style=\"margin: 4px 0 0\">Grouped by pyramid level<\/p><\/div>\n      <dc-import name=\"NavRail\" active=\"overview\" hint-size=\"256px,640px\"><\/dc-import>\n    <\/section>\n\n    <div style=\"display: flex; flex-direction: column; gap: 24px\">\n      <section class=\"box\" aria-labelledby=\"c-status\">\n        <h2 id=\"c-status\" class=\"sec\">Status and classification<\/h2>\n        <div style=\"display: grid; grid-template-columns: 160px 1fr; gap: 16px 24px; align-items: center\">\n          <span class=\"lbl\">Severity · cause (one chip)<\/span>\n          <div class=\"row\"><span class=\"chip\" style=\"background: #FCE8E6; color: #C5221F\"><span class=\"dot\" style=\"background: #D93025\"><\/span>Critical · Bug<\/span><span class=\"chip\" style=\"background: #FEF7E0; color: #B06000\"><span class=\"dot\" style=\"background: #1A73E8\"><\/span>Warning · Wording<\/span><span class=\"chip\" style=\"background: #F1F3F4; color: #3C4043\"><span class=\"dot\" style=\"background: #F9AB00\"><\/span>Watch · UX<\/span><span class=\"chip\" style=\"background: #E6F4EA; color: #137333\">Keep<\/span><\/div>\n          <span class=\"lbl\">Cause colours (PRD types)<\/span>\n          <div class=\"row\"><span class=\"chip chip-o\"><span class=\"dot\" style=\"background: #D93025\"><\/span>Technical bug<\/span><span class=\"chip chip-o\"><span class=\"dot\" style=\"background: #F9AB00\"><\/span>UX friction<\/span><span class=\"chip chip-o\"><span class=\"dot\" style=\"background: #1A73E8\"><\/span>Confusing wording<\/span><span class=\"chip chip-o\"><span class=\"dot\" style=\"background: #BDC1C6\"><\/span>Natural exit<\/span><\/div>\n          <span class=\"lbl\">Risk type (Journeys list)<\/span>\n          <div class=\"row\"><span class=\"chip\" style=\"background: #E8F0FE; color: #174EA6\">Segment risk<\/span><span class=\"chip\" style=\"background: #E8F0FE; color: #174EA6\">Blind spot<\/span><span class=\"chip\" style=\"background: #FEF7E0; color: #B06000\">Data gap<\/span><\/div>\n          <span class=\"lbl\">Headline grammar<\/span>\n          <div style=\"display: flex; flex-direction: column; gap: 4px\"><span style=\"font-size: 16px\">Investigate <span style=\"font-weight: 500\">OTP code<\/span> for all users <span style=\"color: #5F6368\">· worst for individual traders<\/span><\/span><span class=\"cap\">[Action] [Item] for [Who] · context. Screen verbs: Fix · Investigate · Rewrite · Simplify · Keep. People verbs: Target · Win back · Protect · Keep.<\/span><\/div>\n          <span class=\"lbl\">Where a line came from<\/span>\n          <div class=\"row\"><span class=\"tag\">Calculated<\/span><span class=\"tag tag-ai\">AI<\/span><\/div>\n          <span class=\"lbl\">Confidence<\/span>\n          <div class=\"row\" style=\"gap: 24px\">\n            <span style=\"display: inline-flex; align-items: center; gap: 8px\">High<span class=\"bars\" aria-hidden=\"true\"><span style=\"height: 8px; background: #1A73E8\"><\/span><span style=\"height: 12px; background: #1A73E8\"><\/span><span style=\"height: 16px; background: #1A73E8\"><\/span><\/span><\/span>\n            <span style=\"display: inline-flex; align-items: center; gap: 8px\">Medium<span class=\"bars\" aria-hidden=\"true\"><span style=\"height: 8px; background: #1A73E8\"><\/span><span style=\"height: 12px; background: #1A73E8\"><\/span><span style=\"height: 16px; background: #DADCE0\"><\/span><\/span><\/span>\n            <span style=\"display: inline-flex; align-items: center; gap: 8px\">Low<span class=\"bars\" aria-hidden=\"true\"><span style=\"height: 8px; background: #1A73E8\"><\/span><span style=\"height: 12px; background: #DADCE0\"><\/span><span style=\"height: 16px; background: #DADCE0\"><\/span><\/span><\/span>\n          <\/div>\n          <span class=\"lbl\">Data trust pill<\/span>\n          <div style=\"display: flex; flex-direction: column; gap: 8px\"><div class=\"row\"><span class=\"pill\"><span class=\"dot\" style=\"background: #1E8E3E\"><\/span>Data reliable <span style=\"font-weight: 400; color: #5F6368\">· 1 note<\/span><\/span><span class=\"pill\"><span class=\"dot\" style=\"background: #F9AB00\"><\/span>Data: 1 fault affects findings<\/span><span class=\"pill\" style=\"border-color: #F6AEA9; background: #FFFBFA\"><span class=\"dot\" style=\"background: #D93025\"><\/span>Data: pipeline down, findings paused<\/span><\/div><span class=\"cap\">Yellow only when a fault touches an open problem. The pill and the Overview trust line always say the same thing.<\/span><\/div>\n        <\/div>\n      <\/section>\n\n      <section class=\"box\" aria-labelledby=\"c-btn\">\n        <h2 id=\"c-btn\" class=\"sec\">Buttons, one primary per card<\/h2>\n        <div class=\"row\">\n          <button type=\"button\" class=\"btn btn-filled\">See why<\/button>\n          <button type=\"button\" class=\"btn btn-tonal\">Draft ticket<\/button>\n          <button type=\"button\" class=\"btn btn-outlined\">Watch sessions<\/button>\n          <button type=\"button\" class=\"btn btn-text\">Snooze a week<\/button>\n          <button type=\"button\" aria-label=\"More actions\" style=\"width: 40px; height: 40px; border-radius: 20px; border: 0; background: #F1F3F4; color: #5F6368; display: inline-flex; align-items: center; justify-content: center\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"currentColor\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"5\" r=\"1.8\"><\/circle><circle cx=\"12\" cy=\"12\" r=\"1.8\"><\/circle><circle cx=\"12\" cy=\"19\" r=\"1.8\"><\/circle><\/svg><\/button>\n        <\/div>\n        <p class=\"cap\" style=\"margin: 0\">Filled = go deeper · Tonal = act · Outlined = secondary · Text = low-stakes · Icon = overflow (snooze, mark fixed)<\/p>\n      <\/section>\n\n      <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px\">\n        <section class=\"box\" aria-labelledby=\"c-col\">\n          <h2 id=\"c-col\" class=\"sec\">Color<\/h2>\n          <div style=\"display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px\">\n            <div><div class=\"sw\" style=\"background: #1A73E8\"><\/div><div style=\"font-weight: 500; margin-top: 6px\">Blue 600<\/div><div class=\"cap\">#1A73E8 · action, wording<\/div><\/div>\n            <div><div class=\"sw\" style=\"background: #D93025\"><\/div><div style=\"font-weight: 500; margin-top: 6px\">Red 600<\/div><div class=\"cap\">#D93025 · critical, bug<\/div><\/div>\n            <div><div class=\"sw\" style=\"background: #F9AB00\"><\/div><div style=\"font-weight: 500; margin-top: 6px\">Yellow 600<\/div><div class=\"cap\">#F9AB00 · warning, UX<\/div><\/div>\n            <div><div class=\"sw\" style=\"background: #1E8E3E\"><\/div><div style=\"font-weight: 500; margin-top: 6px\">Green 600<\/div><div class=\"cap\">#1E8E3E · healthy only<\/div><\/div>\n            <div><div class=\"sw\" style=\"background: #202124\"><\/div><div style=\"font-weight: 500; margin-top: 6px\">Grey 900<\/div><div class=\"cap\">#202124 · text<\/div><\/div>\n            <div><div class=\"sw\" style=\"background: #5F6368\"><\/div><div style=\"font-weight: 500; margin-top: 6px\">Grey 700<\/div><div class=\"cap\">#5F6368 · secondary<\/div><\/div>\n            <div><div class=\"sw\" style=\"background: #DADCE0\"><\/div><div style=\"font-weight: 500; margin-top: 6px\">Grey 300<\/div><div class=\"cap\">#DADCE0 · borders<\/div><\/div>\n            <div><div class=\"sw\" style=\"background: #F8F9FA; border: 1px solid #DADCE0; box-sizing: border-box\"><\/div><div style=\"font-weight: 500; margin-top: 6px\">Grey 50<\/div><div class=\"cap\">#F8F9FA · page<\/div><\/div>\n          <\/div>\n        <\/section>\n        <section class=\"box\" aria-labelledby=\"c-type\">\n          <h2 id=\"c-type\" class=\"sec\">Type: Google Sans<\/h2>\n          <div style=\"display: flex; flex-direction: column; gap: 14px\">\n            <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 16px\"><span style=\"font-size: 28px; line-height: 36px\">Page title<\/span><span class=\"cap\">28/36 · 400<\/span><\/div>\n            <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 16px\"><span style=\"font-size: 24px; line-height: 32px\">Takeaway sentence<\/span><span class=\"cap\">24/32 · 400<\/span><\/div>\n            <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 16px\"><span style=\"font-size: 18px; line-height: 24px; font-weight: 500\">Section and card title<\/span><span class=\"cap\">18/24 · 500<\/span><\/div>\n            <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 16px\"><span>Body and table text<\/span><span class=\"cap\">14/20 · 400<\/span><\/div>\n            <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 16px\"><span class=\"lbl\">Label and caption<\/span><span class=\"cap\">12/16 · 500<\/span><\/div>\n          <\/div>\n        <\/section>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/div>", "js": "class Component extends DCLogic {\n  renderVals() {\n    return {};\n  }\n}"}, "DataSources": {"html": "<div style=\"min-height: 100vh; background: #F8F9FA; color: #202124; font-family: 'Google Sans Flex', 'Google Sans', Roboto, system-ui, sans-serif; font-size: 14px; line-height: 20px\">\n  <dc-import name=\"TopBar\" hint-size=\"100%,64px\"><\/dc-import>\n  <div style=\"display: flex; flex-wrap: wrap; align-items: flex-start\">\n    <div style=\"flex: 1 1 256px; max-width: 100%\"><dc-import name=\"NavRail\" active=\"data\" hint-size=\"256px,640px\"><\/dc-import><\/div>\n    <main style=\"flex: 999 1 560px; min-width: 0; padding: 28px 32px 64px; box-sizing: border-box\">\n      <div style=\"max-width: 1120px; display: flex; flex-direction: column; gap: 24px\">\n\n        <div>\n          <h1 style=\"margin: 0; font-size: 28px; line-height: 36px; font-weight: 400\">Data sources<\/h1>\n          <p style=\"margin: 4px 0 0; color: #5F6368\"><span style=\"font-weight: 500; color: #202124\">What can Squint see, and what's missing?<\/span> Connect a source to unlock the rest.<\/p>\n        <\/div>\n\n        <section class=\"card\" aria-labelledby=\"connect\" style=\"padding: 28px 32px; display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start\">\n          <figure style=\"margin: 0; flex: 0 1 300px; display: flex; flex-direction: column; gap: 12px\" role=\"img\" aria-label=\"Today Squint reads the app tracker. A backend database would add payments and orders.\">\n            <div style=\"display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 12px; background: #E6F4EA\">\n              <svg width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#137333\" stroke-width=\"1.75\" aria-hidden=\"true\"><rect x=\"7\" y=\"3\" width=\"10\" height=\"18\" rx=\"2\"><\/rect><path d=\"M11 18h2\"><\/path><\/svg>\n              <div style=\"display: flex; flex-direction: column\"><span style=\"font-weight: 500\">App tracker<\/span><span class=\"cap\" style=\"color: #137333\">Connected · taps, screens, errors<\/span><\/div>\n            <\/div>\n            <div style=\"display: flex; justify-content: center; color: #9AA0A6\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"><\/path><\/svg><\/div>\n            <div style=\"display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 12px; border: 2px dashed #8AB4F8; background: #F8FBFF\">\n              <svg width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1A73E8\" stroke-width=\"1.75\" aria-hidden=\"true\"><ellipse cx=\"12\" cy=\"6\" rx=\"7\" ry=\"3\"><\/ellipse><path d=\"M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3\"><\/path><\/svg>\n              <div style=\"display: flex; flex-direction: column\"><span style=\"font-weight: 500\">Backend database<\/span><span class=\"cap\" style=\"color: #174EA6\">Not connected · payments, orders, ledger<\/span><\/div>\n            <\/div>\n          <\/figure>\n\n          <div style=\"flex: 1 1 400px; min-width: 0; display: flex; flex-direction: column; gap: 16px\">\n            <div style=\"display: flex; align-items: center; gap: 8px\">\n              <h2 id=\"connect\" style=\"margin: 0; font-size: 14px; line-height: 20px; font-weight: 500; color: #1967D2\">Biggest gap in your data<\/h2>\n              <span class=\"chip\" style=\"background: #F1F3F4; color: #3C4043\">3 signals locked<\/span>\n            <\/div>\n            <p style=\"margin: 0; font-size: 26px; line-height: 34px\">Connect a <span style=\"font-weight: 500\">backend database<\/span> to see real value<\/p>\n            <div style=\"display: flex; flex-direction: column; gap: 8px\">\n              <span style=\"display: flex; gap: 10px; align-items: baseline\"><span class=\"dot\" style=\"background: #1A73E8\"><\/span><span><span style=\"font-weight: 500\">Lifetime value<\/span> <span style=\"color: #5F6368\">· audiences by real ₱<\/span><\/span><\/span>\n              <span style=\"display: flex; gap: 10px; align-items: baseline\"><span class=\"dot\" style=\"background: #1A73E8\"><\/span><span><span style=\"font-weight: 500\">Accurate repeat purchases<\/span> <span style=\"color: #5F6368\">· includes refunds and offline payments<\/span><\/span><\/span>\n              <span style=\"display: flex; gap: 10px; align-items: baseline\"><span class=\"dot\" style=\"background: #1A73E8\"><\/span><span><span style=\"font-weight: 500\">Real value at risk<\/span> <span style=\"color: #5F6368\">· replaces today's ₱150 / ₱100 / ₱200 estimates<\/span><\/span><\/span>\n            <\/div>\n            <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px\">\n              <label class=\"opt\"><input type=\"radio\" name=\"db\" checked=\"true\" style=\"width: 18px; height: 18px; accent-color: #1A73E8; margin: 0\"><span style=\"font-weight: 500\">BigQuery<\/span><\/label>\n              <label class=\"opt\"><input type=\"radio\" name=\"db\" style=\"width: 18px; height: 18px; accent-color: #1A73E8; margin: 0\"><span style=\"font-weight: 500\">PostgreSQL<\/span><\/label>\n              <label class=\"opt\"><input type=\"radio\" name=\"db\" style=\"width: 18px; height: 18px; accent-color: #1A73E8; margin: 0\"><span style=\"font-weight: 500\">Snowflake<\/span><\/label>\n            <\/div>\n            <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px\">\n              <button type=\"button\" class=\"btn btn-filled\">Connect database<\/button>\n              <span class=\"cap\">Read-only. Squint needs the orders and payments tables, matched to users by user ID.<\/span>\n            <\/div>\n          <\/div>\n        <\/section>\n\n        <section class=\"card\" aria-labelledby=\"cov\" style=\"padding: 24px\">\n          <h2 id=\"cov\" class=\"h2\">What each signal needs<\/h2>\n          <p class=\"cap\" style=\"margin: 4px 0 16px\">Signals Squint uses, where they come from, and what's ready today<\/p>\n          <div style=\"overflow-x: auto\">\n            <table class=\"tbl\" style=\"min-width: 760px\">\n              <thead><tr><th scope=\"col\" style=\"width: 22%\">Signal<\/th><th scope=\"col\" style=\"width: 24%\">Source<\/th><th scope=\"col\" style=\"width: 16%\">Status<\/th><th scope=\"col\">Used for<\/th><\/tr><\/thead>\n              <tbody>\n                <template data-sc=\"for\" list=\"{{signals}}\" as=\"s\" hint-placeholder-count=\"7\">\n                  <tr>\n                    <td style=\"font-weight: 500\">{{s.name}}<\/td>\n                    <td style=\"color: #3C4043\">{{s.source}}<\/td>\n                    <td><span class=\"chip\" style=\"background: {{s.bg}}; color: {{s.fg}}\">{{s.status}}<\/span><\/td>\n                    <td style=\"color: #3C4043\">{{s.use}}<\/td>\n                  <\/tr>\n                <\/template>\n              <\/tbody>\n            <\/table>\n          <\/div>\n        <\/section>\n\n        <section class=\"card\" aria-labelledby=\"health\" style=\"padding: 24px; display: flex; flex-direction: column; gap: 16px\">\n          <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 12px\">\n            <h2 id=\"health\" class=\"h2\">Data health<\/h2>\n            <span class=\"cap\">Checked before any AI analysis runs, so a broken tracker is never mistaken for user behavior<\/span>\n          <\/div>\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px\">\n            <div style=\"padding: 16px; border: 1px solid #E8EAED; border-radius: 8px\"><div style=\"display: flex; align-items: center; gap: 8px\" class=\"lbl\"><span class=\"dot\" style=\"background: #1E8E3E\"><\/span>Event volume<\/div><div class=\"num\" style=\"font-size: 24px; line-height: 32px; margin-top: 4px\">+2.9%<\/div><div class=\"cap\">vs the 7 days before<\/div><\/div>\n            <div style=\"padding: 16px; border: 1px solid #E8EAED; border-radius: 8px\"><div style=\"display: flex; align-items: center; gap: 8px\" class=\"lbl\"><span class=\"dot\" style=\"background: #1E8E3E\"><\/span>Events read<\/div><div class=\"num\" style=\"font-size: 24px; line-height: 32px; margin-top: 4px\">99.6%<\/div><div class=\"cap\">fully matched to a step<\/div><\/div>\n            <div style=\"padding: 16px; border: 1px solid #F6AEA9; border-radius: 8px; background: #FFFBFA\"><div style=\"display: flex; align-items: center; gap: 8px\" class=\"lbl\"><span class=\"dot\" style=\"background: #D93025\"><\/span>Trackers firing<\/div><div class=\"num\" style=\"font-size: 24px; line-height: 32px; margin-top: 4px\">17 of 18<\/div><div class=\"cap\">KYC selfie is silent on app 4.12<\/div><\/div>\n            <div style=\"padding: 16px; border: 1px solid #E8EAED; border-radius: 8px\"><div style=\"display: flex; align-items: center; gap: 8px\" class=\"lbl\"><span class=\"dot\" style=\"background: #F9AB00\"><\/span>Sessions set aside<\/div><div class=\"num\" style=\"font-size: 24px; line-height: 32px; margin-top: 4px\">59<\/div><div class=\"cap\">inside a tracking fault<\/div><\/div>\n          <\/div>\n        <\/section>\n\n        <section class=\"card\" aria-labelledby=\"src\" style=\"padding: 24px; display: flex; flex-direction: column; gap: 12px\">\n          <h2 id=\"src\" class=\"h2\">Connected sources<\/h2>\n          <div style=\"display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; align-items: center; padding: 12px 0; border-top: 1px solid #F1F3F4\">\n            <span><span style=\"font-weight: 500\">App tracker<\/span> <span class=\"cap\">· sample dataset, synthetic · 203,757 events · 18,870 sessions · 1,000 users<\/span><\/span>\n            <span class=\"chip\" style=\"background: #E6F4EA; color: #137333\">Connected<\/span>\n          <\/div>\n          <div style=\"display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; align-items: center; padding: 12px 0; border-top: 1px solid #F1F3F4\">\n            <span><span style=\"font-weight: 500\">Journey steps<\/span> <span class=\"cap\">· 16 of 16 matched to raw events · 0 to review<\/span><\/span>\n            <button type=\"button\" style=\"border: 0; background: transparent; padding: 0; font-family: inherit; font-size: 14px; font-weight: 500; color: #1A73E8; cursor: pointer\">Review steps<\/button>\n          <\/div>\n          <div style=\"display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; align-items: center; padding: 12px 0; border-top: 1px solid #F1F3F4\">\n            <span><span style=\"font-weight: 500\">Upload JSON events<\/span> <span class=\"cap\">· for a one-off file<\/span><\/span>\n            <button type=\"button\" class=\"btn btn-outlined\" style=\"height: 36px\">Upload<\/button>\n          <\/div>\n        <\/section>\n\n        <section class=\"card\" aria-labelledby=\"prefs\" style=\"padding: 24px; display: flex; flex-direction: column; gap: 16px\">\n          <h2 id=\"prefs\" class=\"h2\">Preferences<\/h2>\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px 24px\">\n            <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px\"><span>Currency<\/span><div class=\"seg\" role=\"group\" aria-label=\"Currency\"><button type=\"button\" aria-pressed=\"true\" style=\"background: #E8F0FE; color: #174EA6\">₱ PHP<\/button><button type=\"button\" aria-pressed=\"false\">$ USD<\/button><\/div><\/div>\n            <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px\"><span>Theme<\/span><div class=\"seg\" role=\"group\" aria-label=\"Theme\"><button type=\"button\" aria-pressed=\"false\">Light<\/button><button type=\"button\" aria-pressed=\"false\">Dark<\/button><button type=\"button\" aria-pressed=\"true\" style=\"background: #E8F0FE; color: #174EA6\">System<\/button><\/div><\/div>\n            <div style=\"display: flex; flex-direction: column; gap: 4px\"><span>Value per completed task<\/span><span class=\"cap\">₱150 sign-up · ₱100 top-up · ₱200 transaction. Estimates until a backend database is connected.<\/span><\/div>\n          <\/div>\n        <\/section>\n      <\/div>\n    <\/main>\n  <\/div>\n<\/div>", "js": "class Component extends DCLogic {\n  renderVals() {\n    const st = {\n      ready: ['Ready', '#E6F4EA', '#137333'],\n      avail: ['Available', '#E8F0FE', '#174EA6'],\n      partial: ['Partial', '#FEF7E0', '#B06000'],\n      locked: ['Needs backend', '#F1F3F4', '#3C4043'],\n      future: ['Later', '#FFFFFF', '#5F6368']\n    };\n    const signals = [\n      ['Drop-offs and friction', 'App tracker', 'ready', 'Journeys, Overview problems'],\n      ['Return visits', 'App tracker', 'avail', 'Win-back audiences, \"never returned\" counts'],\n      ['Repeat purchases', 'App tracker · backend for accuracy', 'partial', 'Loyal and one-time buyer audiences'],\n      ['Lifetime value', 'Backend database', 'locked', 'High-value audiences by real ₱'],\n      ['Value at risk (₱)', 'Estimate today · backend for real values', 'partial', 'Problem ranking, weekly brief'],\n      ['Support tickets and reviews', 'Help desk, app stores', 'future', 'Grounding why people leave in their own words']\n    ].map(([name, source, k, use]) => ({ name, source, use, status: st[k][0], bg: st[k][1], fg: st[k][2] }));\n    return { signals };\n  }\n}"}, "DeckSlide1": {"html": "<section style=\"width: 1280px; height: 720px; box-sizing: border-box; padding: 64px 80px 40px; background: #FFFFFF; font-family: 'Google Sans Flex', 'Google Sans', Roboto, system-ui, sans-serif; color: #202124; display: flex; flex-direction: column; gap: 28px\">\n  <div style=\"display: flex; align-items: center; gap: 12px\">\n    <svg width=\"28\" height=\"28\" viewBox=\"30 30 545 545\" aria-hidden=\"true\"><g fill=\"none\" stroke-width=\"72\" stroke-linecap=\"round\"><path d=\"M165.2 100.8A188 188 0 0 1 358.8 100.8\" stroke=\"#FBBC04\"><\/path><path d=\"M423.2 165.2A188 188 0 0 1 423.2 358.8\" stroke=\"#4285F4\"><\/path><path d=\"M358.8 423.2A188 188 0 0 1 165.2 423.2\" stroke=\"#EA4335\"><\/path><path d=\"M100.8 358.8A188 188 0 0 1 100.8 165.2\" stroke=\"#34A853\"><\/path><path d=\"M432 432L528 528\" stroke=\"#202124\"><\/path><\/g><circle cx=\"262\" cy=\"262\" r=\"34\" fill=\"#4285F4\"><\/circle><\/svg>\n    <span style=\"font-size: 18px; line-height: 24px; color: #5F6368\">{{eyebrow}}<\/span>\n    <span style=\"margin-left: auto; font-size: 16px; color: #5F6368; font-variant-numeric: tabular-nums\">{{n}} / 4<\/span>\n  <\/div>\n\n  <div style=\"display: flex; flex-direction: column; gap: 12px\">\n    <h1 style=\"margin: 0; font-size: 48px; line-height: 56px; font-weight: 400\">{{headA}} <span style=\"font-weight: 500\">{{headB}}<\/span> {{headC}}<\/h1>\n    <p style=\"margin: 0; font-size: 24px; line-height: 32px; color: #5F6368\">{{sub}}<\/p>\n  <\/div>\n\n  <template data-sc=\"if\" value=\"{{isSummary}}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; align-items: stretch\">\n      <template data-sc=\"for\" list=\"{{stats}}\" as=\"s\" hint-placeholder-count=\"3\">\n        <div style=\"border: 1px solid #DADCE0; border-radius: 20px; padding: 28px 32px; display: flex; flex-direction: column; gap: 8px\">\n          <span style=\"font-size: 64px; line-height: 72px; font-variant-numeric: tabular-nums; color: {{s.c}}\">{{s.v}}<\/span>\n          <span style=\"font-size: 20px; line-height: 28px; color: #3C4043\">{{s.label}}<\/span>\n        <\/div>\n      <\/template>\n    <\/div>\n    <div style=\"display: flex; align-items: center; gap: 12px; font-size: 22px; line-height: 30px\">\n      <span style=\"height: 28px; padding: 0 12px; border-radius: 14px; background: #E8F0FE; color: #174EA6; font-size: 15px; font-weight: 500; display: inline-flex; align-items: center\">Why · AI<\/span>\n      Codes likely aren't arriving. Fix delivery, then win back people who stalled.\n    <\/div>\n  <\/template>\n\n  <template data-sc=\"if\" value=\"{{isChart}}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"flex: 1; display: grid; grid-template-columns: 1fr 1.4fr; gap: 56px; align-items: center\">\n      <div style=\"display: flex; flex-direction: column; gap: 16px\">\n        <span style=\"align-self: flex-start; height: 28px; padding: 0 12px; border-radius: 14px; background: #E8F0FE; color: #174EA6; font-size: 15px; font-weight: 500; display: inline-flex; align-items: center\">Why · AI<\/span>\n        <p style=\"margin: 0; font-size: 26px; line-height: 36px\">{{why}}<\/p>\n        <p style=\"margin: 0; font-size: 18px; line-height: 26px; color: #5F6368\">{{whySub}}<\/p>\n      <\/div>\n      <div style=\"display: flex; flex-direction: column; gap: 22px\">\n        <span style=\"font-size: 16px; font-weight: 500; color: #5F6368\">{{chartTitle}}<\/span>\n        <template data-sc=\"for\" list=\"{{bars}}\" as=\"b\" hint-placeholder-count=\"3\">\n          <div style=\"display: grid; grid-template-columns: 240px 1fr 80px; gap: 20px; align-items: center; font-size: 20px\">\n            <span style=\"{{b.ls}}\">{{b.name}}<\/span>\n            <span style=\"position: relative; height: 18px; border-radius: 9px; background: #F1F3F4\"><span style=\"display: block; height: 100%; width: {{b.w}}; border-radius: 9px; background: {{b.c}}\"><\/span><\/span>\n            <span style=\"text-align: right; font-variant-numeric: tabular-nums; {{b.ls}}\">{{b.v}}<\/span>\n          <\/div>\n        <\/template>\n        <span style=\"font-size: 15px; color: #5F6368\">{{chartNote}}<\/span>\n      <\/div>\n    <\/div>\n  <\/template>\n\n  <div style=\"display: flex; align-items: center; gap: 12px; padding-top: 16px; border-top: 1px solid #E8EAED; font-size: 14px; color: #5F6368\">\n    <span>All users · Oct 8–14, 2026 · data up to Oct 14<\/span>\n    <span style=\"margin-left: auto\">Numbers: calculated by Squint · Why: AI, check the evidence<\/span>\n  <\/div>\n<\/section>", "js": "class Component extends DCLogic {\n  renderVals() {\n    const n = String(this.props.n ?? '1');\n    const red = '#D93025', grey = '#BDC1C6';\n    const bars = (rows, max, fmt) => rows.map(([name, v], i) => ({\n      name, v: fmt(v), w: (v / max * 100).toFixed(1) + '%', c: i === 0 ? red : grey,\n      ls: i === 0 ? 'font-weight: 500; color: #202124' : 'color: #3C4043'\n    }));\n    if (n === '2') return {\n      n, isSummary: false, isChart: true, eyebrow: 'Why people keep tapping Resend code · Answer 1',\n      headA: 'Investigate', headB: 'OTP code', headC: 'for all users', sub: 'P2 · ₱2,940 a week at risk (estimate)',\n      why: 'The code most likely never arrives.',\n      whySub: '89 of 91 people who left hit an error or a tap that did nothing. 62 sessions looped back to Phone number.',\n      chartTitle: 'Where people tap repeatedly · 643 taps',\n      bars: bars([['Resend code / SMS', 457], ['Verify button (left)', 63], ['Verify button (right)', 61]], 457, (v) => String(v)),\n      chartNote: '71% of repeated taps land on Resend code.'\n    };\n    if (n === '3') return {\n      n, isSummary: false, isChart: true, eyebrow: 'Why people keep tapping Resend code · Answer 2',\n      headA: 'Investigate', headB: 'OTP code', headC: 'for individual traders', sub: '7.5% tap repeatedly, against 5.6% overall',\n      why: 'Every group taps repeatedly, so the cause is shared.',\n      whySub: 'Individual traders are hit hardest: the same group that leaves most at this step (15%).',\n      chartTitle: 'Sessions with repeated taps at OTP code',\n      bars: bars([['Individual trader', 7.5], ['Individual', 6.8], ['Large business', 5.9], ['Retail', 5.6], ['Unregistered', 5.4]], 10, (v) => v.toFixed(1) + '%'),\n      chartNote: 'Everyone: 5.6%.'\n    };\n    return {\n      n: '1', isSummary: true, isChart: false, eyebrow: 'Why people keep tapping Resend code · Summary',\n      headA: 'Investigate', headB: 'OTP code', headC: 'for all users', sub: 'Worst for individual traders',\n      stats: [\n        { v: '457', label: 'repeated taps on Resend code', c: red },\n        { v: '89 / 91', label: 'people who left hit an error or a dead tap', c: '#202124' },\n        { v: '7.5%', label: 'of individual traders tap repeatedly, vs 5.6%', c: '#202124' }\n      ]\n    };\n  }\n}"}, "DeckSlide2": {"html": "<dc-import name=\"DeckSlide1\" n=\"2\" hint-size=\"1280px,720px\"><\/dc-import>", "js": "class Component extends DCLogic {\n  renderVals() {\n    return {};\n  }\n}"}, "DeckSlide3": {"html": "<dc-import name=\"DeckSlide1\" n=\"3\" hint-size=\"1280px,720px\"><\/dc-import>", "js": "class Component extends DCLogic {\n  renderVals() {\n    return {};\n  }\n}"}, "FlowPrototype": {"html": "<div style=\"position: relative; min-height: 100vh; font-family: 'Google Sans Flex', 'Google Sans', Roboto, system-ui, sans-serif; color: #202124\">\n\n  <div role=\"note\" style=\"position: sticky; top: 0; z-index: 30; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 8px 20px; background: #202124; color: #FFFFFF; font-size: 13px; line-height: 18px\">\n    <span style=\"font-weight: 500\">Prototype<\/span>\n    <span style=\"color: #BDC1C6\">{{hint}}<\/span>\n    <span style=\"margin-left: auto; display: inline-flex; gap: 6px\">\n      <template data-sc=\"for\" list=\"{{steps}}\" as=\"s\" hint-placeholder-count=\"3\"><span style=\"height: 22px; padding: 0 10px; border-radius: 11px; display: inline-flex; align-items: center; font-size: 12px; {{s.style}}\">{{s.label}}<\/span><\/template>\n    <\/span>\n  <\/div>\n\n  <div aria-hidden=\"{{pageHidden}}\">\n    <dc-import name=\"Journeys\" on-see-why=\"{{openDrawer}}\" on-watch=\"{{openPlayer}}\" hint-size=\"100%,3000px\"><\/dc-import>\n  <\/div>\n\n  <template data-sc=\"if\" value=\"{{drawerOpen}}\" hint-placeholder-val=\"{{ false }}\">\n    <button type=\"button\" aria-label=\"Close drawer\" onClick=\"{{closeDrawer}}\" class=\"sq-anim\" style=\"position: fixed; inset: 0; z-index: 40; border: 0; padding: 0; background: rgba(32,33,36,.42); cursor: pointer; animation: sq-fade .2s ease-out\"><\/button>\n    <div role=\"dialog\" aria-modal=\"true\" aria-label=\"Problem diagnosis\" class=\"sq-anim\" style=\"position: fixed; top: 0; right: 0; bottom: 0; z-index: 41; width: min(560px, 100%); overflow-y: auto; background: #FFFFFF; animation: sq-slide .28s cubic-bezier(.2,0,0,1)\">\n      <dc-import name=\"ProblemDetail\" pid=\"{{drawer}}\" on-close=\"{{closeDrawer}}\" on-watch=\"{{openPlayer}}\" hint-size=\"560px,1900px\"><\/dc-import>\n    <\/div>\n  <\/template>\n\n  <template data-sc=\"if\" value=\"{{playerOpen}}\" hint-placeholder-val=\"{{ false }}\">\n    <div role=\"dialog\" aria-modal=\"true\" aria-label=\"Watch sessions\" class=\"sq-anim\" style=\"position: fixed; inset: 0; z-index: 50; overflow-y: auto; background: #F8F9FA; animation: sq-rise .26s cubic-bezier(.2,0,0,1)\">\n      <dc-import name=\"SessionPlayer\" issue=\"{{player}}\" on-close=\"{{closePlayer}}\" hint-size=\"100%,1100px\"><\/dc-import>\n    <\/div>\n  <\/template>\n<\/div>", "js": "class Component extends DCLogic {\n  renderVals() {\n    const drawer = this.state.drawer ?? null;\n    const player = this.state.player ?? null;\n    const stage = player ? 2 : drawer ? 1 : 0;\n    const labels = ['1 Journeys', '2 See why · drawer', '3 Watch sessions'];\n    const hints = [\n      'Click \"See why\" or \"Watch sessions\" on the large card. Switch journeys or pick another issue in the strip to try P2 and P3.',\n      'The drawer slides over Journeys. Close it (× or click outside) to return, or open Watch sessions from here.',\n      'The player opens full screen. Close it to return to where you were.'\n    ];\n    return {\n      drawer, player, drawerOpen: !!drawer, playerOpen: !!player, pageHidden: stage > 0 ? 'true' : 'false',\n      hint: hints[stage],\n      steps: labels.map((label, i) => ({ label, style: i === stage ? 'background: #8AB4F8; color: #202124; font-weight: 500;' : 'background: #3C4043; color: #BDC1C6;' })),\n      openDrawer: (pid) => this.setState({ drawer: pid, player: null }),\n      closeDrawer: () => this.setState({ drawer: null }),\n      openPlayer: (key) => this.setState({ player: key || 'checkout' }),\n      closePlayer: () => this.setState({ player: null })\n    };\n  }\n}"}, "Journeys": {"html": "<div style=\"min-height: 100vh; background: #F8F9FA; color: #202124; font-family: 'Google Sans Flex', 'Google Sans', Roboto, system-ui, sans-serif; font-size: 14px; line-height: 20px\">\n  <dc-import name=\"TopBar\" hint-size=\"100%,64px\"><\/dc-import>\n  <div style=\"display: flex; flex-wrap: wrap; align-items: flex-start\">\n    <div style=\"flex: 1 1 256px; max-width: 100%\"><dc-import name=\"NavRail\" active=\"journeys\" hint-size=\"256px,640px\"><\/dc-import><\/div>\n    <main style=\"flex: 999 1 560px; min-width: 0; padding: 28px 32px 64px; box-sizing: border-box\">\n      <div style=\"max-width: 1120px; display: flex; flex-direction: column; gap: 24px\">\n\n        <div style=\"display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px\">\n          <div>\n            <div class=\"cap\" style=\"margin-bottom: 4px\"><a href=\"Main.dc.html\" style=\"text-decoration: none; font-weight: 500\">← Overview<\/a> · {{crumb}}<\/div>\n            <h1 style=\"margin: 0; font-size: 28px; line-height: 36px; font-weight: 400\">Journeys<\/h1>\n            <p style=\"margin: 4px 0 0; color: #5F6368\"><span style=\"font-weight: 500; color: #202124\">Where do people leave, and how do they struggle there?<\/span> Fixes here are screen changes.<\/p>\n          <\/div>\n          <div class=\"seg\" role=\"group\" aria-label=\"Journey\">\n            <template data-sc=\"for\" list=\"{{jtabs}}\" as=\"j\" hint-placeholder-count=\"3\">\n              <button type=\"button\" aria-pressed=\"{{j.on}}\" onClick=\"{{j.pick}}\" title=\"{{j.title}}\" style=\"{{j.style}}\">{{j.label}}<template data-sc=\"if\" value=\"{{j.hasBadge}}\" hint-placeholder-val=\"{{ false }}\"><span style=\"height: 18px; padding: 0 6px; border-radius: 9px; background: #FCE8E6; color: #C5221F; font-size: 11px; display: inline-flex; align-items: center\">{{j.badge}}<\/span><\/template><\/button>\n            <\/template>\n          <\/div>\n        <\/div>\n\n        <dc-import name=\"ScopeBar\" hint-size=\"100%,40px\"><\/dc-import>\n\n        <template data-sc=\"if\" value=\"{{isMock}}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 16px; border: 1px dashed #F9AB00; border-radius: 10px; background: #FFFDF5; font-size: 13px\">\n            <span style=\"display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 11px; font-size: 11px; font-weight: 500; background: #FFFFFF; color: #B06000; border: 1px dashed #F9AB00\">Mock data<\/span>\n            <span style=\"color: #3C4043\">Transaction step counts, loops and user-group rates are illustrative until real data arrives. P1's numbers and the per-product rates are from the sample data.<\/span>\n          <\/div>\n        <\/template>\n\n        <!-- Issue strip: dim navigation, sticky -->\n        <nav aria-label=\"Issues in this journey\" style=\"position: sticky; top: 0; z-index: 5; margin: 0 -16px; padding: 0 16px; background: rgba(248,249,250,.97); border-bottom: 1px solid #DADCE0; backdrop-filter: blur(4px)\">\n          <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 0 4px\">\n            <span class=\"lbl\" style=\"margin-right: 8px\">AI-highlighted problems and risks<\/span>\n            <div role=\"tablist\" style=\"display: flex; flex-wrap: wrap\">\n              <template data-sc=\"for\" list=\"{{strip}}\" as=\"s\" hint-placeholder-count=\"4\">\n                <button type=\"button\" role=\"tab\" class=\"issue\" aria-selected=\"{{s.on}}\" onClick=\"{{s.pick}}\" style=\"{{s.style}}\">\n                  <span class=\"rk\" style=\"{{s.rkStyle}}\">{{s.n}}<\/span>\n                  <span class=\"dot\" style=\"background: {{s.dot}}; width: 6px; height: 6px\"><\/span>\n                  {{s.name}}\n                  <span class=\"num\">{{s.share}}<\/span>\n                  <span style=\"font-size: 11px; font-weight: 500; color: {{s.tagColor}}\">{{s.tag}}<\/span>\n                <\/button>\n              <\/template>\n              <template data-sc=\"if\" value=\"{{extraSel}}\" hint-placeholder-val=\"{{ false }}\">\n                <button type=\"button\" role=\"tab\" class=\"issue\" aria-selected=\"true\" style=\"color: #174EA6; font-weight: 500; border-bottom-color: #1A73E8\">\n                  <span class=\"rk\" style=\"background: #1A73E8; color: #FFFFFF\">{{hero.n}}<\/span>{{hero.stripName}}\n                <\/button>\n              <\/template>\n              <button type=\"button\" class=\"issue\" onClick=\"{{toggleList}}\" aria-expanded=\"{{listOpenStr}}\" style=\"color: #1A73E8; font-weight: 500\">{{moreLabel}}<\/button>\n            <\/div>\n            <span class=\"cap\" style=\"margin-left: auto; display: inline-flex; align-items: center; gap: 6px\"><span class=\"dot\" style=\"background: #1E8E3E; width: 6px; height: 6px\"><\/span>{{keepText}}<\/span>\n          <\/div>\n          <template data-sc=\"if\" value=\"{{listOpen}}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin: 0 0 12px; border: 1px solid #E8EAED; border-radius: 10px; background: #FFFFFF; overflow-x: auto\">\n              <div style=\"min-width: 760px\">\n                <template data-sc=\"for\" list=\"{{issues}}\" as=\"r\" hint-placeholder-count=\"7\">\n                  <button type=\"button\" class=\"lrow\" onClick=\"{{r.pick}}\" aria-pressed=\"{{r.on}}\" style=\"{{r.rowStyle}}\">\n                    <span class=\"num\" style=\"text-align: center\">{{r.n}}<\/span>\n                    <span style=\"min-width: 0\">{{r.action}} <span style=\"font-weight: 500; color: #3C4043\">{{r.item}}<\/span> for {{r.who}}<\/span>\n                    <span class=\"num\"><span style=\"color: #3C4043\">{{r.signal}}<\/span> {{r.vs}}<\/span>\n                    <span style=\"display: inline-flex; align-items: center; gap: 6px\"><span class=\"dot\" style=\"background: {{r.dot}}; width: 6px; height: 6px\"><\/span>{{r.type}}<\/span>\n                    <span title=\"{{r.confLabel}} confidence\" style=\"display: inline-flex; gap: 2px; align-items: flex-end\"><span style=\"width: 4px; height: 7px; border-radius: 1px; background: {{r.c1}}\"><\/span><span style=\"width: 4px; height: 11px; border-radius: 1px; background: {{r.c2}}\"><\/span><span style=\"width: 4px; height: 15px; border-radius: 1px; background: {{r.c3}}\"><\/span><\/span>\n                  <\/button>\n                <\/template>\n                <p class=\"cap\" style=\"margin: 0; padding: 10px 16px; border-top: 1px solid #F1F3F4\">Segment risks are listed when one user group is at least 1.5× the overall rate with enough sessions. One-bar confidence means few sessions.<\/p>\n              <\/div>\n            <\/div>\n          <\/template>\n        <\/nav>\n\n        <!-- Hero: the selected issue (bright) -->\n        <section class=\"card\" aria-labelledby=\"hero\" style=\"padding: 28px 32px; display: flex; flex-direction: column; gap: 24px\">\n          <div style=\"display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start\">\n            <figure style=\"margin: 0; display: flex; flex-direction: column; align-items: center; gap: 10px\">\n              <template data-sc=\"if\" value=\"{{vis.otp}}\" hint-placeholder-val=\"{{ true }}\">\n                <div class=\"phone\" role=\"img\" aria-label=\"OTP code screen. 457 repeated taps on Resend code; 63 and 61 on the Verify button.\">\n                  <div style=\"display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500\"><span aria-hidden=\"true\">‹<\/span> Verify your phone<\/div>\n                  <div class=\"bar\" style=\"height: 8px; width: 88%; background: #F1F3F4\"><\/div>\n                  <div class=\"bar\" style=\"height: 8px; width: 64%; background: #F1F3F4\"><\/div>\n                  <div style=\"display: flex; gap: 6px; margin-top: 8px\"><span class=\"field\" style=\"flex: 1; height: 36px\"><\/span><span class=\"field\" style=\"flex: 1; height: 36px\"><\/span><span class=\"field\" style=\"flex: 1; height: 36px\"><\/span><span class=\"field\" style=\"flex: 1; height: 36px\"><\/span><span class=\"field\" style=\"flex: 1; height: 36px\"><\/span><\/div>\n                  <div style=\"flex: 1\"><\/div>\n                  <div style=\"align-self: center; padding: 8px 14px; border-radius: 8px; background: #F1F3F4; font-size: 11px; line-height: 14px; color: #3C4043; text-align: center\">Resend code / receive via SMS<\/div>\n                  <div style=\"height: 22px\"><\/div>\n                  <div style=\"height: 40px; border-radius: 8px; background: #202124; color: #FFFFFF; font-size: 13px; font-weight: 500; display: flex; align-items: center; justify-content: center\">Verify<\/div>\n                  <span class=\"glow\" style=\"width: 120px; height: 120px; left: 55px; top: 237px; background: radial-gradient(circle, rgba(217,48,37,.55) 0%, rgba(217,48,37,.18) 45%, rgba(217,48,37,0) 70%)\"><\/span>\n                  <span class=\"glow\" style=\"width: 56px; height: 56px; left: 60px; top: 348px; background: radial-gradient(circle, rgba(249,171,0,.6) 0%, rgba(249,171,0,0) 70%)\"><\/span>\n                  <span class=\"glow\" style=\"width: 56px; height: 56px; left: 112px; top: 348px; background: radial-gradient(circle, rgba(249,171,0,.6) 0%, rgba(249,171,0,0) 70%)\"><\/span>\n                  <span class=\"badge\" style=\"left: 104px; top: 286px; background: #D93025; color: #FFFFFF\">1<\/span>\n                  <span class=\"badge\" style=\"left: 78px; top: 366px; background: #F9AB00; color: #202124\">2<\/span>\n                  <span class=\"badge\" style=\"left: 130px; top: 366px; background: #F9AB00; color: #202124\">3<\/span>\n                <\/div>\n              <\/template>\n              <template data-sc=\"if\" value=\"{{vis.form}}\" hint-placeholder-val=\"{{ false }}\">\n                <div class=\"phone\" role=\"img\" aria-label=\"Personal data screen with four fields. People pause here for over 30
